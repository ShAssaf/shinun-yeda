name: build & deploy

on:
  push:
    branches: [main]
  # PR נבנה ונבדק לפני המיזוג, ולא מדפלוי. בלי זה תקלה מתגלה רק אחרי
  # שהיא כבר ב-main.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# לכל PR קבוצה משלו — ריצת PR לא תבטל דיפלוי שרץ ב-main
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: תלויות
        run: npm ci --no-audit --no-fund

      - name: הטמעת גופנים
        run: node tools/embed-fonts.mjs

      - name: אייקוני PWA
        run: python3 tools/make-icons.py

      - name: בנייה
        run: node tools/build.mjs

      - name: בדיקת עשן — אם נכשלת, לא מדפלויים
        run: node tools/smoke.mjs

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: www

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
