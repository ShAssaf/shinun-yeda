<title>שינון ידע</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --bg:#EFF3F2; --surface:#FFFFFF; --surface-2:#E4EAE9; --ink:#131C1B; --ink-2:#596967;
  --line:#D2DBD9; --line-2:#BCC8C6;
  --accent:#0E7C72; --on-accent:#FFFFFF;
  --c-o:#CF6F2B; --c-n:#3A76BE; --c-s:#B2900F; --c-p:#A5713C; --c-c:#131C1B; --c-x:#8A4B9E;
  --ok:#1C8555; --ok-bg:#E1F1E9; --bad:#BC4028; --bad-bg:#F8E5E1;
  --shadow:0 1px 2px rgba(19,28,27,.06), 0 8px 24px -12px rgba(19,28,27,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1312; --surface:#141F1D; --surface-2:#1D2A28; --ink:#E9F0EE; --ink-2:#93A5A2;
    --line:#283634; --line-2:#3A4B48;
    --accent:#41BAAA; --on-accent:#06201D;
    --c-o:#EFA262; --c-n:#82B2EE; --c-s:#DFC44B; --c-p:#D3A374; --c-c:#E9F0EE; --c-x:#C48FD8;
    --ok:#4FCB8E; --ok-bg:#122E24; --bad:#F27A5F; --bad-bg:#331A15;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1312; --surface:#141F1D; --surface-2:#1D2A28; --ink:#E9F0EE; --ink-2:#93A5A2;
  --line:#283634; --line-2:#3A4B48;
  --accent:#41BAAA; --on-accent:#06201D;
  --c-o:#EFA262; --c-n:#82B2EE; --c-s:#DFC44B; --c-p:#D3A374; --c-c:#E9F0EE; --c-x:#C48FD8;
  --ok:#4FCB8E; --ok-bg:#122E24; --bad:#F27A5F; --bad-bg:#331A15;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Heebo","Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%; direction:rtl;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{
  max-width:520px; margin:0 auto; min-height:100dvh;
  display:flex; flex-direction:column;
  padding:0 16px calc(20px + env(safe-area-inset-bottom));
}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:14px 2px 10px}
.bar .icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2);background:var(--surface);flex:none;
}
.bar .icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
.bar .title{flex:1;font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track > i{display:block;height:100%;background:var(--accent);border-radius:99px;width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}
.count{
  font-family:"IBM Plex Sans",sans-serif;font-variant-numeric:tabular-nums;
  font-size:13px;color:var(--ink-2);letter-spacing:.02em;flex:none;
}
.count b{color:var(--ink);font-weight:600}

/* ---------- typography ---------- */
.eyebrow{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
}
h1{
  font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;
  font-size:clamp(30px,9vw,42px);line-height:1.1;margin:8px 0 10px;
  text-wrap:balance;letter-spacing:-.01em;
}
.lede{color:var(--ink-2);font-size:15px;line-height:1.6;margin:0;max-width:36ch}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.6;text-align:center;padding:0 8px}

/* ---------- home ---------- */
.home-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:28px 0}
.stats-row{display:flex;gap:10px;width:100%;text-align:right}
.stats-row:hover .stat{border-color:var(--line-2)}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.stat b{
  display:block;font-family:"IBM Plex Sans",sans-serif;font-size:22px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.2;
}
.stat span{font-size:11.5px;color:var(--ink-2)}

.deck-list{display:flex;flex-direction:column;gap:10px}
.deck-card{
  display:flex;align-items:center;gap:13px;text-align:right;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:15px;
  padding:14px;box-shadow:var(--shadow);
  transition:border-color .15s,transform .1s;
}
.deck-card:hover{border-color:var(--accent)}
.deck-card:active{transform:scale(.99)}
.deck-card .dot{width:10px;height:10px;border-radius:99px;flex:none}
.deck-card.more{border-style:dashed;background:transparent;box-shadow:none}
.deck-card.more:hover{background:var(--surface)}
.deck-card.more .txt strong{font-family:"Heebo",sans-serif;font-size:15px;font-weight:500}
.deck-card .more-dot{
  width:auto;height:auto;border-radius:0;color:var(--accent);display:grid;place-items:center;
}
.deck-card.more .prog b{color:var(--line-2)}
.deck-card .txt{flex:1;min-width:0}
.deck-card .txt strong{display:block;font-family:"Frank Ruhl Libre",Georgia,serif;font-size:19px;font-weight:700}
.deck-card .txt span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.deck-card .prog{
  font-family:"IBM Plex Sans",sans-serif;font-size:12px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;flex:none;text-align:center;
  direction:ltr;white-space:nowrap;
}
.deck-card .prog b{display:block;font-size:16px;font-weight:600;color:var(--ink)}

/* ---------- deck screen ---------- */
.deck-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:20px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-title{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:19px;font-weight:700}
.panel-meta{font-family:"IBM Plex Sans",sans-serif;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{
  display:flex;align-items:center;gap:12px;text-align:right;
  border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  background:var(--bg);transition:border-color .15s,background .15s,transform .1s;
}
.mode:hover{border-color:var(--accent);background:var(--surface)}
.mode:active{transform:scale(.99)}
.mode .glyph{
  width:38px;height:38px;flex:none;border-radius:10px;background:var(--surface-2);
  display:grid;place-items:center;color:var(--accent);font-family:"IBM Plex Sans",sans-serif;
  font-size:13px;font-weight:600;
}
.mode .txt{flex:1;min-width:0}
.mode .txt strong{display:block;font-size:15px;font-weight:500}
.mode .txt span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
.mode .arrow{color:var(--line-2);flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.legend span{font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.link-row{display:flex;gap:8px}
.link-btn{
  flex:1;text-align:center;border:1px dashed var(--line-2);border-radius:12px;
  padding:11px;font-size:14px;color:var(--ink-2);
}
.link-btn:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- quiz ---------- */
.quiz{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.prompt-label{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);text-align:center;
}
.stage{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  display:grid;place-items:center;padding:18px 14px;min-height:190px;
  background-image:radial-gradient(var(--line) .8px, transparent .8px);
  background-size:14px 14px;background-position:center;
}
.stage > svg{width:100%;height:auto;max-height:200px}
.stage .q-text{text-align:center;max-width:30ch}
.stage .q-text b{
  display:block;font-family:"Frank Ruhl Libre",Georgia,serif;
  font-size:clamp(24px,7.5vw,34px);font-weight:700;line-height:1.2;
}
.stage .q-text b.ltr{direction:ltr}
.stage .q-text span{display:block;font-size:15px;color:var(--ink-2);margin-top:8px;line-height:1.5}
.el-tile{text-align:center}
.el-tile b{
  display:block;font-family:"IBM Plex Sans",sans-serif;font-size:64px;font-weight:600;
  line-height:1;letter-spacing:-.02em;
}
.el-tile span{display:block;font-size:14px;color:var(--ink-2);margin-top:10px}
.pair{display:flex;align-items:stretch;gap:10px;width:100%}
.pair > div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.pair svg{width:100%;height:auto;max-height:130px}
.pair .tag{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;color:var(--ink-2);
  border:1px solid var(--line);border-radius:6px;padding:1px 7px;
}
.pair .sep{flex:none;width:1px;background:var(--line);align-self:stretch}

.opts{display:flex;flex-direction:column;gap:8px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{
  position:relative;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);
  transition:border-color .15s,background .15s,transform .08s;text-align:right;
}
.opt:not(:disabled):hover{border-color:var(--line-2)}
.opt:not(:disabled):active{transform:scale(.99)}
.opt.text{display:flex;align-items:center;gap:10px;padding:12px 13px}
.opt.text .key{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;color:var(--ink-2);
  width:18px;height:18px;border-radius:5px;border:1px solid var(--line);
  display:grid;place-items:center;flex:none;
}
.opt.text .lbl{flex:1;min-width:0}
.opt.text .lbl strong{display:block;font-size:15px;font-weight:500;line-height:1.35}
.opt.text .lbl strong.ltr{direction:ltr;text-align:right}
.opt.text .lbl em{display:block;font-style:normal;font-size:12px;color:var(--ink-2);margin-top:1px;line-height:1.4}
.opt.text .sym{
  font-family:"IBM Plex Sans",sans-serif;font-size:20px;font-weight:600;
  width:38px;flex:none;text-align:center;
}
.opt.pic{padding:10px;display:grid;place-items:center;min-height:132px}
.opt.pic svg{width:100%;height:auto;max-height:112px}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.42}

.fb-wrap{display:flex;flex-direction:column;gap:8px}
.feedback{
  min-height:52px;display:flex;align-items:center;gap:10px;border-radius:12px;
  padding:10px 13px;font-size:14px;line-height:1.5;border:1px solid transparent;
}
.feedback.hide{visibility:hidden}
.feedback.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.feedback .fb-txt{flex:1}
.feedback .fb-txt b.ltr{direction:ltr;unicode-bidi:isolate}
.next{background:var(--ink);color:var(--bg);border-radius:9px;padding:8px 16px;font-size:14px;font-weight:500;flex:none}

/* ---------- results ---------- */
.results{flex:1;display:flex;flex-direction:column;gap:18px;padding:22px 0 8px}
.score-big{text-align:center}
.score-big b{
  font-family:"IBM Plex Sans",sans-serif;font-size:60px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1;color:var(--accent);
}
.score-big span{display:block;color:var(--ink-2);font-size:14px;margin-top:8px}
.review{display:flex;flex-direction:column;gap:8px}
.review h3{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 2px;
}
.miss{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.miss svg{width:112px;height:66px;flex:none}
.miss .m-sym{font-family:"IBM Plex Sans",sans-serif;font-size:26px;font-weight:600;width:52px;text-align:center;flex:none}
.miss .m-txt{min-width:0}
.miss .m-txt strong{display:block;font-size:15px;line-height:1.35}
.miss .m-txt strong.ltr{direction:ltr;text-align:right}
.miss .m-txt span{font-size:12px;color:var(--ink-2);line-height:1.4}
.btn-row{display:flex;gap:8px}
.btn{flex:1;text-align:center;border-radius:12px;padding:13px;font-size:15px;font-weight:500;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* ---------- isomer map ---------- */
.map-wrap{flex:1;padding:6px 0 10px;display:flex;flex-direction:column;gap:16px}
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding:0 24px 0 0;position:relative}
.tree ul::before{
  content:"";position:absolute;top:0;bottom:16px;right:10px;width:1.5px;background:var(--line-2);opacity:.7;
}
.tree li{position:relative;padding:0 16px 0 0;margin-top:8px}
.tree ul > li::before{
  content:"";position:absolute;top:18px;right:-14px;width:15px;height:1.5px;background:var(--line-2);opacity:.7;
}
.node{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 12px;
  border-right:3px solid var(--nc,var(--line-2));
}
.node strong{display:block;font-size:14.5px;font-weight:500}
.node em{display:block;font-style:normal;font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.45}
.node .ex{
  display:block;font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;color:var(--accent);
  margin-top:4px;direction:ltr;text-align:right;
}
.root-node{border-right-width:3px}

/* ---------- הוספת שאלה ---------- */
.add-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:1px dashed var(--line-2);border-radius:12px;padding:12px;
  font-size:14px;color:var(--ink-2);transition:color .15s,border-color .15s;
}
.add-btn:hover{color:var(--accent);border-color:var(--accent)}

.sheet-bg{
  position:fixed;inset:0;background:rgba(8,14,13,.6);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;
}
.sheet{
  width:100%;max-width:520px;background:var(--surface);
  border:1px solid var(--line);border-bottom:none;
  border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;
  max-height:92dvh;overflow-y:auto;
  animation:sheet-up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes sheet-up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sheet-head h2{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:20px;font-weight:700;margin:0}
.sheet-head button{font-size:14px;color:var(--ink-2)}
.sheet label{font-size:12.5px;color:var(--ink-2);display:block;margin-bottom:5px}
.sheet textarea,.sheet select,.sheet input{
  width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;font:inherit;font-size:15px;
}
.sheet textarea{min-height:110px;resize:vertical;line-height:1.5}
.sheet select{appearance:none}
.sheet .hint{font-size:12px;color:var(--ink-2);line-height:1.55}
.sheet .send{
  background:var(--accent);color:var(--on-accent);border-radius:12px;
  padding:13px;font-size:15px;font-weight:500;
}
.sheet .send:disabled{opacity:.5;cursor:default}
.sheet .status{
  border-radius:11px;padding:10px 12px;font-size:13.5px;line-height:1.55;
  border:1px solid var(--line);background:var(--bg);
}
.sheet .status.work{border-color:var(--accent);color:var(--accent)}
.sheet .status.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.sheet .status.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.sheet .examples{display:flex;flex-wrap:wrap;gap:6px}
.sheet .examples button{
  font-size:12px;color:var(--ink-2);border:1px solid var(--line);
  border-radius:99px;padding:5px 11px;
}
.sheet .examples button:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- תמונות בגיליון ההוספה ---------- */
.pick{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:1px dashed var(--line-2);border-radius:12px;padding:12px;
  font-size:14px;color:var(--ink-2);
}
.pick:hover{color:var(--accent);border-color:var(--accent)}
.shots{display:flex;flex-wrap:wrap;gap:8px}
.shot{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot button{
  position:absolute;top:3px;inset-inline-end:3px;width:20px;height:20px;border-radius:99px;
  background:rgba(8,14,13,.78);color:#fff;font-size:13px;line-height:1;
  display:grid;place-items:center;
}
.shot button:hover{background:var(--bad)}

.btn.go{width:100%;font-size:16px;padding:15px}
.why{
  background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;font-size:13.5px;line-height:1.6;color:var(--ink);
}
.why-btn{
  border:1px solid currentColor;border-radius:9px;padding:6px 12px;
  font-size:13px;flex:none;
}
.exam{
  display:block;width:100%;text-align:center;padding:9px;
  font-size:12.5px;color:var(--ink-2);border:1px solid transparent;border-radius:11px;
}
.exam:hover{color:var(--accent);border-color:var(--line)}
.alt-clear{
  width:100%;text-align:center;padding:11px;font-size:13.5px;color:var(--ink-2);
  border:1px solid var(--line);border-radius:12px;
}
.alt-clear:hover{color:var(--bad);border-color:var(--bad)}

/* ---------- סטטיסטיקה ---------- */
.stats-wrap{flex:1;display:flex;flex-direction:column;gap:16px;padding:4px 0 12px}
.hero{display:flex;gap:10px}
.hero .tile{
  flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 13px;
}
.hero .tile b{
  display:block;font-family:"IBM Plex Sans",sans-serif;font-size:26px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.15;
}
.hero .tile span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.4}
.panel-chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px 10px}
.panel-chart h3{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2);margin:0 0 2px;padding:0 2px;
}
.panel-chart .cap{font-size:12px;color:var(--ink-2);margin:0 0 10px;padding:0 2px;line-height:1.5}
.panel-chart svg{width:100%;height:auto;display:block;overflow:visible}
.bar-hit{fill:transparent;cursor:default}
.bar-hit:hover + .bar-mark, .bar-hit:focus + .bar-mark{fill:var(--ink)}
.tip{
  position:fixed;pointer-events:none;z-index:60;background:var(--ink);color:var(--bg);
  border-radius:8px;padding:5px 9px;font-size:12px;white-space:nowrap;
  font-variant-numeric:tabular-nums;opacity:0;transition:opacity .12s;
}
.tip.on{opacity:1}
.dtable{display:flex;flex-direction:column;gap:7px}
.drow{
  display:flex;align-items:center;gap:10px;background:var(--surface);

<script>

/* התוכן וההגדרות מוזרקים בזמן בנייה מ-data/decks.json ו-data/config.json */
const DATA = JSON.parse(document.getElementById('deck-data').textContent);

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function sample(arr,n){ return shuffle(arr).slice(0,n); }

/* ===========================================================
   מנוע ציור מולקולות
   a: [label,x,y]   b: [i,j,order]   order: 1 יחיד · 2 כפול · 3 טריז · 4 מקווקו
   =========================================================== */
function atomColor(t){
  if(t.indexOf('P')>-1) return 'var(--c-p)';
  if(t.indexOf('S')>-1 && t!=='Si') return 'var(--c-s)';
  if(t.indexOf('Br')>-1 || t.indexOf('Cl')>-1) return 'var(--c-x)';
  if(t.indexOf('N')>-1) return 'var(--c-n)';
  if(t.indexOf('O')>-1) return 'var(--c-o)';
  return 'var(--c-c)';
}
function baseLabel(t){ return t.replace(/[⁻⁺]/g,''); }
/* מעריכים, מטענים ומורידים צרים — לא נספרים כתו מלא */
function halfW(t){
  const core = t.replace(/[⁻⁺¹²³₀₁₂₃₄₅₆₇₈₉]/g,'');
  const narrow = t.length - core.length;
  return 0.20*core.length + 0.06 + (narrow?0.09:0);
}
const HALF_H = 0.34;
function edgeDist(t,dx,dy){
  const a=halfW(t), b=HALF_H;
  return 1/Math.sqrt((dx*dx)/(a*a) + (dy*dy)/(b*b));
}

function molSVG(g, opts){
  opts = opts||{};
  const pad = 0.85;
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  g.a.forEach(function(at){
    const r = halfW(at.t);
    minX=Math.min(minX,at.x-r); maxX=Math.max(maxX,at.x+r);
    minY=Math.min(minY,at.y-HALF_H); maxY=Math.max(maxY,at.y+HALF_H);
  });
  const vx=minX-pad, vy=minY-pad, vw=(maxX-minX)+pad*2, vh=(maxY-minY)+pad*2;

  let lines='', fills='';
  g.b.forEach(function(bd){
    const p=g.a[bd[0]], q=g.a[bd[1]], order=bd[2];
    let dx=q.x-p.x, dy=q.y-p.y;
    const len=Math.hypot(dx,dy); if(!len) return;
    dx/=len; dy/=len;
    const r1=edgeDist(p.t,dx,dy)+0.09, r2=edgeDist(q.t,dx,dy)+0.09;
    const x1=p.x+dx*r1, y1=p.y+dy*r1, x2=q.x-dx*r2, y2=q.y-dy*r2;
    const px=-dy, py=dx;
    if(order===2){
      const o=0.085;
      lines+='<line x1="'+(x1+px*o)+'" y1="'+(y1+py*o)+'" x2="'+(x2+px*o)+'" y2="'+(y2+py*o)+'"/>';
      lines+='<line x1="'+(x1-px*o)+'" y1="'+(y1-py*o)+'" x2="'+(x2-px*o)+'" y2="'+(y2-py*o)+'"/>';
    } else if(order===3){                      /* טריז — קדימה מהמישור */
      const w=0.15;
      fills+='<polygon points="'+x1+','+y1+' '+(x2+px*w)+','+(y2+py*w)+' '+(x2-px*w)+','+(y2-py*w)+'"/>';
    } else if(order===4){                      /* מקווקו — אחורה מהמישור */
      const n=5, L=Math.hypot(x2-x1,y2-y1);
      for(let k=1;k<=n;k++){
        const f=k/(n+0.4), cx=x1+(x2-x1)*f, cy=y1+(y2-y1)*f, w=0.045+0.115*f;
        lines+='<line x1="'+(cx+px*w)+'" y1="'+(cy+py*w)+'" x2="'+(cx-px*w)+'" y2="'+(cy-py*w)+'"/>';
      }
    } else {
      lines+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>';
    }
  });

  let atoms='';
  g.a.forEach(function(at){
    const base=baseLabel(at.t);
    const charge=at.t.indexOf('⁻')>-1?'–':(at.t.indexOf('⁺')>-1?'+':'');
    let inner=esc(base);
    if(charge) inner+='<tspan dy="-0.22" font-size="0.36">'+charge+'</tspan>';
    atoms+='<text x="'+at.x+'" y="'+at.y+'" fill="'+atomColor(at.t)+'">'+inner+'</text>';
  });

  return '<svg viewBox="'+vx+' '+vy+' '+vw+' '+vh+'" xmlns="http://www.w3.org/2000/svg" '+
    'role="img" aria-label="'+esc(opts.alt||'מבנה כימי')+'" preserveAspectRatio="xMidYMid meet">'+
    '<g stroke="var(--ink)" stroke-width="0.055" stroke-linecap="round" opacity="0.9">'+lines+'</g>'+
    '<g fill="var(--ink)" opacity="0.9">'+fills+'</g>'+
    '<g font-family="IBM Plex Sans, sans-serif" font-size="0.62" font-weight="500" '+
    'text-anchor="middle" dominant-baseline="central" direction="ltr">'+atoms+'</g></svg>';
}

/* ===========================================================
   דאטה 1 — קבוצות פונקציונליות
   =========================================================== */
const GROUPS = DATA.groups;
/* תוויות הממשק מגיעות מ-data/decks.json, כדי שניתן יהיה לערוך אותן מהאפליקציה */
const UI = DATA.ui || {};
const CAT_COLORS = {hc:'var(--c-c)', ox:'var(--c-o)', n:'var(--c-n)', s:'var(--c-s)', p:'var(--c-p)'};
const CATS = (function(){
  const out = {};
  Object.keys(CAT_COLORS).forEach(function(k){
    out[k] = {he:(UI.cats && UI.cats[k]) || k, color:CAT_COLORS[k]};
  });
  return out;
})();

/* ===========================================================
   דאטה 2 — יסודות עיקריים (bulk) ויסודות קורט (trace)
   =========================================================== */
const ELEMENTS = DATA.elements;
const BULK  = ELEMENTS.filter(function(e){return e.cat==='bulk';});
const TRACE = ELEMENTS.filter(function(e){return e.cat==='trace';});

/* ===========================================================
   דאטה 3 — עץ האיזומרים
   =========================================================== */
const ISO = DATA.iso;
/* מושגי־עזר — נבחנים בהגדרות, לא חלק מהעץ עצמו */
const ISO_TERMS = DATA.isoTerms;
const ISO_ALL = ISO.concat(ISO_TERMS);

/* זוגות מבנים — זיהוי היחס */
const REL = UI.rel || {};
const ISO_PAIRS = DATA.isoPairs;

/* ===========================================================
   FSRS-6 — תזמון חזרות. הנוסחאות והמשקלים לקוחים מקוד הייחוס
   open-spaced-repetition/py-fsrs, לא משוחזרים מהזיכרון.
   מצב כרטיס: s יציבות בימים · d קושי 1..10 · due מתי להראות שוב.
   =========================================================== */
const FSRS_W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001,
                1.8722, 0.1666, 0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014,
                1.8729, 0.5425, 0.0912, 0.0658, 0.1542];
const FSRS_DECAY  = -FSRS_W[20];
const FSRS_FACTOR = Math.pow(0.9, 1 / FSRS_DECAY) - 1;   /* כך ש-R(S,S)=0.9 */
const RETENTION   = 0.9;      /* שיעור השימור שאליו מכוונים */
const MAX_IVL     = 365;
const DAY         = 86400000;
const AGAIN_MS    = 600000;   /* טעות חוזרת בעוד עשר דקות, לא בעוד יום */

const clampD = (d) => Math.min(10, Math.max(1, d));
const clampS = (x) => Math.max(0.001, x);

/* הסתברות להיזכר אחרי elapsed ימים */
function retrievability(stability, elapsed){
  return Math.pow(1 + FSRS_FACTOR * Math.max(0, elapsed) / stability, FSRS_DECAY);
}
function initialStability(g){ return clampS(FSRS_W[g - 1]); }
function initialDifficulty(g, clamp){
  const d = FSRS_W[4] - Math.exp(FSRS_W[5] * (g - 1)) + 1;
  return clamp ? clampD(d) : d;
}
function nextDifficulty(d, g){
  const delta  = -(FSRS_W[6] * (g - 3));
  const damped = d + (10 - d) * delta / 9;              /* ריסון ליניארי */
  const target = initialDifficulty(4, false);
  return clampD(FSRS_W[7] * target + (1 - FSRS_W[7]) * damped);  /* נסיגה לממוצע */
}
function shortTermStability(s, g){
  let inc = Math.exp(FSRS_W[17] * (g - 3 + FSRS_W[18])) * Math.pow(s, -FSRS_W[19]);
  if(g >= 2) inc = Math.max(inc, 1);
  return clampS(s * inc);
}
function recallStability(d, s, r, g){
  const hard = g === 2 ? FSRS_W[15] : 1;
  const easy = g === 4 ? FSRS_W[16] : 1;
  return s * (1 + Math.exp(FSRS_W[8]) * (11 - d) * Math.pow(s, -FSRS_W[9]) *
    (Math.exp((1 - r) * FSRS_W[10]) - 1) * hard * easy);
}
function forgetStability(d, s, r){
  const long  = FSRS_W[11] * Math.pow(d, -FSRS_W[12]) *
                (Math.pow(s + 1, FSRS_W[13]) - 1) * Math.exp((1 - r) * FSRS_W[14]);
  const short = s / Math.exp(FSRS_W[17] * FSRS_W[18]);
  return Math.min(long, short);
}
/* תקרה לפי תאריך המבחן: אין טעם לתזמן כרטיס למועד שאחרי המבחן.
   חצי מהימים שנותרו מבטיח לפחות חזרה אחת נוספת לפני המועד. */
function intervalCap(){
  const d = examDaysLeft();
  if(d == null || d <= 0) return MAX_IVL;
  return Math.max(1, Math.floor(d * 0.5));
}
function examDaysLeft(){
  if(!store.examDate) return null;
  const t = Date.parse(store.examDate + 'T23:59:59');
  if(isNaN(t)) return null;
  return Math.ceil((t - Date.now()) / DAY);
}
function nextInterval(s){
  const iv = (s / FSRS_FACTOR) * (Math.pow(RETENTION, 1 / FSRS_DECAY) - 1);
  return Math.min(MAX_IVL, intervalCap(), Math.max(1, Math.round(iv)));
}

/* ציון 1..4 מתוך תשובה רב־ברירתית: נכונות, ומהירות כאינדיקציה לביטחון */
function gradeOf(correct, ms){
  if(!correct) return 1;
  if(ms > 12000) return 2;
  if(ms < 4000)  return 4;
  return 3;
}

function reviewCard(st, g, now){
  now = now || Date.now();
  if(!st || st.s == null){
    const s = initialStability(g);
    return { s:s, d:initialDifficulty(g, true), last:now,
             due: now + (g === 1 ? AGAIN_MS : nextInterval(s) * DAY),
             reps:1, lapses: g === 1 ? 1 : 0 };
  }
  const elapsed = (now - st.last) / DAY;
  const d = nextDifficulty(st.d, g);
  let s;
  if(elapsed < 1){
    s = shortTermStability(st.s, g);                    /* חזרה באותו יום */
  } else {
    const r = retrievability(st.s, elapsed);
    s = g === 1 ? forgetStability(st.d, st.s, r) : recallStability(st.d, st.s, r, g);
  }
  s = clampS(s);
  return { s:s, d:d, last:now,
           due: now + (g === 1 ? AGAIN_MS : nextInterval(s) * DAY),
           reps:(st.reps || 0) + 1, lapses:(st.lapses || 0) + (g === 1 ? 1 : 0) };
}

   =========================================================== */
const CARDS_KEY = 'shinun-cards', QUEUE_KEY = 'shinun-queue';
function jread(k, fb){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):fb; }catch(e){ return fb; } }
function jwrite(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let CARDS = jread(CARDS_KEY, {});
let QUEUE = jread(QUEUE_KEY, []);

function restHeaders(){
  return { apikey: CFG.supabaseKey, Authorization: 'Bearer ' + (AUTH && AUTH.access),
           'Content-Type': 'application/json' };
}
function canSync(){ return !!(CFG.supabaseUrl && AUTH && AUTH.access); }

function cardState(key){ return CARDS[key] || null; }

function recordReview(key, st, grade, elapsedDays, ms){
  CARDS[key] = st;
  jwrite(CARDS_KEY, CARDS);
  QUEUE.push({
    card_key:key, stability:st.s, difficulty:st.d,
    due:new Date(st.due).toISOString(), last_review:new Date(st.last).toISOString(),
    reps:st.reps, lapses:st.lapses,
    _log:{ card_key:key, rating:grade, elapsed_days:elapsedDays, duration_ms:ms }
  });
  jwrite(QUEUE_KEY, QUEUE);
  flushQueue();
}

let flushing = false;
function flushQueue(){
  if(flushing || !QUEUE.length || !canSync()) return Promise.resolve();
  flushing = true;
  const batch = QUEUE.slice();
  const rows = batch.map(function(r){ const c=Object.assign({},r); delete c._log; return c; });
  const logs = batch.map(function(r){ return r._log; });
  return fetch(CFG.supabaseUrl + '/rest/v1/card_state?on_conflict=user_id,card_key', {
    method:'POST',
    headers: Object.assign(restHeaders(), {Prefer:'resolution=merge-duplicates,return=minimal'}),
    body: JSON.stringify(rows)
  }).then(function(r){
    if(!r.ok) throw new Error('sync ' + r.status);
    return fetch(CFG.supabaseUrl + '/rest/v1/review_log', {
      method:'POST',
      headers: Object.assign(restHeaders(), {Prefer:'return=minimal'}),
      body: JSON.stringify(logs)
    });
  }).then(function(){
    QUEUE = QUEUE.slice(batch.length);
    jwrite(QUEUE_KEY, QUEUE);
  }).catch(function(){
    /* נשאר בתור וינוסה שוב בטעינה הבאה או בתשובה הבאה */
  }).then(function(){ flushing = false; });
}

/* משיכת המצב מהשרת — מאחדת עם המקומי לפי last_review המאוחר יותר,
   כך שמכשיר שתרגל אופליין לא נדרס וגם לא דורס. */
function pullCards(){
  if(!canSync()) return Promise.resolve();
  return fetch(CFG.supabaseUrl +
      '/rest/v1/card_state?select=card_key,stability,difficulty,due,last_review,reps,lapses',
      { headers: restHeaders() })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(rows){
      if(!rows) return;
      let changed = false;
      rows.forEach(function(row){
        const remote = { s:row.stability, d:row.difficulty,
                         due:Date.parse(row.due), last:Date.parse(row.last_review),
                         reps:row.reps, lapses:row.lapses };
        const local = CARDS[row.card_key];
        if(!local || remote.last > local.last){ CARDS[row.card_key] = remote; changed = true; }
      });
      if(changed){ jwrite(CARDS_KEY, CARDS); render(); }
    }).catch(function(){});
}

/* ===========================================================
   מתזמן — מרכיב סבב מכרטיסים שהגיע זמנם, ואז חדשים,
   ואז אלה שהכי קרובים להישכח.
   =========================================================== */
function dueCount(items, keyFn){
  const now = Date.now();
  return items.filter(function(it){
    const st = cardState(keyFn(it));
    return !st || st.due <= now;
  }).length;
}
function masteredCount(items, keyFn){
  /* "נשלט" = יציבות של שלושה שבועות ומעלה */
  return items.filter(function(it){
    const st = cardState(keyFn(it));
    return st && st.s >= 21;
  }).length;
}

function pickWeighted(items, n, keyFn){
  const now = Date.now();
  const ranked = shuffle(items).map(function(it){
    const st = cardState(keyFn(it));
    if(!st)            return {it:it, group:1, order:0};                 /* חדש */
    if(st.due <= now)  return {it:it, group:0, order:st.due};            /* הגיע זמנו */
    return {it:it, group:2, order:retrievability(st.s, (now - st.last)/DAY)};
  });
  ranked.sort(function(a,b){ return a.group - b.group || a.order - b.order; });
  return ranked.slice(0, n).map(function(x){ return x.it; });
}

/* --- חבילה 1: קבוצות פונקציונליות --- */
function fgDistractors(items, t){
  const same = shuffle(items.filter(function(g){ return g.cat===t.cat && g.id!==t.id; }));
  const other = shuffle(items.filter(function(g){ return g.cat!==t.cat; }));
  return same.concat(other).slice(0,3);
}
function fgQuestion(items, key, mode){
  const g = fgQuestion.pool.shift();
  const dir = mode==='mix' ? (Math.random()<0.5?'s2n':'n2s') : mode;
  const opts = shuffle([g].concat(fgDistractors(items, g)));
  if(dir==='s2n'){
    return { key:key(g), label:'איזו קבוצה זו?',
      prompt:{kind:'mol', mol:g},
      optionKind:'text',
      options:opts.map(function(o){ return {id:o.id, main:o.en, ltr:true, sub:o.he}; }),
      answer:g.id, why:null };
  }
  return { key:key(g), label:'איזה מבנה מתאים?',
    prompt:{kind:'text', main:g.en, ltr:true, sub:g.he},
    optionKind:'pic',
    options:opts.map(function(o){ return {id:o.id, mol:o}; }),
    answer:g.id, why:null };
}

/* --- חבילה 2: יסודות --- */
function elQuestion(items, key, mode){
  const kind = mode==='mix' ? sample(['sym','name','class','role','role2'],1)[0] : mode;
  const e = elQuestion.pool.shift();
  const BULK = items.filter(function(x){return x.cat==='bulk';});
  const TRACE = items.filter(function(x){return x.cat==='trace';});
  const ELEMENTS = items;

  if(kind==='sym'){
    const opts = shuffle([e].concat(sample(ELEMENTS.filter(function(x){return x.id!==e.id;}),3)));
    return { key:key(e), label:'איזה יסוד זה?',
      prompt:{kind:'element', sym:e.sym},
      optionKind:'text',
      options:opts.map(function(o){ return {id:o.id, main:o.en, ltr:true, sub:o.he}; }),
      answer:e.id, why:(e.cat==='bulk'?'יסוד עיקרי (bulk). ':'יסוד קורט (trace). ')+e.role };
  }
  if(kind==='name'){
    const opts = shuffle([e].concat(sample(ELEMENTS.filter(function(x){return x.id!==e.id;}),3)));
    return { key:key(e), label:'מה הסמל?',
      prompt:{kind:'text', main:e.he, sub:e.en},
      optionKind:'text',
      options:opts.map(function(o){ return {id:o.id, sym:o.sym, main:o.he}; }),
      answer:e.id, why:(e.cat==='bulk'?'יסוד עיקרי (bulk). ':'יסוד קורט (trace). ')+e.role };
  }
  if(kind==='class'){
    /* בחר את היחיד שמשתייך לקטגוריה הנגדית */
    const askTrace = e.cat==='trace';
    const target = askTrace ? e : e;
    const foils = sample((askTrace?BULK:TRACE), 3);
    const opts = shuffle([target].concat(foils));
    return { key:key(e), label:'סיווג',
      prompt:{kind:'text', main: askTrace?'מי מהבאים הוא יסוד קורט?':'מי מהבאים הוא יסוד עיקרי?',
              sub: askTrace?'trace element — נמצא בעקבות בלבד':'bulk element — מרכיב עיקרי של מסת הגוף'},
      optionKind:'text',
      options:opts.map(function(o){ return {id:o.id, sym:o.sym, main:o.he, sub:o.en}; }),
      answer:target.id, why:e.sym+' — '+e.role };
  }
  if(kind==='role'){
    const opts = shuffle([e].concat(sample(ELEMENTS.filter(function(x){return x.id!==e.id;}),3)));
    return { key:key(e), label:'איזה יסוד ממלא את התפקיד?',
      prompt:{kind:'text', main:e.role},
      optionKind:'text',
      options:opts.map(function(o){ return {id:o.id, sym:o.sym, main:o.he, sub:o.en}; }),
      answer:e.id, why:e.cat==='bulk'?'יסוד עיקרי (bulk).':'יסוד קורט (trace).' };
  }
  /* role2 — יסוד ← תפקיד */
  const opts = shuffle([e].concat(sample(ELEMENTS.filter(function(x){return x.id!==e.id;}),3)));
  return { key:key(e), label:'מה התפקיד?',
    prompt:{kind:'element', sym:e.sym, caption:e.he},
    optionKind:'text',
    options:opts.map(function(o){ return {id:o.id, main:o.role}; }),
    answer:e.id, why:e.cat==='bulk'?'יסוד עיקרי (bulk).':'יסוד קורט (trace).' };
}

/* --- חבילה 3: איזומרים --- */
function isoParentOf(iso, node){ return iso.filter(function(x){ return x.id===node.parent; })[0]; }
function isoQuestion(D, key, mode){
  const ISO = D.iso, ISO_TERMS = D.isoTerms, ISO_ALL = D.all, ISO_PAIRS = D.isoPairs;
  const kind = mode==='mix' ? sample(['def','term','tree','pair'],1)[0] : mode;

  if(kind==='pair' || (kind==='mix')){
    /* נופל לזוגות רק אם נבחר במפורש */
  }
  if(kind==='pair'){
    const p = isoQuestion.pairPool.length ? isoQuestion.pairPool.shift() : sample(ISO_PAIRS,1)[0];
    const keys = Object.keys(REL);
    const foils = sample(keys.filter(function(k){ return k!==p.rel; }),3);
    const opts = shuffle([p.rel].concat(foils));
    return { key:key(p), label:'מה היחס בין א ל-ב?',
      prompt:{kind:'pair', pair:p},
      optionKind:'text',
      options:opts.map(function(k){ return {id:k, main:REL[k]}; }),
      answer:p.rel, why:p.why };
  }
  if(kind==='tree'){
    const kids = ISO.filter(function(x){ return x.parent; });
    const node = isoQuestion.treePool.length ? isoQuestion.treePool.shift() : sample(kids,1)[0];
    const parent = isoParentOf(ISO, node);
    const foils = sample(ISO.filter(function(x){ return x.id!==parent.id && x.id!==node.id; }),3);
    const opts = shuffle([parent].concat(foils));
    return { key:key(node), label:'תחת איזו קטגוריה?',
      prompt:{kind:'text', main:node.he, sub:node.en},
      optionKind:'text',
      options:opts.map(function(o){ return {id:o.id, main:o.he, sub:o.en}; }),
      answer:parent.id, why:node.he+' — '+node.def };
  }
  const node = isoQuestion.pool.length ? isoQuestion.pool.shift() : sample(ISO_ALL,1)[0];
  const foils = sample(ISO_ALL.filter(function(x){ return x.id!==node.id; }),3);
  const opts = shuffle([node].concat(foils));
  if(kind==='def'){
    return { key:key(node), label:'איזה מונח מתאים להגדרה?',
      prompt:{kind:'text', main:node.def, sub:node.ex?('דוגמה: '+node.ex):''},
      optionKind:'text',
      options:opts.map(function(o){ return {id:o.id, main:o.he, sub:o.en}; }),
      answer:node.id, why:null };
  }
  return { key:key(node), label:'מה ההגדרה?',
    prompt:{kind:'text', main:node.he, sub:node.en},
    optionKind:'text',
    options:opts.map(function(o){ return {id:o.id, main:o.def}; }),
    answer:node.id, why:node.ex?('דוגמה: '+node.ex):null };
}

function topicQuestion(cards, key, mode){
  const card = topicQuestion.pool.shift();

  const foils = sample(cards.filter(function(c){ return c.id!==card.id; }), 3);

      answer:card.id, why:card.note||null };
  }
  return { key:ckey, label:'מה זה?',
    prompt:{kind:'text', main:card.front, sub:card.frontSub||''},
    optionKind:'text',
    options:opts.map(function(o){ return {id:o.id, main:o.back}; }),
    answer:card.id, why:card.note||null };

      return {owner_id:AUTH.uid, kind:r.kind, title:r.title, subtitle:r.subtitle,
              color:r.color, visibility:'private', data:r.data, item_count:count,
              _oldPrefix:r.id + ':'};

    const payload = rows.map(function(r){ const c=Object.assign({},r); delete c._oldPrefix; return c; });
    return rest('decks', {
      method:'POST',
      headers: Object.assign(restHeaders(), {Prefer:'return=representation'}),
      body: JSON.stringify(payload)
    }).then(function(r){ return r.ok ? r.json() : null; })
      .then(function(created){

        return Promise.all(created.map(function(d, i){
          return subscribe(d.id).then(function(){

            return rest('rpc/remap_card_keys', {

              body: JSON.stringify({old_prefix: rows[i]._oldPrefix, deck: d.id})
            });

        })).then(function(){ return true; });

/* ===========================================================

   =========================================================== */
const TOPIC_COLORS = ['var(--c-n)','var(--c-o)','var(--c-p)','var(--c-s)','var(--c-x)'];

function makeDeck(row, idx){
  const key = function(x){ return row.id + ':' + x.id; };

  if(row.kind === 'groups'){
    const items = row.data;
    return { id:row.id, row:row, title:row.title, sub:row.subtitle||'', color:row.color||'var(--c-o)',
      items:items, keyFn:key,
      browse:function(g){ return {mol:g, title:g.en, ltr:true, sub:g.he,
                                  tag:(CATS[g.cat]||{}).he, tagColor:(CATS[g.cat]||{}).color}; },
      modes:dModes('fg', [{id:'s2n',glyph:'R–'},{id:'n2s',glyph:'Aa'},{id:'mix',glyph:'⇄'}]),
      legend:Object.keys(CATS).map(function(k){ return {color:CATS[k].color, he:CATS[k].he}; }),
      build:function(mode, n){
        fgQuestion.pool = pickWeighted(items, n || ROUND, key);
        const count = fgQuestion.pool.length;      /* shift מקצר את המאגר תוך כדי */
        const out=[]; for(let i=0;i<count;i++) out.push(fgQuestion(items, key, mode));
        return out;
      } };
  }

  if(row.kind === 'elements'){
    const items = row.data;
    return { id:row.id, row:row, title:row.title, sub:row.subtitle||'', color:row.color||'var(--c-n)',
      items:items, keyFn:key,
      browse:function(e){ return {sym:e.sym, title:e.he, sub:e.en, body:e.role,
                                  tag:e.cat==='bulk'?'עיקרי':'קורט',
                                  tagColor:e.cat==='bulk'?'var(--c-n)':'var(--c-s)'}; },
      modes:dModes('el', [{id:'sym',glyph:'Fe'},{id:'name',glyph:'שם'},{id:'class',glyph:'⊞'},{id:'mix',glyph:'⇄'}]),
      legend:dLegend('el', {bulk:'var(--c-n)', trace:'var(--c-s)'}),
      build:function(mode, n){
        elQuestion.pool = pickWeighted(items, n || ROUND, key);
        const count = elQuestion.pool.length;
        const out=[]; for(let i=0;i<count;i++) out.push(elQuestion(items, key, mode));
        return out;
      } };
  }

  if(row.kind === 'iso'){
    const D = {iso:row.data.iso||[], isoTerms:row.data.isoTerms||[], isoPairs:row.data.isoPairs||[]};
    D.all = D.iso.concat(D.isoTerms);
    return { id:row.id, row:row, title:row.title, sub:row.subtitle||'', color:row.color||'var(--c-p)',
      items:D.all, keyFn:key, map:D.iso.length ? D : null,
      browse:function(n){
        const parent = n.parent ? (D.iso.filter(function(x){return x.id===n.parent;})[0]||{}).he : '';
        return {title:n.he, sub:n.en, body:n.def, note:n.ex, tag:parent, tagColor:n.color};
      },
      modes:dModes('iso', [{id:'def',glyph:'?'},{id:'term',glyph:'≡'},{id:'tree',glyph:'⌂'},
                           {id:'pair',glyph:'A|B'},{id:'mix',glyph:'⇄'}]),
      legend:dLegend('iso', {structural:'var(--c-o)', stereo:'var(--c-n)',
                             config:'var(--c-p)', sub:'var(--c-s)'}),
      build:function(mode, n){
        n = n || ROUND;
        isoQuestion.pool     = pickWeighted(D.all, n, key);
        isoQuestion.treePool = pickWeighted(D.iso.filter(function(x){return x.parent;}), n, key);
        isoQuestion.pairPool = pickWeighted(D.isoPairs, D.isoPairs.length, key);
        const count = mode==='pair' ? Math.min(n, D.isoPairs.length) : n;
        const out=[]; for(let i=0;i<count;i++) out.push(isoQuestion(D, key, mode));
        return out;
      } };
  }

  /* topic — המנוע הגנרי */
  const cards = Array.isArray(row.data) ? row.data : (row.data.cards || []);
  const color = row.color || TOPIC_COLORS[idx % TOPIC_COLORS.length];
  return { id:row.id, row:row, title:row.title, sub:row.subtitle || (cards.length+' כרטיסים'),
    color:color, items:cards, keyFn:key,
    browse:function(c){ return {title:c.front, sub:c.frontSub, body:c.back, note:c.note}; },
    modes:[
      {id:'f2b', glyph:'→', title:'מושג ← הסבר', desc:'רואה מושג, בוחר את ההסבר'},
      {id:'b2f', glyph:'←', title:'הסבר ← מושג', desc:'רואה הסבר, בוחר את המושג'},
      {id:'mix', glyph:'⇄', title:'מעורב', desc:'שני הכיוונים באקראי'},
    ],
    legend:[{color:color, he:row.title}],
    build:function(mode, n){
      const count = Math.min(n || ROUND, cards.length);
      topicQuestion.pool = pickWeighted(cards, count, key);
      const out=[]; for(let k=0;k<count;k++) out.push(topicQuestion(cards, key, mode));
      return out;
    } };
}

/* חבילה צריכה ארבעה פריטים לפחות כדי לייצר ארבע אפשרויות */
function buildDecks(rows){
  return rows
    .map(function(r, i){ return makeDeck(r, i); })
    .filter(function(d){ return d.items && d.items.length >= 4; });
}

/* מקור התוכן. בשלב זה עדיין מהחבילה המוטמעת; ההחלפה למסד תבוא בנפרד. */
function localRows(){
  const rows = [
    {id:'fg',  kind:'groups',   title:dLbl('fg','title','קבוצות פונקציונליות'),
     subtitle:dLbl('fg','sub',''), color:'var(--c-o)', data:DATA.groups},
    {id:'el',  kind:'elements', title:dLbl('el','title','יסודות'),
     subtitle:dLbl('el','sub',''), color:'var(--c-n)', data:DATA.elements},
    {id:'iso', kind:'iso',      title:dLbl('iso','title','איזומרים'),
     subtitle:dLbl('iso','sub',''), color:'var(--c-p)',
     data:{iso:DATA.iso, isoTerms:DATA.isoTerms, isoPairs:DATA.isoPairs}},
  ];
  (DATA.topics || []).forEach(function(t){
    rows.push({id:'tp:'+t.id, kind:'topic', title:t.title, subtitle:t.sub,
               color:t.color, data:t.cards});
  });
  return rows;
}

let DECKS = buildDecks(ROWS && ROWS.length ? ROWS : localRows());

function deckById(id){ return DECKS.filter(function(d){return d.id===id;})[0]; }

   מצב מסך
   =========================================================== */
let view = {name:'home'};
let quiz = null;
const app = document.getElementById('app');

function startQuiz(deckId, mode){
  const deck = deckById(deckId);
  const qs = deck.build(mode);
  quiz = {deck:deck, mode:mode, qs:qs, i:0, correct:0, misses:[]};
  view = {name:'quiz'};
  render();
}
/* סבב מאוחד — מושך את מה שהגיע זמנו מכל החבילות, בחלוקה יחסית.
   זו נקודת הפתיחה הטבעית לאפליקציית חזרה מרווחת. */
const ALL_DECK = {id:'all', title:'חזרה כללית', modes:[]};
function defaultMode(d){
  const ids = d.modes.map(function(m){ return m.id; });
  return ids.indexOf('mix') > -1 ? 'mix' : ids[0];
}
function startMixed(){
  const shares = DECKS.map(function(d){
    return {d:d, due:dueCount(d.items, d.keyFn)};
  }).filter(function(x){ return x.due > 0; });
  const pool = shares.length ? shares
    : DECKS.map(function(d){ return {d:d, due:d.items.length}; });

  const total = pool.reduce(function(a,x){ return a + x.due; }, 0) || 1;
  let left = ROUND, qs = [];
  pool.forEach(function(x, i){
    const n = i === pool.length - 1
      ? left
      : Math.max(1, Math.min(left - (pool.length - 1 - i), Math.round(ROUND * x.due / total)));
    if(n <= 0) return;
    left -= n;
    qs = qs.concat(x.d.build(defaultMode(x.d), n));
  });

  quiz = {deck:ALL_DECK, mode:'mixed', qs:shuffle(qs).slice(0, ROUND), i:0, correct:0, misses:[]};
  view = {name:'quiz'};
  render();
}

function answer(optId){
  const q = quiz.qs[quiz.i];
  if(q.answered) return;
  q.answered = optId;
  const ok = optId===q.answer;
  if(ok) quiz.correct++; else quiz.misses.push(q);

  const ms    = q.shownAt ? Date.now() - q.shownAt : 0;
  const grade = gradeOf(ok, ms);
  const prev  = cardState(q.key);
  const elapsedDays = prev ? (Date.now() - prev.last) / DAY : null;
  const st    = reviewCard(prev, grade);
  q.interval  = Math.round((st.due - Date.now()) / DAY);
  recordReview(q.key, st, grade, elapsedDays, ms);

  render();
  if(ok) setTimeout(function(){ if(quiz && quiz.qs[quiz.i]===q) next(); }, 850);
}
function next(){
  if(quiz.i < quiz.qs.length-1){ quiz.i++; }
  else{
    const pct = Math.round(quiz.correct/quiz.qs.length*100);
    store.best[quiz.deck.id] = Math.max(store.best[quiz.deck.id]||0, pct);
    store.rounds = (store.rounds||0)+1;
    saveState(store);
    quiz.done = true;
  }
  render();
}

      lb2.textContent = 'העתק קישור לנושא'; }, 1800); };

function promptHTML(p){

    return '<div class="el-tile"><b>'+esc(p.sym)+'</b>'+(p.caption?'<span>'+esc(p.caption)+'</span>':'')+'</div>';

      '<div><span class="tag">א</span>'+molSVG(p.pair.A,{alt:'מבנה א'})+'</div>'+

function renderQuiz(){
  const q = quiz.qs[quiz.i];
  const answered = !!q.answered;
  if(!answered && !q.shownAt) q.shownAt = Date.now();   /* למדידת ביטחון */
  const ok = answered && q.answered===q.answer;
  const correctOpt = q.options.filter(function(o){ return o.id===q.answer; })[0];

  let opts;
  if(q.optionKind==='pic'){
    opts = '<div class="opts grid">'+q.options.map(function(o){
      let cls='opt pic';
      if(answered){ cls += o.id===q.answer ? ' correct' : (o.id===q.answered ? ' wrong' : ' dim'); }
      return '<button class="'+cls+'" data-id="'+o.id+'"'+(answered?' disabled':'')+'>'+
        molSVG(o.mol,{alt:'אפשרות מבנה'})+'</button>';
    }).join('')+'</div>';
  } else {
    opts = '<div class="opts">'+q.options.map(function(o,idx){
      let cls='opt text';
      if(answered){ cls += o.id===q.answer ? ' correct' : (o.id===q.answered ? ' wrong' : ' dim'); }
      const lead = o.sym
        ? '<span class="sym">'+esc(o.sym)+'</span>'
        : '<span class="key">'+(idx+1)+'</span>';
      return '<button class="'+cls+'" data-id="'+esc(o.id)+'"'+(answered?' disabled':'')+'>'+
        lead+'<span class="lbl"><strong'+(o.ltr?' class="ltr"':'')+'>'+esc(o.main)+'</strong>'+
        (o.sub?'<em>'+esc(o.sub)+'</em>':'')+'</span></button>';
    }).join('')+'</div>';
  }

  let fb='<div class="feedback hide"></div>';
  if(answered){
    const name = correctOpt ? correctOpt.main : '';
    const back = q.interval >= 1
      ? ' · חוזר בעוד ' + q.interval + (q.interval === 1 ? ' יום' : ' ימים')
      : ' · חוזר בקרוב';
    if(ok){
      fb = '<div class="feedback ok"><span class="fb-txt">נכון'+(q.why?' — '+esc(q.why):'')+back+'</span></div>';
    } else {
      fb = '<div class="feedback bad"><span class="fb-txt">התשובה: <b'+(correctOpt&&correctOpt.ltr?' class="ltr"':'')+'>'+
        esc(name)+'</b>'+(q.why?' · '+esc(q.why):'')+'</span>'+
        (CFG.explainUrl && AUTH && AUTH.editor ? '<button class="why-btn" id="whyBtn">'+
          (q.whyBusy?'…':'למה?')+'</button>' : '')+
        '<button class="next" id="nextBtn">הבא</button></div>';
      const cached = q.whyText || whyFor(q.key);
      if(cached) fb += '<div class="why">'+esc(cached)+'</div>';
    }
  }

  app.innerHTML =
  '<div class="bar">'+
    '<button class="icon-btn" id="homeBtn" aria-label="חזרה">'+icon('home')+'</button>'+
    '<div class="track"><i style="width:'+(quiz.i/quiz.qs.length*100)+'%"></i></div>'+
    '<div class="count" dir="ltr"><b>'+(quiz.i+1)+'</b>/'+quiz.qs.length+' · ✓'+quiz.correct+'</div>'+
  '</div>'+
  '<div class="quiz">'+
    '<div class="prompt-label">'+esc(q.label)+'</div>'+
    '<div class="stage">'+promptHTML(q.prompt)+'</div>'+
    opts + '<div class="fb-wrap">' + fb + '</div>' +
  '</div>';

  app.querySelector('#homeBtn').addEventListener('click', function(){ view={name:'deck',deck:quiz.deck.id}; quiz=null; render(); });
  Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(btn){
    btn.addEventListener('click', function(){ answer(btn.dataset.id); });
  });
  const nb=app.querySelector('#nextBtn');
  if(nb) nb.addEventListener('click', next);

  const wb=app.querySelector('#whyBtn');
  if(wb) wb.addEventListener('click', function(){
    if(q.whyBusy || q.whyText || whyFor(q.key)) return;
    q.whyBusy = true; render();
    const chosen = q.options.filter(function(o){ return o.id===q.answered; })[0];
    callFn(CFG.explainUrl, {
      question: q.prompt.main || (q.prompt.mol ? q.label + ' — ' + (correctOpt.sub||'') : q.label),
      answer:   (correctOpt.main||'') + (correctOpt.sub ? ' — '+correctOpt.sub : ''),
      chosen:   chosen ? chosen.main : '',
      deck:     quiz.deck.title
    }).then(function(res){
      q.whyBusy = false;
      if(res.ok && res.body.text){ q.whyText = res.body.text; whySave(q.key, res.body.text); }
      else q.whyText = res.body.error || 'לא הצלחתי להסביר.';
      render();
    });
  });
}

    '<div class="count">סיום</div>'+
  '</div>'+
  '<div class="results">'+

function renderMap(){
  const deck = deckById(view.back) || {};
  const D = deck.map || {iso:[], isoTerms:[]};
  const ISO = D.iso, ISO_TERMS = D.isoTerms;
  function nodeHTML(n){
    return '<div class="node" style="--nc:'+n.color+'"><strong>'+esc(n.he)+'</strong>'+
      '<em>'+esc(n.def)+'</em>'+(n.ex?'<span class="ex">'+esc(n.ex)+'</span>':'')+'</div>';
  }
  function childrenOf(id){ return ISO.filter(function(x){ return x.parent===id; }); }
  function branch(id){
    const kids = childrenOf(id);
    if(!kids.length) return '';
    return '<ul>'+kids.map(function(k){
      return '<li>'+nodeHTML(k)+branch(k.id)+'</li>';
    }).join('')+'</ul>';
  }
  const root = ISO[0];
  const extras = ISO_TERMS.map(function(t){
    return '<div class="node" style="--nc:var(--line-2)"><strong>'+esc(t.he)+'</strong><em>'+esc(t.def)+'</em>'+
      (t.ex?'<span class="ex">'+esc(t.ex)+'</span>':'')+'</div>';
  }).join('');

  app.innerHTML =
  '<div class="bar">'+
    '<button class="icon-btn" id="backBtn" aria-label="חזרה">'+icon('arrow')+'</button>'+
    '<div class="title">מפת האיזומרים</div>'+
  '</div>'+
  '<div class="map-wrap">'+
    '<div class="tree">'+nodeHTML(root)+branch(root.id)+'</div>'+
    '<div><h3 style="font-family:\'IBM Plex Sans\',sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:4px 0 8px">מושגים נלווים</h3>'+
    '<div style="display:flex;flex-direction:column;gap:8px">'+extras+'</div></div>'+
  '</div>';

  app.querySelector('#backBtn').addEventListener('click', function(){ view={name:'deck',deck:view.back}; render(); });
}

/* ===========================================================
   הוספת שאלה — שולח בקשה לפונקציית Supabase, שמפעילה את Claude
   ומעדכנת את data/decks.json ברפו. הדיפלוי מתרחש אוטומטית.
   =========================================================== */
/* ===========================================================
   התחברות עם גוגל דרך Supabase — זרימת OAuth ישירה, בלי SDK,
   כדי לא להוסיף תלות רשת לאפליקציה שאמורה לעבוד אופליין.
   =========================================================== */
const AUTH_KEY = 'shinun-auth';
const authEnabled = !!(CFG.supabaseUrl && CFG.supabaseKey);

function authRead(){
  try{ const r=localStorage.getItem(AUTH_KEY); return r?JSON.parse(r):null; }catch(e){ return null; }
}
function authWrite(v){
  try{ v ? localStorage.setItem(AUTH_KEY, JSON.stringify(v)) : localStorage.removeItem(AUTH_KEY); }
  catch(e){}
}
let AUTH = authRead();

/* חזרה מגוגל — הטוקנים מגיעים ב-hash. קולטים, מנקים מה-URL ושומרים. */
(function absorbHash(){
  if(!location.hash || location.hash.indexOf('access_token=')<0) return;
  const p = new URLSearchParams(location.hash.slice(1));
  const at = p.get('access_token'), rt = p.get('refresh_token');
  if(at){ AUTH = {access:at, refresh:rt, email:null}; authWrite(AUTH); }
  history.replaceState(null, '', location.pathname + location.search);
})();

function signIn(){
  const back = location.origin + location.pathname;
  location.href = CFG.supabaseUrl + '/auth/v1/authorize?provider=google'
    + '&redirect_to=' + encodeURIComponent(back);
}
function signOut(){ AUTH = null; authWrite(null); render(); }

/* אימות הרשאה מול השרת. רשימת המורשים לא יושבת כאן בכוונה —
   הקוד הזה ציבורי, והרשימה נשארת ב-ALLOWED_EMAILS בצד השרת. */
const VERIFY_KEY = 'shinun-verified';
function verifyAccess(force){
  if(!CFG.explainUrl || !AUTH || !AUTH.access) return Promise.resolve();
  let last = 0;
  try{ last = +(localStorage.getItem(VERIFY_KEY) || 0); }catch(e){}
  if(!force && Date.now() - last < 6*3600000) return Promise.resolve();  /* אחת לשש שעות */
  return fetch(CFG.explainUrl, {
    method:'POST',
    headers:{'Content-Type':'application/json', Authorization:'Bearer ' + AUTH.access},
    body: JSON.stringify({verify:true})
  }).then(function(r){
    /* 401 = הטוקן עצמו פסול, ורק אז מנתקים. חשבון תקף שאינו ברשימת
       העורכים נשאר בפנים ופשוט לא רואה את כפתורי העריכה. */
    if(r.status === 401){
      AUTH = null; authWrite(null);
      try{ localStorage.removeItem(VERIFY_KEY); }catch(e){}
      view = {name:'home', lockErr:'ההתחברות פגה. התחבר שוב.'};
      render();
      return;
    }
    return r.json().catch(function(){ return {}; }).then(function(j){
      const was = AUTH.editor;
      AUTH.editor = !!j.editor;
      authWrite(AUTH);
      try{ localStorage.setItem(VERIFY_KEY, String(Date.now())); }catch(e){}
      if(was !== AUTH.editor) render();
    });
  }).catch(function(){});   /* אופליין — לא מנתקים */
}

function loadIdentity(){
  /* גם uid נדרש, לא רק מייל — מפגש שנוצר לפני שהוספנו אותו חייב רענון */
  if(!AUTH || !AUTH.access || (AUTH.email && AUTH.uid)) return Promise.resolve();
  return fetch(CFG.supabaseUrl + '/auth/v1/user', {
    headers:{ apikey: CFG.supabaseKey, Authorization: 'Bearer ' + AUTH.access }
  }).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(u){
      if(u && u.email){
        AUTH.email = u.email; AUTH.uid = u.id; authWrite(AUTH); render();
        verifyAccess(true).then(function(){
          if(AUTH){
            pullCards(); flushQueue();
            loadLibrary().then(function(){
              if(pendingShare){ const id = pendingShare; pendingShare = null; openStore(id); }
            });
          }
        });
        return;
      }
      /* אולי רק פג — מנסים לרענן לפני שמנתקים */
      return refreshToken().then(function(ok){
        if(!ok){ AUTH = null; authWrite(null); render(); }
      });
    }).catch(function(){});   /* אופליין — משאירים את המשתמש בפנים */
}

function refreshToken(){
  if(!AUTH || !AUTH.refresh) return Promise.resolve(false);
  return fetch(CFG.supabaseUrl + '/auth/v1/token?grant_type=refresh_token', {
    method:'POST',
    headers:{ apikey: CFG.supabaseKey, 'Content-Type':'application/json' },
    body: JSON.stringify({ refresh_token: AUTH.refresh })
  }).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(!j || !j.access_token){ AUTH=null; authWrite(null); return false; }
      AUTH = {access:j.access_token, refresh:j.refresh_token, email:AUTH.email};
      authWrite(AUTH);
      return true;
    }).catch(function(){ return false; });
}

/* קריאה לפונקציה עם טוקן המשתמש. מרענן פעם אחת על 401. */
const CALL_TIMEOUT = 170000;
function callFn(url, payload, retried){
  const headers = {'Content-Type':'application/json'};
  if(AUTH && AUTH.access) headers.Authorization = 'Bearer ' + AUTH.access;
  /* גוזרים בעצמנו, אחרת חיבור שנופל מציג "Failed to fetch" בלי שום מידע */
  const ctl = typeof AbortController==='function' ? new AbortController() : null;
  const t0 = Date.now();
  const timer = ctl ? setTimeout(function(){ ctl.abort(); }, CALL_TIMEOUT) : null;
  return fetch(url, {method:'POST', headers:headers, body:JSON.stringify(payload),
                     signal: ctl ? ctl.signal : undefined})
    .then(function(r){
      if(timer) clearTimeout(timer);
      if(r.status===401 && AUTH && AUTH.refresh && !retried){
        return refreshToken().then(function(ok){
          if(!ok) return r.json().then(function(j){ return {ok:false, status:401, body:j}; });
          return callFn(url, payload, true);
        });
      }
      return r.json().then(function(j){ return {ok:r.ok, status:r.status, body:j}; })
              .catch(function(){ return {ok:r.ok, status:r.status, body:{}}; });
    })
    .catch(function(err){
      if(timer) clearTimeout(timer);
      const secs = Math.round((Date.now()-t0)/1000);
      const why = (err && err.name==='AbortError')
        ? 'הבקשה נגזרה אחרי '+secs+' שניות'
        : 'החיבור נפל אחרי '+secs+' שניות ('+(err && err.message || 'לא ידוע')+')';
      return {ok:false, status:0, body:{error: why}};
    });
}

/* מכווצים בצד הלקוח: שקף בגודל מלא הוא בזבוז טוקנים, ו-1568px
   היא הקצה הארוך שמעברו התמונה מוקטנת ממילא בצד השרת. */
const MAX_EDGE = 1568, MAX_SHOTS = 4;
function shrinkImage(file){
  return new Promise(function(resolve, reject){
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function(){
      const scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const data = c.toDataURL('image/jpeg', 0.82);
      resolve({ media_type:'image/jpeg', data: data.slice(data.indexOf(',')+1) });
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('לא הצלחתי לקרוא את התמונה')); };
    img.src = url;
  });
}

        '<input id="addFile" type="file" accept="image/*" multiple hidden>'+
        '<div class="shots" id="addShots"></div></div>'+
      '<div><label for="addTxt">הבקשה</label>'+
        '<textarea id="addTxt" placeholder="אפשר להשאיר ריק אם צירפת שקף. או: תוסיף שאלה על קבוצת הסולפט ואת התפקיד שלה"></textarea></div>'+
      '<div><label for="addDeck">לאיזו חבילה</label>'+
        '<select id="addDeck">'+
          '<option value="auto">שיקבע לבד</option>'+
          DECKS.map(function(d){ return '<option value="'+d.id+'">'+esc(d.title)+'</option>'; }).join('')+
        '</select></div>'+
      '<button class="send" id="addSend">שלח</button>'+
      '<div class="status" id="addStatus" hidden></div>'+
    '</div>';
  document.body.appendChild(bg);

  const txt = bg.querySelector('#addTxt');
  const status = bg.querySelector('#addStatus');
  const send = bg.querySelector('#addSend');
  const fileInput = bg.querySelector('#addFile');
  const shotsBox = bg.querySelector('#addShots');
  const shots = [];

  function drawShots(){
    shotsBox.innerHTML = shots.map(function(sh, i){
      return '<div class="shot"><img alt="שקף '+(i+1)+'" src="data:'+sh.media_type+';base64,'+sh.data+'">'+
        '<button data-rm="'+i+'" aria-label="הסר">×</button></div>';

    });
  }
  bg.querySelector('#addPick').addEventListener('click', function(){ fileInput.click(); });
  fileInput.addEventListener('change', function(){
    const files = Array.prototype.slice.call(fileInput.files, 0, MAX_SHOTS - shots.length);
    fileInput.value = '';
    if(!files.length){ say('bad','אפשר לצרף עד '+MAX_SHOTS+' תמונות.'); return; }
    say('work','מכווץ תמונות…');
    Promise.all(files.map(shrinkImage)).then(function(list){
      list.forEach(function(x){ shots.push(x); });
      drawShots();
      status.hidden = true;
    }).catch(function(err){ say('bad', err.message); });
  });
  function close(){ bg.remove(); document.removeEventListener('keydown', onKey); }
  function onKey(e){ if(e.key==='Escape') close(); }
  document.addEventListener('keydown', onKey);
  bg.addEventListener('click', function(e){ if(e.target===bg) close(); });
  bg.querySelector('#sheetClose').addEventListener('click', close);
  Array.prototype.forEach.call(bg.querySelectorAll('.examples button'), function(b){
    b.addEventListener('click', function(){ txt.value = EXAMPLES[+b.dataset.ex]; txt.focus(); });
  });

  send.addEventListener('click', function(){
    const body = txt.value.trim();
    if(!body && !shots.length){ say('bad','צרף שקף או כתוב מה להוסיף.'); txt.focus(); return; }
    send.disabled = true;
    say('work', shots.length ? 'Claude קורא את השקפים ובונה מהם שאלות…'
                             : 'Claude כותב את הפריט ומעדכן את התוכן…');
    callFn(CFG.addQuestionUrl,
      { request:body, deck:bg.querySelector('#addDeck').value, images:shots }
    ).then(function(res){
      if(res.status===401){ say('bad', res.body.error || 'ההתחברות נדחתה.'); send.disabled=false; return; }
      if(!res.ok){ say('bad', res.body.error || ('השרת החזיר '+res.status)); send.disabled=false; return; }
      say('ok', (res.body.summary || 'נוסף.') + ' האתר נבנה מחדש — רענן בעוד כדקה.');

  const st = cardState(key);
  if(!st) return '<span class="chip new">חדש</span>';
  const days = Math.round((st.due - Date.now()) / DAY);
  if(days <= 0) return '<span class="chip due">לחזרה</span>';
  return '<span class="chip">בעוד '+days+(days===1?' יום':' ימים')+'</span>';
}

    const mineIds = r[0].map(function(d){ return d.id; });

    view.others = r[1].filter(function(d){ return mineIds.indexOf(d.id) < 0; });

/* ===========================================================
   סטטיסטיקה. תחזית העומס נגזרת מ-CARDS המקומי ולכן זמינה גם אופליין;
   שיעור ההצלחה דורש את יומן החזרות מהשרת.
   =========================================================== */
const DAY_NAMES = ['א','ב','ג','ד','ה','ו','ש'];

function forecast(days){
  const out = [];
  const start = new Date(); start.setHours(0,0,0,0);
  for(let i=0;i<days;i++){
    const from = start.getTime() + i*DAY, to = from + DAY;
    let n = 0;
    Object.keys(CARDS).forEach(function(k){
      const due = CARDS[k].due;
      /* כל מה שבאיחור נופל להיום, כי זה מה שבאמת מחכה לך */
      if(i===0 ? due < to : (due >= from && due < to)) n++;
    });
    out.push({t:from, n:n, day:DAY_NAMES[new Date(from).getDay()]});
  }
  return out;
}

/* עמודות דקות, קצה נתונים מעוגל, רווח בין עמודות, רשת רצסיבית.
   סדרה אחת — אין מקרא, הכותרת היא שמה. */
function barChart(rows, opts){
  const W = 320, H = 132, padB = 20, padT = 14;
  const max = Math.max(1, rows.reduce(function(a,r){ return Math.max(a, r.n); }, 0));
  const gap = 2, bw = (W - gap*(rows.length-1)) / rows.length;
  const y = function(v){ return padT + (H - padT - padB) * (1 - v/max); };

  let grid = '', bars = '', labels = '';
  [0, max/2, max].forEach(function(v){
    const yy = y(v);
    grid += '<line x1="0" y1="'+yy+'" x2="'+W+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>';
    grid += '<text x="'+(W+4)+'" y="'+(yy+3.5)+'" font-size="9" fill="var(--ink-2)" '+
            'font-family="IBM Plex Sans, sans-serif">'+Math.round(v)+'</text>';
  });

  rows.forEach(function(r, i){
    const x = i*(bw+gap), h = Math.max(r.n ? 3 : 0, (H - padT - padB) * r.n/max);
    const top = H - padB - h;
    const fill = i===0 ? 'var(--c-o)' : 'var(--accent)';
    if(h > 0){
      bars += '<rect class="bar-mark" x="'+x+'" y="'+top+'" width="'+bw+'" height="'+h+'" '+
              'rx="'+Math.min(4, bw/2)+'" fill="'+fill+'"/>';
    }
    bars += '<rect class="bar-hit" x="'+x+'" y="'+padT+'" width="'+bw+'" height="'+(H-padT-padB)+'" '+
            'data-tip="'+esc((i===0?'היום':r.day)+' · '+r.n+' כרטיסים')+'"><title>'+
            esc((i===0?'היום':'בעוד '+i+' ימים')+': '+r.n+' כרטיסים')+'</title></rect>';
    /* תווית על כל עמודה שלישית בלבד — לא מספר על כל נקודה */
    if(i===0 || i % 3 === 0){
      labels += '<text x="'+(x+bw/2)+'" y="'+(H-6)+'" font-size="9" text-anchor="middle" '+
                'fill="var(--ink-2)" font-family="IBM Plex Sans, sans-serif">'+
                (i===0 ? 'היום' : r.day)+'</text>';
    }
  });

  return '<svg viewBox="-2 0 '+(W+26)+' '+H+'" role="img" dir="ltr" '+
    'aria-label="'+esc(opts.alt)+'">'+grid+bars+labels+'</svg>';
}

function loadStats(){
  view.stats = {loading:true};
  render();
  const since = new Date(Date.now() - 30*DAY).toISOString();
  const q = canSync()
    ? rest('review_log?select=rating,reviewed_at&reviewed_at=gte.' + since +
           '&order=reviewed_at.desc&limit=3000')
        .then(function(r){ return r.ok ? r.json() : []; }).catch(function(){ return []; })
    : Promise.resolve([]);
  q.then(function(logs){
    const week = Date.now() - 7*DAY;
    view.stats = {
      loading:false,
      total: logs.length,
      correct: logs.filter(function(l){ return l.rating > 1; }).length,
      week: logs.filter(function(l){ return Date.parse(l.reviewed_at) >= week; }).length,
    };
    render();
  });
}

  const seen = items.filter(function(x){ return cardState(x.key); }).length;

  const rows = forecast(14);

      '<div class="tile"><b dir="ltr">'+(st.loading?'…':st.week)+'</b>'+

        '<span>נשלטים</span></div>'+
    '</div>'+

    '<div class="panel-chart">'+
      '<h3>תחזית עומס</h3>'+
      '<p class="cap">כמה כרטיסים ממתינים לחזרה בכל יום. העמודה הראשונה כוללת גם מה שכבר באיחור.</p>'+
      barChart(rows, {alt:'תחזית חזרות לארבעה־עשר הימים הקרובים'})+
    '</div>'+

    '<div>'+
      '<h3 style="font-family:\'IBM Plex Sans\',sans-serif;font-size:11px;font-weight:600;'+
        'letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px">לפי נושא</h3>'+
      '<div class="dtable">'+DECKS.map(function(d){
        const dm = masteredCount(d.items, d.keyFn), dd = dueCount(d.items, d.keyFn);
        return '<div class="drow"><span class="dot" style="background:'+d.color+'"></span>'+
          '<span class="nm">'+esc(d.title)+'</span>'+
          '<span class="num"><b>'+dm+'</b>/'+d.items.length+' נשלטים · <b>'+dd+'</b> לחזרה</span></div>';
      }).join('')+'</div>'+
    '</div>'+

    '<p class="note">'+seen+' מתוך '+items.length+' כרטיסים כבר נראו. '+
      (canSync() ? '' : 'שיעור ההצלחה דורש חיבור לרשת.')+'</p>'+
  '</div>';

  app.querySelector('#backBtn').addEventListener('click', function(){ view={name:'home'}; render(); });

  /* שכבת ריחוף — נגיעה או מעבר עכבר על עמודה */
  const tip = document.createElement('div');
  tip.className = 'tip';
  document.body.appendChild(tip);
  const show = function(e){
    const t = e.currentTarget.dataset.tip;
    tip.textContent = t; tip.classList.add('on');
    const r = e.currentTarget.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(window.innerWidth - tip.offsetWidth - 8,
                                          r.left + r.width/2 - tip.offsetWidth/2)) + 'px';
    tip.style.top = (r.top - tip.offsetHeight - 6) + 'px';
  };
  const hide = function(){ tip.classList.remove('on'); };
  Array.prototype.forEach.call(app.querySelectorAll('.bar-hit'), function(b){
    b.addEventListener('mouseenter', show);
    b.addEventListener('mouseleave', hide);
    b.addEventListener('touchstart', show, {passive:true});
    b.addEventListener('touchend', hide);
  });
}

function render(){
  if(authEnabled && !AUTH){ renderLock(); window.scrollTo(0,0); return; }
  if(quiz && quiz.done) renderResults();
  else if(quiz) renderQuiz();
  else if(view.name==='deck') renderDeck();
  else if(view.name==='map') renderMap();
  else if(view.name==='lab') renderLab();
  else if(view.name==='browse') renderBrowse();
  else if(view.name==='store') renderStore();
  else if(view.name==='stats') renderStats();
  else renderHome();
  window.scrollTo(0,0);
}

document.addEventListener('keydown', function(e){
  if(!quiz || quiz.done) return;
  const q = quiz.qs[quiz.i];
  if(q.answered && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); next(); return; }
  const n = parseInt(e.key,10);
  if(n>=1 && n<=4 && !q.answered) answer(q.options[n-1].id);
});

render();
if(canSync()){
  verifyAccess(false);
  pullCards();
  flushQueue();
  /* קודם זהות — הספרייה והבעלות תלויות ב-uid */
  (authEnabled ? loadIdentity() : Promise.resolve()).then(loadLibrary);
} else if(authEnabled) {
  loadIdentity();
}

/* קישור לנושא — פותח את המאגר עם הנושא בראש הרשימה */
(function(){
  const shared = new URLSearchParams(location.search).get('deck');
  if(!shared) return;
  history.replaceState(null, '', location.pathname);
  const open = function(){ if(canSync()) openStore(shared); };
  if(AUTH) setTimeout(open, 400); else pendingShare = shared;
})();
</script>
