<title>שינון ידע</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
:root{
  --bg:#EFF3F2; --surface:#FFFFFF; --surface-2:#E4EAE9; --ink:#131C1B; --ink-2:#596967;
  --line:#D2DBD9; --line-2:#BCC8C6;
  --accent:#0E7C72; --on-accent:#FFFFFF;
  --c-o:#CF6F2B; --c-n:#3A76BE; --c-s:#B2900F; --c-p:#A5713C; --c-c:#131C1B; --c-x:#8A4B9E;
  --ok:#1C8555; --ok-bg:#E1F1E9; --bad:#BC4028; --bad-bg:#F8E5E1;
  --shadow:0 1px 2px rgba(19,28,27,.06), 0 8px 24px -12px rgba(19,28,27,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1312; --surface:#141F1D; --surface-2:#1D2A28; --ink:#E9F0EE; --ink-2:#93A5A2;
    --line:#283634; --line-2:#3A4B48;
    --accent:#41BAAA; --on-accent:#06201D;
    --c-o:#EFA262; --c-n:#82B2EE; --c-s:#DFC44B; --c-p:#D3A374; --c-c:#E9F0EE; --c-x:#C48FD8;
    --ok:#4FCB8E; --ok-bg:#122E24; --bad:#F27A5F; --bad-bg:#331A15;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1312; --surface:#141F1D; --surface-2:#1D2A28; --ink:#E9F0EE; --ink-2:#93A5A2;
  --line:#283634; --line-2:#3A4B48;
  --accent:#41BAAA; --on-accent:#06201D;
  --c-o:#EFA262; --c-n:#82B2EE; --c-s:#DFC44B; --c-p:#D3A374; --c-c:#E9F0EE; --c-x:#C48FD8;
  --ok:#4FCB8E; --ok-bg:#122E24; --bad:#F27A5F; --bad-bg:#331A15;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Heebo","Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%; direction:rtl;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{
  max-width:520px; margin:0 auto; min-height:100dvh;
  display:flex; flex-direction:column;
  padding:0 16px calc(20px + env(safe-area-inset-bottom));
}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:12px;padding:14px 2px 10px}
.bar .icon-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-2);background:var(--surface);flex:none;
}
.bar .icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
.bar .title{flex:1;font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.track > i{display:block;height:100%;background:var(--accent);border-radius:99px;width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}
.count{
  font-family:"IBM Plex Sans",sans-serif;font-variant-numeric:tabular-nums;
  font-size:13px;color:var(--ink-2);letter-spacing:.02em;flex:none;
}
.count b{color:var(--ink);font-weight:600}

/* ---------- typography ---------- */
.eyebrow{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
}
h1{
  font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;
  font-size:clamp(30px,9vw,42px);line-height:1.1;margin:8px 0 10px;
  text-wrap:balance;letter-spacing:-.01em;
}
.lede{color:var(--ink-2);font-size:15px;line-height:1.6;margin:0;max-width:36ch}
.note{font-size:12.5px;color:var(--ink-2);line-height:1.6;text-align:center;padding:0 8px}

/* ---------- home ---------- */
.home-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:28px 0}
.stats-row{display:flex;gap:10px;width:100%;text-align:right}
.stats-row:hover .stat{border-color:var(--line-2)}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.stat b{
  display:block;font-family:"IBM Plex Sans",sans-serif;font-size:22px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.2;
}
.stat span{font-size:11.5px;color:var(--ink-2)}

.deck-list{display:flex;flex-direction:column;gap:10px}
.deck-card{
  display:flex;align-items:center;gap:13px;text-align:right;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:15px;
  padding:14px;box-shadow:var(--shadow);
  transition:border-color .15s,transform .1s;
}
.deck-card:hover{border-color:var(--accent)}
.deck-card:active{transform:scale(.99)}
.deck-card .dot{width:10px;height:10px;border-radius:99px;flex:none}
.deck-card.more{border-style:dashed;background:transparent;box-shadow:none}
.deck-card.more:hover{background:var(--surface)}
.deck-card.more .txt strong{font-family:"Heebo",sans-serif;font-size:15px;font-weight:500}
.deck-card .more-dot{
  width:auto;height:auto;border-radius:0;color:var(--accent);display:grid;place-items:center;
}
.deck-card.more .prog b{color:var(--line-2)}
.deck-card .txt{flex:1;min-width:0}
.deck-card .txt strong{display:block;font-family:"Frank Ruhl Libre",Georgia,serif;font-size:19px;font-weight:700}
.deck-card .txt span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:2px}
.deck-card .prog{
  font-family:"IBM Plex Sans",sans-serif;font-size:12px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;flex:none;text-align:center;
  direction:ltr;white-space:nowrap;
}
.deck-card .prog b{display:block;font-size:16px;font-weight:600;color:var(--ink)}

/* ---------- deck screen ---------- */
.deck-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:20px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
.panel-title{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:19px;font-weight:700}
.panel-meta{font-family:"IBM Plex Sans",sans-serif;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{
  display:flex;align-items:center;gap:12px;text-align:right;
  border:1px solid var(--line);border-radius:12px;padding:13px 14px;
  background:var(--bg);transition:border-color .15s,background .15s,transform .1s;
}
.mode:hover{border-color:var(--accent);background:var(--surface)}
.mode:active{transform:scale(.99)}
.mode .glyph{
  width:38px;height:38px;flex:none;border-radius:10px;background:var(--surface-2);
  display:grid;place-items:center;color:var(--accent);font-family:"IBM Plex Sans",sans-serif;
  font-size:13px;font-weight:600;
}
.mode .txt{flex:1;min-width:0}
.mode .txt strong{display:block;font-size:15px;font-weight:500}
.mode .txt span{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
.mode .arrow{color:var(--line-2);flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.legend span{font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.link-row{display:flex;gap:8px}
.link-btn{
  flex:1;text-align:center;border:1px dashed var(--line-2);border-radius:12px;
  padding:11px;font-size:14px;color:var(--ink-2);
}
.link-btn:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- quiz ---------- */
.quiz{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.prompt-label{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);text-align:center;
}
.stage{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  display:grid;place-items:center;padding:18px 14px;min-height:190px;
  background-image:radial-gradient(var(--line) .8px, transparent .8px);
  background-size:14px 14px;background-position:center;
}
.stage > svg{width:100%;height:auto;max-height:200px}
.stage .q-text{text-align:center;max-width:30ch}
.stage .q-text b{
  display:block;font-family:"Frank Ruhl Libre",Georgia,serif;
  font-size:clamp(24px,7.5vw,34px);font-weight:700;line-height:1.2;
}
.stage .q-text b.ltr{direction:ltr}
.stage .q-text span{display:block;font-size:15px;color:var(--ink-2);margin-top:8px;line-height:1.5}
.el-tile{text-align:center}
.el-tile b{
  display:block;font-family:"IBM Plex Sans",sans-serif;font-size:64px;font-weight:600;
  line-height:1;letter-spacing:-.02em;
}
.el-tile span{display:block;font-size:14px;color:var(--ink-2);margin-top:10px}
.pair{display:flex;align-items:stretch;gap:10px;width:100%}
.pair > div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.pair svg{width:100%;height:auto;max-height:130px}
.pair .tag{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;color:var(--ink-2);
  border:1px solid var(--line);border-radius:6px;padding:1px 7px;
}
.pair .sep{flex:none;width:1px;background:var(--line);align-self:stretch}

.opts{display:flex;flex-direction:column;gap:8px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{
  position:relative;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);
  transition:border-color .15s,background .15s,transform .08s;text-align:right;
}
.opt:not(:disabled):hover{border-color:var(--line-2)}
.opt:not(:disabled):active{transform:scale(.99)}
.opt.text{display:flex;align-items:center;gap:10px;padding:12px 13px}
.opt.text .key{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;color:var(--ink-2);
  width:18px;height:18px;border-radius:5px;border:1px solid var(--line);
  display:grid;place-items:center;flex:none;
}
.opt.text .lbl{flex:1;min-width:0}
.opt.text .lbl strong{display:block;font-size:15px;font-weight:500;line-height:1.35}
.opt.text .lbl strong.ltr{direction:ltr;text-align:right}
.opt.text .lbl em{display:block;font-style:normal;font-size:12px;color:var(--ink-2);margin-top:1px;line-height:1.4}
.opt.text .sym{
  font-family:"IBM Plex Sans",sans-serif;font-size:20px;font-weight:600;
  width:38px;flex:none;text-align:center;
}
.opt.pic{padding:10px;display:grid;place-items:center;min-height:132px}
.opt.pic svg{width:100%;height:auto;max-height:112px}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.42}

.fb-wrap{display:flex;flex-direction:column;gap:8px}
.feedback{
  min-height:52px;display:flex;align-items:center;gap:10px;border-radius:12px;
  padding:10px 13px;font-size:14px;line-height:1.5;border:1px solid transparent;
}
.feedback.hide{visibility:hidden}
.feedback.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.feedback.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.feedback .fb-txt{flex:1}
.feedback .fb-txt b.ltr{direction:ltr;unicode-bidi:isolate}
.next{background:var(--ink);color:var(--bg);border-radius:9px;padding:8px 16px;font-size:14px;font-weight:500;flex:none}

/* ---------- תרגילים אינטראקטיביים ---------- */
.stage.slim{min-height:0;padding:14px}
.stage.slim .q-text{max-width:none}
.stage.slim .q-text b{font-size:clamp(19px,5.4vw,24px);line-height:1.35}
.stage.slim .q-text span{font-size:13.5px;margin-top:6px}
.board{display:flex;flex-direction:column;gap:12px}
.bank{
  background:var(--surface);border:1.5px dashed var(--line-2);border-radius:14px;padding:10px;
  display:flex;flex-direction:column;gap:8px;transition:border-color .15s;
  position:sticky;top:6px;z-index:5;box-shadow:0 6px 16px -10px rgba(0,0,0,.35);
}
.bank.empty,.bank.done{position:static;box-shadow:none}
.zone-hd{font-size:12px;color:var(--ink-2);line-height:1.4}
.chips-a{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;align-content:flex-start}
.chip-a{
  border:1.5px solid var(--line-2);background:var(--surface);border-radius:99px;
  padding:6px 12px;font-size:14px;font-weight:500;line-height:1.3;max-width:100%;
  overflow-wrap:anywhere;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  transition:border-color .12s,background .12s,transform .08s;
}
.chip-a:not(:disabled):hover{border-color:var(--accent)}
.chip-a:not(:disabled):active{transform:scale(.97)}
.chip-a.sel{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.chip-a.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.chip-a.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);text-decoration:line-through}
.chip-a.ghost{border-style:dashed;border-color:var(--ok);background:transparent;color:var(--ok)}
.chip-a.miss{opacity:.45}
.nb{white-space:nowrap}
.chip-a:disabled{cursor:default}
.chip-a.drag{opacity:.35}
.bank.can,.grp.can,.slot.can{border-color:var(--accent)}
.grp.can,.slot.can{background:color-mix(in srgb, var(--accent) 7%, var(--surface))}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:330px){.groups{grid-template-columns:1fr}}
.grp{
  background:var(--surface);border:1.5px solid var(--line);border-radius:13px;padding:9px;
  display:flex;flex-direction:column;gap:7px;transition:border-color .15s,background .15s;
}
.grp-hd{text-align:right;font-size:14px;font-weight:600;line-height:1.35}
.grp-hd small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-2);direction:ltr;text-align:right}
.slot{
  min-height:40px;border:1.5px dashed var(--line-2);border-radius:11px;background:var(--bg);
  display:flex;align-items:stretch;padding:3px;transition:border-color .15s,background .15s;
}
.slot .chip-a{flex:1;border-radius:9px;text-align:center}
.hole{flex:1;min-height:32px;border-radius:9px}
.given{
  background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  padding:8px 11px;font-size:14px;font-weight:500;line-height:1.35;text-align:center;
}
.fix{display:block;font-size:12px;color:var(--ok);text-align:center;line-height:1.35}
.fix::before{content:"✓ "}
.cell{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.seq{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.seq .st{display:flex;align-items:center;gap:9px}
.seq .num{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;color:var(--ink-2);
  width:20px;flex:none;text-align:center;font-variant-numeric:tabular-nums;
}
.seq .ar{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12.5px;color:var(--ink-2)}
.seq .ar-glyph{width:20px;flex:none;text-align:center;font-size:15px;color:var(--line-2)}
.seq .ar .slot{min-height:34px}
.seq .ar .chip-a{font-size:13px;padding:4px 10px}
.cyc{position:relative;width:100%;max-width:400px;margin:0 auto;aspect-ratio:100/125}
.cyc > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cyc .cn{
  position:absolute;width:25%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;gap:2px;
}
.cyc .given,.cyc .chip-a{font-size:12.5px;padding:6px 4px;text-align:center}
.cyc .given{background:var(--surface-2)}
.cyc .slot{background:var(--surface)}
.cyc .fix{font-size:11px}
.legend-a{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.legend-a li{display:flex;align-items:center;gap:9px;font-size:13.5px;line-height:1.4}
.legend-a .slot{min-height:34px}
.legend-a .chip-a{font-size:13px;padding:4px 10px}
.badge{
  width:22px;height:22px;border-radius:99px;flex:none;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2);
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;
}
.act-foot{display:flex;align-items:center;gap:10px}
.act-foot .btn{flex:1}
.act-foot span{font-size:12.5px;color:var(--ink-2);flex:none}

/* ---------- results ---------- */
.results{flex:1;display:flex;flex-direction:column;gap:18px;padding:22px 0 8px}
.score-big{text-align:center}
.score-big b{
  font-family:"IBM Plex Sans",sans-serif;font-size:60px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1;color:var(--accent);
}
.score-big span{display:block;color:var(--ink-2);font-size:14px;margin-top:8px}
.review{display:flex;flex-direction:column;gap:8px}
.review h3{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 2px;
}
.miss{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.miss svg{width:112px;height:66px;flex:none}
.miss .m-sym{font-family:"IBM Plex Sans",sans-serif;font-size:26px;font-weight:600;width:52px;text-align:center;flex:none}
.miss .m-txt{min-width:0}
.miss .m-txt strong{display:block;font-size:15px;line-height:1.35}
.miss .m-txt strong.ltr{direction:ltr;text-align:right}
.miss .m-txt span{font-size:12px;color:var(--ink-2);line-height:1.4}
.btn-row{display:flex;gap:8px}
.btn{flex:1;text-align:center;border-radius:12px;padding:13px;font-size:15px;font-weight:500;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* ---------- isomer map ---------- */
.map-wrap{flex:1;padding:6px 0 10px;display:flex;flex-direction:column;gap:16px}
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding:0 24px 0 0;position:relative}
.tree ul::before{
  content:"";position:absolute;top:0;bottom:16px;right:10px;width:1.5px;background:var(--line-2);opacity:.7;
}
.tree li{position:relative;padding:0 16px 0 0;margin-top:8px}
.tree ul > li::before{
  content:"";position:absolute;top:18px;right:-14px;width:15px;height:1.5px;background:var(--line-2);opacity:.7;
}
.node{
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:9px 12px;
  border-right:3px solid var(--nc,var(--line-2));
}
.node strong{display:block;font-size:14.5px;font-weight:500}
.node em{display:block;font-style:normal;font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.45}
.node .ex{
  display:block;font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;color:var(--accent);
  margin-top:4px;direction:ltr;text-align:right;
}
.root-node{border-right-width:3px}

/* ---------- הוספת שאלה ---------- */
.add-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:1px dashed var(--line-2);border-radius:12px;padding:12px;
  font-size:14px;color:var(--ink-2);transition:color .15s,border-color .15s;
}
.add-btn:hover{color:var(--accent);border-color:var(--accent)}

.sheet-bg{
  position:fixed;inset:0;background:rgba(8,14,13,.6);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;
}
.sheet{
  width:100%;max-width:520px;background:var(--surface);
  border:1px solid var(--line);border-bottom:none;
  border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;
  max-height:92dvh;overflow-y:auto;
  animation:sheet-up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes sheet-up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sheet-head h2{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:20px;font-weight:700;margin:0}
.sheet-head button{font-size:14px;color:var(--ink-2)}
.sheet label{font-size:12.5px;color:var(--ink-2);display:block;margin-bottom:5px}
.sheet textarea,.sheet select,.sheet input{
  width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;font:inherit;font-size:15px;
}
.sheet textarea{min-height:110px;resize:vertical;line-height:1.5}
.sheet select{appearance:none}
.sheet .hint{font-size:12px;color:var(--ink-2);line-height:1.55}
.sheet .send{
  background:var(--accent);color:var(--on-accent);border-radius:12px;
  padding:13px;font-size:15px;font-weight:500;
}
.sheet .send:disabled{opacity:.5;cursor:default}
.sheet .status{
  border-radius:11px;padding:10px 12px;font-size:13.5px;line-height:1.55;
  border:1px solid var(--line);background:var(--bg);
}
.sheet .status.work{border-color:var(--accent);color:var(--accent)}
.sheet .status.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.sheet .status.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.sheet .examples{display:flex;flex-wrap:wrap;gap:6px}
.sheet .examples button{
  font-size:12px;color:var(--ink-2);border:1px solid var(--line);
  border-radius:99px;padding:5px 11px;
}
.sheet .examples button:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- תמונות בגיליון ההוספה ---------- */
.pick{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:1px dashed var(--line-2);border-radius:12px;padding:12px;
  font-size:14px;color:var(--ink-2);
}
.pick:hover{color:var(--accent);border-color:var(--accent)}
.shots{display:flex;flex-wrap:wrap;gap:8px}
.shot{position:relative;width:74px;height:74px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot button{
  position:absolute;top:3px;inset-inline-end:3px;width:20px;height:20px;border-radius:99px;
  background:rgba(8,14,13,.78);color:#fff;font-size:13px;line-height:1;
  display:grid;place-items:center;
}
.shot button:hover{background:var(--bad)}

.btn.go{width:100%;font-size:16px;padding:15px}
.lib-err{
  border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);
  border-radius:12px;padding:12px 13px;font-size:13.5px;line-height:1.55;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.lib-err button{
  flex:none;border:1px solid currentColor;border-radius:9px;padding:5px 12px;font-size:13px;
}
.lib-warn{
  border:1px solid var(--c-o);border-radius:12px;padding:10px 12px;
  font-size:12.5px;line-height:1.5;color:var(--c-o);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
.lib-warn button{
  flex:none;border:1px solid currentColor;border-radius:9px;padding:4px 11px;font-size:12.5px;
}
.why{
  background:var(--surface-2);border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;font-size:13.5px;line-height:1.6;color:var(--ink);
}
.why-btn{
  border:1px solid currentColor;border-radius:9px;padding:6px 12px;
  font-size:13px;flex:none;
}
.exam{
  display:block;width:100%;text-align:center;padding:9px;
  font-size:12.5px;color:var(--ink-2);border:1px solid transparent;border-radius:11px;
}
.exam:hover{color:var(--accent);border-color:var(--line)}
.alt-clear{
  width:100%;text-align:center;padding:11px;font-size:13.5px;color:var(--ink-2);
  border:1px solid var(--line);border-radius:12px;
}
.alt-clear:hover{color:var(--bad);border-color:var(--bad)}

/* ---------- סטטיסטיקה ---------- */
.stats-wrap{flex:1;display:flex;flex-direction:column;gap:16px;padding:4px 0 12px}
.hero{display:flex;gap:10px}
.hero .tile{
  flex:1;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 13px;
}
.hero .tile b{
  display:block;font-family:"IBM Plex Sans",sans-serif;font-size:26px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:1.15;
}
.hero .tile span{display:block;font-size:11.5px;color:var(--ink-2);margin-top:3px;line-height:1.4}
.panel-chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px 10px}
.panel-chart h3{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-2);margin:0 0 2px;padding:0 2px;
}
.panel-chart .cap{font-size:12px;color:var(--ink-2);margin:0 0 10px;padding:0 2px;line-height:1.5}
.panel-chart svg{width:100%;height:auto;display:block;overflow:visible}
.bar-hit{fill:transparent;cursor:default}
.bar-hit:hover + .bar-mark, .bar-hit:focus + .bar-mark{fill:var(--ink)}
.tip{
  position:fixed;pointer-events:none;z-index:60;background:var(--ink);color:var(--bg);
  border-radius:8px;padding:5px 9px;font-size:12px;white-space:nowrap;
  font-variant-numeric:tabular-nums;opacity:0;transition:opacity .12s;
}
.tip.on{opacity:1}
.dtable{display:flex;flex-direction:column;gap:7px}
.drow{
  display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;
}
.drow .dot{width:9px;height:9px;border-radius:99px;flex:none}
.drow .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .num{
  font-family:"IBM Plex Sans",sans-serif;font-size:12.5px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;flex:none;direction:ltr;
}
.drow .num b{color:var(--ink);font-weight:600}

/* ---------- צ'אט הוספת תוכן ---------- */
.chat{display:flex;flex-direction:column;gap:10px;max-height:62vh}
.chat-log{
  flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:9px;
  padding:2px;min-height:120px;
}
.bub{
  max-width:88%;border-radius:14px;padding:9px 12px;font-size:14px;line-height:1.55;
  white-space:pre-wrap;word-break:break-word;
}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-left-radius:5px}
.bub.ai{align-self:flex-start;background:var(--surface-2);color:var(--ink);border-bottom-right-radius:5px}
.bub.sys{
  align-self:center;background:transparent;border:1px dashed var(--line-2);
  color:var(--ink-2);font-size:12.5px;text-align:center;max-width:100%;
}
.bub.done{
  align-self:center;max-width:100%;background:var(--ok-bg);border:1px solid var(--ok);
  color:var(--ok);font-size:13px;text-align:center;
}
.bub .files{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.bub .files img{width:52px;height:52px;object-fit:cover;border-radius:7px}
.bub .files .doc{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;border-radius:7px;
  padding:4px 8px;background:rgba(0,0,0,.18);
}
.typing{display:inline-flex;gap:3px;align-items:center}
.typing i{width:5px;height:5px;border-radius:99px;background:currentColor;opacity:.4;
  animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
.composer{display:flex;flex-direction:column;gap:8px}
.tray{display:flex;flex-wrap:wrap;gap:7px}
.tray .chip-f{
  position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;
  width:58px;height:58px;display:grid;place-items:center;background:var(--surface-2);
}
.tray .chip-f img{width:100%;height:100%;object-fit:cover}
.tray .chip-f span{font-family:"IBM Plex Sans",sans-serif;font-size:10px;color:var(--ink-2);padding:2px}
.tray .chip-f button{
  position:absolute;top:2px;inset-inline-end:2px;width:17px;height:17px;border-radius:99px;
  background:rgba(8,14,13,.8);color:#fff;font-size:11px;display:grid;place-items:center;
}
.row-in{display:flex;gap:8px;align-items:flex-end}
.row-in textarea{
  flex:1;min-height:44px;max-height:120px;resize:none;
  background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;line-height:1.4;
}
.row-in button{
  flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--ink-2);
}
.row-in button:hover{color:var(--accent);border-color:var(--accent)}
.row-in button.go{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.row-in button:disabled{opacity:.5;cursor:default}
.paste-hint{font-size:11.5px;color:var(--ink-2);text-align:center}

/* ---------- מאגר הנושאים ---------- */
.store-wrap{flex:1;display:flex;flex-direction:column;gap:14px;padding:4px 0 10px}
.sec-note{font-size:12px;color:var(--ink-2);line-height:1.55;margin:0 0 9px}
.store-sec h3{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px;
}
.store-sec{display:flex;flex-direction:column}
.scard{
  display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:8px;
}
.scard .txt{flex:1;min-width:0}
.scard .txt strong{display:flex;align-items:center;gap:6px;font-size:15.5px;font-weight:600;line-height:1.3}
.scard .txt span{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.scard .act{
  flex:none;border:1px solid var(--line-2);border-radius:99px;
  padding:6px 13px;font-size:12.5px;color:var(--ink-2);white-space:nowrap;
}
.scard .act:hover{color:var(--accent);border-color:var(--accent)}
.scard .act.on{color:var(--accent);border-color:var(--accent)}
.scard .act.danger:hover{color:var(--bad);border-color:var(--bad)}
.scard .act:disabled{opacity:.5;cursor:default}
.scard.hl{border-color:var(--accent)}
.diag{
  border:1px dashed var(--line-2);border-radius:12px;padding:10px 12px;
  font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;color:var(--ink-2);
  display:flex;flex-direction:column;gap:3px;
}
.diag b{color:var(--ink);letter-spacing:.1em;text-transform:uppercase;font-size:10px}
.diag-acts{display:flex;gap:8px;margin-top:6px}
.diag-acts button{
  border:1px solid var(--line-2);border-radius:99px;padding:4px 11px;
  font-size:11.5px;color:var(--ink-2);
}
.diag-acts button:hover{color:var(--accent);border-color:var(--accent)}
.diag-acts button:disabled{opacity:.5}
.diag-report{
  margin-top:6px;border-radius:8px;padding:6px 9px;
  background:var(--surface-2);color:var(--ink);font-size:11.5px;line-height:1.5;
}
.elist{display:flex;flex-direction:column;gap:8px}
.erow{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.ehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.ekind{
  font-family:"IBM Plex Sans",sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line-2);border-radius:99px;padding:1px 8px;color:var(--ink-2);
}
.ekind.k-fetch{color:var(--c-o);border-color:var(--c-o)}
.ekind.k-function{color:var(--c-n);border-color:var(--c-n)}
.ekind.k-client,.ekind.k-promise{color:var(--bad);border-color:var(--bad)}
.ewhen{font-family:"IBM Plex Sans",sans-serif;font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.emsg{font-size:13.5px;line-height:1.45;word-break:break-word}
.ectx{
  font-family:"IBM Plex Sans",sans-serif;font-size:11px;color:var(--ink-2);
  margin-top:5px;word-break:break-all;line-height:1.45;
}
.panel.share{padding:13px 14px;display:flex;flex-direction:column;gap:10px}
.share-row{display:flex;align-items:center;gap:12px}
.share-row > div{flex:1;min-width:0}
.share-row strong{display:block;font-size:14.5px;font-weight:600}
.share-row span{display:block;font-size:12px;color:var(--ink-2);margin-top:2px;line-height:1.5}
.share-row .act{
  flex:none;border:1px solid var(--line-2);border-radius:99px;padding:6px 13px;
  font-size:12.5px;color:var(--ink-2);white-space:nowrap;
}
.share-row .act.on{color:var(--accent);border-color:var(--accent)}
.share-row .act:disabled{opacity:.5;cursor:default}
.vis{
  flex:none;font-size:10.5px;border-radius:99px;padding:1px 8px;
  border:1px solid var(--line-2);color:var(--ink-2);font-weight:400;
}
.vis.pub{color:var(--accent);border-color:var(--accent)}
.vis.wait{color:var(--c-o);border-color:var(--c-o)}
.vis.no{color:var(--bad);border-color:var(--bad)}
.scard .rnote{color:var(--bad)}

/* ---------- ניהול ---------- */
.admin-wrap{flex:1;display:flex;flex-direction:column;gap:12px;padding:4px 0 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{
  border:1px solid var(--line-2);border-radius:99px;padding:5px 12px;font-size:12.5px;color:var(--ink-2);
}
.tabs button.on{color:var(--accent);border-color:var(--accent)}
.tabs button b{font-weight:600;margin-inline-start:4px}
.arow{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;
  display:flex;flex-direction:column;gap:8px;
}
.arow .ahead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.arow strong{font-size:14.5px;font-weight:600;word-break:break-word}
.arow .meta{font-size:12px;color:var(--ink-2);line-height:1.5;word-break:break-word}
.arow .meta b{color:var(--ink);font-weight:500}
.arow .warn{color:var(--c-o)}
.arow .acts{display:flex;gap:6px;flex-wrap:wrap}
.arow .acts button{
  border:1px solid var(--line-2);border-radius:99px;padding:5px 12px;font-size:12.5px;color:var(--ink-2);
}
.arow .acts button.ok{color:var(--ok);border-color:var(--ok)}
.arow .acts button.danger:hover{color:var(--bad);border-color:var(--bad)}
.arow .acts button:disabled{opacity:.5;cursor:default}
.ekind.k-sync{color:var(--accent);border-color:var(--accent)}
.ewho{font-family:"IBM Plex Sans",sans-serif;font-size:11px;color:var(--ink-2);margin-top:4px;word-break:break-all}

/* ---------- עיון ---------- */
.browse-wrap{flex:1;display:flex;flex-direction:column;gap:12px;padding:4px 0 10px}
.browse-bar{display:flex;gap:8px;align-items:center}
.browse-bar input{
  flex:1;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:11px;padding:10px 12px;font:inherit;font-size:15px;
}
.browse-bar button{
  flex:none;border:1px solid var(--line);border-radius:11px;padding:10px 13px;
  font-size:13px;color:var(--ink-2);background:var(--surface);white-space:nowrap;
}
.browse-bar button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.browse-count{font-family:"IBM Plex Sans",sans-serif;font-size:12px;color:var(--ink-2);text-align:center}
.cards{display:flex;flex-direction:column;gap:9px}
.bcard{
  background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:12px 13px;display:flex;gap:12px;align-items:flex-start;
}
.bcard .lead{flex:none;width:104px;display:grid;place-items:center}
.bcard .lead svg{width:100%;height:auto;max-height:76px}
.bcard .lead .sym{font-family:"IBM Plex Sans",sans-serif;font-size:30px;font-weight:600}
.bcard .main{flex:1;min-width:0}
.bcard h4{margin:0;font-size:16px;font-weight:600;line-height:1.3}
.bcard h4.ltr{direction:ltr;text-align:right}
.bcard .sub{font-size:12.5px;color:var(--ink-2);margin-top:1px;direction:ltr;text-align:right}
.bcard .body{font-size:14px;line-height:1.55;margin-top:7px}
.bcard .body.blur{filter:blur(5px);user-select:none;cursor:pointer}
.bcard .blist{margin:7px 0 0;padding:0 18px 0 0;font-size:13.5px;line-height:1.65}
.bcard ul.blist{list-style:none;padding:0}
.bcard .blist b{font-weight:600}
.bcard .blist .via{color:var(--ink-2);font-size:12.5px}
.bcard .note{
  font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;color:var(--accent);
  margin-top:5px;unicode-bidi:plaintext;text-align:right;
}
.bcard .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.chip{
  font-size:11px;border-radius:99px;padding:2px 9px;border:1px solid var(--line-2);color:var(--ink-2);
}
.chip.due{border-color:var(--c-o);color:var(--c-o)}
.chip.new{border-color:var(--accent);color:var(--accent)}
.chip.cat{border-color:transparent}

/* ---------- מעבדה — שינוי האפליקציה עצמה ---------- */
.lab-entry{
  display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  padding:10px;font-size:12.5px;color:var(--ink-2);
  border:1px solid transparent;border-radius:11px;
}
.lab-entry:hover{color:var(--accent);border-color:var(--line)}
.lab-wrap{flex:1;display:flex;flex-direction:column;gap:14px;padding:8px 0 10px}
.lab-warn{
  border:1px solid var(--line);border-right:3px solid var(--c-o);border-radius:11px;
  padding:11px 13px;font-size:12.5px;color:var(--ink-2);line-height:1.6;
}
.lab-wrap label{font-size:12.5px;color:var(--ink-2);display:block;margin-bottom:5px}
.lab-wrap textarea,.lab-wrap input{
  width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;font:inherit;font-size:15px;
}
.lab-wrap textarea{min-height:130px;resize:vertical;line-height:1.5}
.lab-wrap .send{
  background:var(--accent);color:var(--on-accent);border-radius:12px;
  padding:13px;font-size:15px;font-weight:500;
}
.lab-wrap .send:disabled{opacity:.5;cursor:default}
.lab-wrap .undo{
  border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px;color:var(--ink-2);
}
.lab-wrap .undo:hover{color:var(--bad);border-color:var(--bad)}
.lab-wrap .undo:disabled{opacity:.5;cursor:default}
.lab-status{
  border-radius:11px;padding:11px 13px;font-size:13.5px;line-height:1.6;
  border:1px solid var(--line);background:var(--surface);
}
.lab-status.work{border-color:var(--accent);color:var(--accent)}
.lab-status.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.lab-status.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}

/* ---------- חשבון ---------- */
.acct{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:12.5px;color:var(--ink-2);padding:2px;
}
.acct b{font-weight:500;color:var(--ink);direction:ltr}
.acct button{color:var(--ink-2);text-decoration:underline;text-underline-offset:3px}
.acct button:hover{color:var(--accent)}
.gbtn{
  display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  border:1px solid var(--line-2);border-radius:12px;padding:12px;
  font-size:15px;font-weight:500;background:var(--surface);
}
.gbtn:hover{border-color:var(--accent)}
.gbtn svg{flex:none}

/* ---------- מסך נעילה ---------- */
.lock{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  gap:18px;padding:32px 0;max-width:360px;margin:0 auto;width:100%;
}
.lock h1{margin:6px 0 0}

<script>
/* viewport — מוזרק בזמן ריצה כדי לעבוד גם כארטיפקט מתארח */
(function(){
  var m=document.querySelector('meta[name="viewport"]');
  if(!m){ m=document.createElement('meta'); m.name='viewport'; document.head.appendChild(m); }
  m.content='width=device-width, initial-scale=1, viewport-fit=cover';
  var t=document.querySelector('meta[name="theme-color"]');
  if(!t){ t=document.createElement('meta'); t.name='theme-color'; document.head.appendChild(t); }
  const dark = typeof matchMedia==='function' && matchMedia('(prefers-color-scheme: dark)').matches;
  t.content = dark ? '#0B1312' : '#EFF3F2';
  var c=document.createElement('meta');
  c.name='apple-mobile-web-app-capable'; c.content='yes'; document.head.appendChild(c);
})();

/* התוכן וההגדרות מוזרקים בזמן בנייה מ-data/decks.json ו-data/config.json */
const DATA = JSON.parse(document.getElementById('deck-data').textContent);
const CFG = (function(){
  const el = document.getElementById('app-config');
  try{ return el ? JSON.parse(el.textContent) : {}; }catch(e){ return {}; }
})();

/* בטוח גם לתוך ערך של מאפיין HTML. פעם רק & ו-< הומרו, ומזהה או צבע
   עם גרשיים מחבילה ציבורית יכלו להוסיף מאפיינים משלהם. */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* צבע מתוכן משתמשים נכנס ל-style — רק משתנה עיצוב, hex או שם פשוט */
function safeColor(c, fb){
  const v = String(c == null ? '' : c).trim();
  if(/^var\(--[a-z0-9-]{1,30}\)$/i.test(v) || /^#[0-9a-f]{3,8}$/i.test(v) || /^[a-z]{3,20}$/i.test(v)) return v;
  return fb || 'var(--ink-2)';
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function sample(arr,n){ return shuffle(arr).slice(0,n); }

/* ===========================================================
   מנוע ציור מולקולות
   a: [label,x,y]   b: [i,j,order]   order: 1 יחיד · 2 כפול · 3 טריז · 4 מקווקו
   =========================================================== */
function atomColor(t){
  if(t.indexOf('P')>-1) return 'var(--c-p)';
  if(t.indexOf('S')>-1 && t!=='Si') return 'var(--c-s)';
  if(t.indexOf('Br')>-1 || t.indexOf('Cl')>-1) return 'var(--c-x)';
  if(t.indexOf('N')>-1) return 'var(--c-n)';
  if(t.indexOf('O')>-1) return 'var(--c-o)';
  return 'var(--c-c)';
}
function baseLabel(t){ return t.replace(/[⁻⁺]/g,''); }
/* מעריכים, מטענים ומורידים צרים — לא נספרים כתו מלא */
function halfW(t){
  const core = t.replace(/[⁻⁺¹²³₀₁₂₃₄₅₆₇₈₉]/g,'');
  const narrow = t.length - core.length;
  return 0.20*core.length + 0.06 + (narrow?0.09:0);
}
const HALF_H = 0.34;
function edgeDist(t,dx,dy){
  const a=halfW(t), b=HALF_H;
  return 1/Math.sqrt((dx*dx)/(a*a) + (dy*dy)/(b*b));
}

function molSVG(g, opts){
  opts = opts||{};
  const pad = 0.85;
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  g.a.forEach(function(at){
    const r = halfW(at.t);
    minX=Math.min(minX,at.x-r); maxX=Math.max(maxX,at.x+r);
    minY=Math.min(minY,at.y-HALF_H); maxY=Math.max(maxY,at.y+HALF_H);
  });
  const vx=minX-pad, vy=minY-pad, vw=(maxX-minX)+pad*2, vh=(maxY-minY)+pad*2;

  let lines='', fills='';
  g.b.forEach(function(bd){
    const p=g.a[bd[0]], q=g.a[bd[1]], order=bd[2];
    let dx=q.x-p.x, dy=q.y-p.y;
    const len=Math.hypot(dx,dy); if(!len) return;
    dx/=len; dy/=len;
    const r1=edgeDist(p.t,dx,dy)+0.09, r2=edgeDist(q.t,dx,dy)+0.09;
    const x1=p.x+dx*r1, y1=p.y+dy*r1, x2=q.x-dx*r2, y2=q.y-dy*r2;
    const px=-dy, py=dx;
    if(order===2){
      const o=0.085;
      lines+='<line x1="'+(x1+px*o)+'" y1="'+(y1+py*o)+'" x2="'+(x2+px*o)+'" y2="'+(y2+py*o)+'"/>';
      lines+='<line x1="'+(x1-px*o)+'" y1="'+(y1-py*o)+'" x2="'+(x2-px*o)+'" y2="'+(y2-py*o)+'"/>';
    } else if(order===3){                      /* טריז — קדימה מהמישור */
      const w=0.15;
      fills+='<polygon points="'+x1+','+y1+' '+(x2+px*w)+','+(y2+py*w)+' '+(x2-px*w)+','+(y2-py*w)+'"/>';
    } else if(order===4){                      /* מקווקו — אחורה מהמישור */
      const n=5, L=Math.hypot(x2-x1,y2-y1);
      for(let k=1;k<=n;k++){
        const f=k/(n+0.4), cx=x1+(x2-x1)*f, cy=y1+(y2-y1)*f, w=0.045+0.115*f;
        lines+='<line x1="'+(cx+px*w)+'" y1="'+(cy+py*w)+'" x2="'+(cx-px*w)+'" y2="'+(cy-py*w)+'"/>';
      }
    } else {
      lines+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>';
    }
  });

  let atoms='';
  g.a.forEach(function(at){
    const base=baseLabel(at.t);
    const charge=at.t.indexOf('⁻')>-1?'–':(at.t.indexOf('⁺')>-1?'+':'');
    let inner=esc(base);
    if(charge) inner+='<tspan dy="-0.22" font-size="0.36">'+charge+'</tspan>';
    atoms+='<text x="'+(+at.x||0)+'" y="'+(+at.y||0)+'" fill="'+atomColor(at.t)+'">'+inner+'</text>';
  });

  return '<svg viewBox="'+vx+' '+vy+' '+vw+' '+vh+'" xmlns="http://www.w3.org/2000/svg" '+
    'role="img" aria-label="'+esc(opts.alt||'מבנה כימי')+'" preserveAspectRatio="xMidYMid meet">'+
    '<g stroke="var(--ink)" stroke-width="0.055" stroke-linecap="round" opacity="0.9">'+lines+'</g>'+
    '<g fill="var(--ink)" opacity="0.9">'+fills+'</g>'+
    '<g font-family="IBM Plex Sans, sans-serif" font-size="0.62" font-weight="500" '+
    'text-anchor="middle" dominant-baseline="central" direction="ltr">'+atoms+'</g></svg>';
}

/* ===========================================================
   דאטה 1 — קבוצות פונקציונליות
   =========================================================== */
const GROUPS = DATA.groups;
/* תוויות הממשק מגיעות מ-data/decks.json, כדי שניתן יהיה לערוך אותן מהאפליקציה */
const UI = DATA.ui || {};
const CAT_COLORS = {hc:'var(--c-c)', ox:'var(--c-o)', n:'var(--c-n)', s:'var(--c-s)', p:'var(--c-p)'};
const CATS = (function(){
  const out = {};
  Object.keys(CAT_COLORS).forEach(function(k){
    out[k] = {he:(UI.cats && UI.cats[k]) || k, color:CAT_COLORS[k]};
  });
  return out;
})();

/* ===========================================================
   דאטה 2 — יסודות עיקריים (bulk) ויסודות קורט (trace)
   =========================================================== */
const ELEMENTS = DATA.elements;
const BULK  = ELEMENTS.filter(function(e){return e.cat==='bulk';});
const TRACE = ELEMENTS.filter(function(e){return e.cat==='trace';});

/* ===========================================================
   דאטה 3 — עץ האיזומרים
   =========================================================== */
const ISO = DATA.iso;
/* מושגי־עזר — נבחנים בהגדרות, לא חלק מהעץ עצמו */
const ISO_TERMS = DATA.isoTerms;
const ISO_ALL = ISO.concat(ISO_TERMS);

/* זוגות מבנים — זיהוי היחס */
const REL = UI.rel || {};
const ISO_PAIRS = DATA.isoPairs;

/* ===========================================================
   FSRS-6 — תזמון חזרות. הנוסחאות והמשקלים לקוחים מקוד הייחוס
   open-spaced-repetition/py-fsrs, לא משוחזרים מהזיכרון.
   מצב כרטיס: s יציבות בימים · d קושי 1..10 · due מתי להראות שוב.
   =========================================================== */
const FSRS_W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001,
                1.8722, 0.1666, 0.796, 1.4835, 0.0614, 0.2629, 1.6483, 0.6014,
                1.8729, 0.5425, 0.0912, 0.0658, 0.1542];
const FSRS_DECAY  = -FSRS_W[20];
const FSRS_FACTOR = Math.pow(0.9, 1 / FSRS_DECAY) - 1;   /* כך ש-R(S,S)=0.9 */
const RETENTION   = 0.9;      /* שיעור השימור שאליו מכוונים */
const MAX_IVL     = 365;
const DAY         = 86400000;
const AGAIN_MS    = 600000;   /* טעות חוזרת בעוד עשר דקות, לא בעוד יום */

const clampD = (d) => Math.min(10, Math.max(1, d));
const clampS = (x) => Math.max(0.001, x);

/* הסתברות להיזכר אחרי elapsed ימים */
function retrievability(stability, elapsed){
  return Math.pow(1 + FSRS_FACTOR * Math.max(0, elapsed) / stability, FSRS_DECAY);
}
function initialStability(g){ return clampS(FSRS_W[g - 1]); }
function initialDifficulty(g, clamp){
  const d = FSRS_W[4] - Math.exp(FSRS_W[5] * (g - 1)) + 1;
  return clamp ? clampD(d) : d;
}
function nextDifficulty(d, g){
  const delta  = -(FSRS_W[6] * (g - 3));
  const damped = d + (10 - d) * delta / 9;              /* ריסון ליניארי */
  const target = initialDifficulty(4, false);
  return clampD(FSRS_W[7] * target + (1 - FSRS_W[7]) * damped);  /* נסיגה לממוצע */
}
function shortTermStability(s, g){
  let inc = Math.exp(FSRS_W[17] * (g - 3 + FSRS_W[18])) * Math.pow(s, -FSRS_W[19]);
  if(g >= 2) inc = Math.max(inc, 1);
  return clampS(s * inc);
}
function recallStability(d, s, r, g){
  const hard = g === 2 ? FSRS_W[15] : 1;
  const easy = g === 4 ? FSRS_W[16] : 1;
  return s * (1 + Math.exp(FSRS_W[8]) * (11 - d) * Math.pow(s, -FSRS_W[9]) *
    (Math.exp((1 - r) * FSRS_W[10]) - 1) * hard * easy);
}
function forgetStability(d, s, r){
  const long  = FSRS_W[11] * Math.pow(d, -FSRS_W[12]) *
                (Math.pow(s + 1, FSRS_W[13]) - 1) * Math.exp((1 - r) * FSRS_W[14]);
  const short = s / Math.exp(FSRS_W[17] * FSRS_W[18]);
  return Math.min(long, short);
}
/* תקרה לפי תאריך המבחן: אין טעם לתזמן כרטיס למועד שאחרי המבחן.
   חצי מהימים שנותרו מבטיח לפחות חזרה אחת נוספת לפני המועד. */
function intervalCap(){
  const d = examDaysLeft();
  if(d == null || d <= 0) return MAX_IVL;
  return Math.max(1, Math.floor(d * 0.5));
}
function examDaysLeft(){
  if(!store.examDate) return null;
  const t = Date.parse(store.examDate + 'T23:59:59');
  if(isNaN(t)) return null;
  return Math.ceil((t - Date.now()) / DAY);
}
function nextInterval(s){
  const iv = (s / FSRS_FACTOR) * (Math.pow(RETENTION, 1 / FSRS_DECAY) - 1);
  return Math.min(MAX_IVL, intervalCap(), Math.max(1, Math.round(iv)));
}

/* ציון 1..4 מתוך תשובה רב־ברירתית: נכונות, ומהירות כאינדיקציה לביטחון */
function gradeOf(correct, ms){
  if(!correct) return 1;
  if(ms > 12000) return 2;
  if(ms < 4000)  return 4;
  return 3;
}

/* ציון לתרגיל שיבוץ: קודם שלמות, ואז מהירות לכל פריט. שתי טעויות
   מתוך עשרה הן "נזכרתי בקושי", לא "שכחתי". */
function gradeOfSet(right, total, ms){
  if(!total) return 1;
  if(right < total) return right / total >= 0.8 ? 2 : 1;
  const per = ms / total;
  if(per > 15000) return 2;
  if(per < 4000)  return 4;
  return 3;
}

function reviewCard(st, g, now){
  now = now || Date.now();
  if(!st || st.s == null){
    const s = initialStability(g);
    return { s:s, d:initialDifficulty(g, true), last:now,
             due: now + (g === 1 ? AGAIN_MS : nextInterval(s) * DAY),
             reps:1, lapses: g === 1 ? 1 : 0 };
  }
  const elapsed = (now - st.last) / DAY;
  const d = nextDifficulty(st.d, g);
  let s;
  if(elapsed < 1){
    s = shortTermStability(st.s, g);                    /* חזרה באותו יום */
  } else {
    const r = retrievability(st.s, elapsed);
    s = g === 1 ? forgetStability(st.d, st.s, r) : recallStability(st.d, st.s, r, g);
  }
  s = clampS(s);
  return { s:s, d:d, last:now,
           due: now + (g === 1 ? AGAIN_MS : nextInterval(s) * DAY),
           reps:(st.reps || 0) + 1, lapses:(st.lapses || 0) + (g === 1 ? 1 : 0) };
}

/* ===========================================================
   אחסון מקומי
   כל מה ששייך למשתמש — כרטיסים, תור, הגדרות, ספרייה, הסברים — נשמר
   תחת מפתח עם ה-uid שלו. כך משתמש שני באותו מכשיר לא רואה את הראשון,
   והתנתקות (גם כפויה, כשהמפגש פג) לא מוחקת תרגול שעוד לא הגיע לשרת.
     UID === null — אין משתמש, ושום דבר לא נכתב.
     UID === ''   — יש מפגש שה-uid שלו עוד לא ידוע. הנתונים נשמרים
                    במרחב הישן (בלי סיומת), והמשתמש הראשון שמזוהה מאמץ
                    אותם — כך עברו הנתונים מהגרסה שלא הפרידה בין משתמשים.
   =========================================================== */
const KEY = 'bio-quiz-v2';                     /* הגדרות: תאריך מבחן, סבבים */
const CARDS_KEY = 'shinun-cards';              /* מצב FSRS לכל כרטיס */
const DIRTY_KEY = 'shinun-dirty';              /* כרטיסים שהשרת עוד לא אישר */
const LOG_KEY   = 'shinun-log';                /* יומן חזרות שממתין לשליחה */
const QUEUE_KEY = 'shinun-queue';              /* התור הישן — מומר בהעברה */
const EXPLAIN_KEY = 'shinun-why';              /* הסברי "למה?" */
const ROWS_KEY  = 'shinun-rows';               /* מראה של הספרייה, לאופליין */
const STORAGE = { failed:null };

let UID = null;
/* עולה בכל החלפת משתמש. תשובה אסינכרונית שחוזרת אחרי החלפה נזרקת,
   כדי שנתונים של משתמש קודם לא ייכתבו בחזרה אל המכשיר. */
let USER_EPOCH = 0;

function jread(k, fb){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):fb; }catch(e){ return fb; } }
/* מחזיר אם נשמר. כשהמקום נגמר מפנים קודם את מה שהשרת יכול להחזיר,
   ומנסים שוב — כך הכרטיסים והתור לא נופלים בשקט. */
function jwrite(k, v){
  let text;
  try{ text = JSON.stringify(v); }catch(e){ return false; }
  try{ localStorage.setItem(k, text); return true; }catch(e){}
  if(freeSpace(k)){
    try{ localStorage.setItem(k, text); return true; }catch(e){}
  }
  STORAGE.failed = String(k).split(':')[0];
  noteStorageFailure();
  return false;
}
function jremove(k){ try{ localStorage.removeItem(k); }catch(e){} }
function storageKeys(){
  const out = [];
  try{ for(let i=0;i<localStorage.length;i++) out.push(localStorage.key(i)); }catch(e){}
  return out;
}
/* סדר הפינוי: הסברים, ספריות של משתמשים אחרים, ואז הספרייה שלי. הכול
   נמשך שוב מהשרת. כרטיסים, תור והגדרות לעולם לא מפונים. */
function freeSpace(keep){
  const keys = storageKeys().filter(function(k){ return k !== keep; });
  const mine = UID ? ROWS_KEY + ':' + UID : ROWS_KEY;
  const waves = [
    function(k){ return k === EXPLAIN_KEY || k.indexOf(EXPLAIN_KEY + ':') === 0; },
    function(k){ return (k === ROWS_KEY || k.indexOf(ROWS_KEY + ':') === 0) && k !== mine; },
    function(k){ return k === mine; }
  ];
  for(let i=0;i<waves.length;i++){
    const hit = keys.filter(waves[i]);
    if(hit.length){ hit.forEach(jremove); return true; }
  }
  return false;
}
let storageNoting = false;
function noteStorageFailure(){
  if(storageNoting) return;
  storageNoting = true;
  try{ logError('client', 'האחסון המקומי מלא — ' + STORAGE.failed, null); }catch(e){}
  storageNoting = false;
}

function ukey(base){ return UID ? base + ':' + UID : base; }
function uread(base, fb){ return UID === null ? fb : jread(ukey(base), fb); }
function uwrite(base, v){ return UID === null ? false : jwrite(ukey(base), v); }
function isObj(x){ return !!x && typeof x === 'object' && !Array.isArray(x); }

/* ---------- הגדרות: תאריך מבחן ומונה סבבים ----------
   מקור האמת ב-user_settings. תאריך המבחן חייב להיות בשרת כי הוא משפיע
   על התזמון עצמו. examAt הוא זמן השינוי המקומי, והשרת דוחה תאריך ישן
   מזה שכבר יש לו; dirty נשאר עד שהשרת אישר. */
function defaultSettings(){ return {rounds:0, examDate:null, examAt:0, dirty:false}; }
function normSettings(s){
  const o = defaultSettings();
  if(isObj(s)){
    if(typeof s.rounds === 'number' && s.rounds >= 0) o.rounds = Math.floor(s.rounds);
    if(typeof s.examDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s.examDate)) o.examDate = s.examDate;
    if(typeof s.examAt === 'number' && isFinite(s.examAt)) o.examAt = s.examAt;
    o.dirty = !!s.dirty;
  }
  return o;
}
let store = defaultSettings();
let SETTINGS_VER = 0;
function saveState(s){ uwrite(KEY, s); }
function setExamDate(v){
  /* מונוטוני: שעון שקפץ אחורה לא יהפוך שינוי חדש לישן מזה שבשרת */
  store.examDate = v || null; store.examAt = Math.max(Date.now(), (store.examAt || 0) + 1);
  store.dirty = true; SETTINGS_VER++;
  saveState(store);
}
function bumpRounds(){
  store.rounds = (store.rounds || 0) + 1; store.dirty = true; SETTINGS_VER++;
  saveState(store);
}

/* ---------- מצב הכרטיסים ----------
   CARDS  — מצב FSRS לכל כרטיס: {s, d, due, last, reps, lapses}.
   DIRTY  — מפתחות שהמצב שלהם עוד לא אושר בשרת. בזמן השליחה השורה נבנית
            מ-CARDS, כך שנשלח תמיד המצב האחרון, פעם אחת לכל כרטיס.
   LOGQ   — יומן החזרות, כל רשומה עם מזהה משלה, כך ששליחה חוזרת אחרי
            תשובה שאבדה לא מכפילה אותה בשרת. */
let CARDS = {};
let DIRTY = {};
let LOGQ  = [];
const LOG_CAP = 5000;

function cardState(key){ return CARDS[key] || null; }
function validState(st){
  return isObj(st) && isFinite(st.s) && isFinite(st.d) && isFinite(st.due) && isFinite(st.last);
}
function newId(){
  const c = typeof crypto !== 'undefined' ? crypto : null;
  if(c && typeof c.randomUUID === 'function') return c.randomUUID();
  const b = new Uint8Array(16);
  if(c && typeof c.getRandomValues === 'function') c.getRandomValues(b);
  else for(let i=0;i<16;i++) b[i] = Math.floor(Math.random()*256);
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = Array.prototype.map.call(b, function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
  return h.slice(0,8)+'-'+h.slice(8,12)+'-'+h.slice(12,16)+'-'+h.slice(16,20)+'-'+h.slice(20);
}
/* int4 בשרת; שאלה שנשארה פתוחה יום שלם היא לא מדד לביטחון */
function clampMs(ms){ return isFinite(ms) && ms > 0 ? Math.min(Math.round(ms), 3600000) : 0; }
function numOrNull(x){ return x == null || !isFinite(x) ? null : +x; }

function saveCards(){
  /* הכרטיסים קודם: הם מה שהמתזמן קורא */
  uwrite(CARDS_KEY, CARDS);
  uwrite(DIRTY_KEY, DIRTY);
  uwrite(LOG_KEY, LOGQ);
}

function recordReview(key, st, grade, elapsedDays, ms){
  CARDS[key] = st;
  DIRTY[key] = 1;
  LOGQ.push({ id:newId(), card_key:key, rating:grade,
              elapsed_days:numOrNull(elapsedDays), duration_ms:clampMs(ms),
              reviewed_at:new Date(st.last).toISOString() });
  if(LOGQ.length > LOG_CAP) LOGQ = LOGQ.slice(-LOG_CAP);
  saveCards();
  syncCardsSoon();
}

/* ---------- הסברים ----------
   מפתח לפי הכרטיס, התשובה שנבחרה ונוסח השאלה: הסבר נכתב על טעות מסוימת,
   ותיקון בכרטיס הופך את ההסבר הישן ללא רלוונטי. */
let WHY = {};
const WHY_CAP = 300;
function hashStr(s){
  let h = 5381;
  for(let i=0;i<s.length;i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}
function whyKeyOf(q){
  const right = (q.options || []).filter(function(o){ return o.id === q.answer; })[0];
  let sig = '';
  try{
    sig = JSON.stringify([q.label, q.prompt, right ? right.main : '',
                          q.act ? (q.chips || []).map(function(c){ return c.text; }) : 0]);
  }catch(e){}
  return q.key + '|' + (q.act ? 'act' : String(q.answered)) + '|' + hashStr(sig);
}
function whyFor(k){ const e = WHY[k]; return e && typeof e.t === 'string' ? e.t : null; }
function whySave(k, text){
  WHY[k] = {t:text, at:Date.now()};
  const keys = Object.keys(WHY);
  if(keys.length > WHY_CAP){
    keys.sort(function(a,b){ return (WHY[a].at||0) - (WHY[b].at||0); })
        .slice(0, keys.length - WHY_CAP).forEach(function(x){ delete WHY[x]; });
  }
  uwrite(EXPLAIN_KEY, WHY);
}

/* ---------- קשירת משתמש ----------
   נקרא באתחול (לפני הציור הראשון), כשהזהות מתבררת, ובהתנתקות. אינו
   מצייר בעצמו — הקורא מצייר. */
function bindUser(uid){
  if(uid === UID) return false;
  const was = UID;
  USER_EPOCH++;
  if(uid) adoptLegacy(uid);
  UID = uid;
  loadUserState();
  /* מעבר ממפגש לא מזוהה לזהות שלו הוא אותו אדם — לא מפריעים לו */
  const sameUser = was === '' && !!uid;
  if(!sameUser && was !== null){
    quiz = null;
    view = {name:'home'};
  }
  return true;
}

function loadUserState(){
  store = normSettings(uread(KEY, null));
  const cards = uread(CARDS_KEY, {});
  CARDS = isObj(cards) ? cards : {};
  const dirty = uread(DIRTY_KEY, {});
  DIRTY = isObj(dirty) ? dirty : {};
  const log = uread(LOG_KEY, []);
  LOGQ = Array.isArray(log) ? log.filter(function(e){ return isObj(e) && e.id && e.card_key; }) : [];
  const why = uread(EXPLAIN_KEY, {});
  WHY = {};
  if(isObj(why)) Object.keys(why).forEach(function(k){ if(isObj(why[k]) && typeof why[k].t === 'string') WHY[k] = why[k]; });
  const rows = uread(ROWS_KEY, null);
  LIB.gen++;
  LIB.rows   = Array.isArray(rows) ? rows : [];
  LIB.status = LIB.rows.length ? 'cached' : 'unknown';
  LIB.reason = null;
  LIB.subs   = null;
  LIB.at     = 0;
  DECKS = buildDecks(LIB.rows);
  /* מפה ממה שבמטמון, אבל שליחה של מפתחות ישנים רק אחרי שהספרייה אומתה */
  LEGACY_READY = false;
  refreshLegacyMap();
}

/* העברה חד־פעמית מהמרחב הישן (בלי uid) אל המשתמש הראשון שמזוהה.
   כותבים את העותק החדש, ורק אם נשמר מוחקים את הישן. שום שליחה של
   הגרסה הקודמת לא הצליחה (user_id חסר), ולכן כל כרטיס ישן מסומן
   לשליחה — השרת שומר את המאוחר מבין השניים. */
function adoptLegacy(uid){
  const scoped = function(b){ return b + ':' + uid; };
  /* המטמון הישן מסגיר של מי הוא: אם יש בו חבילות פרטיות, ואף אחת מהן
     אינה של המשתמש הזה — הנתונים שייכים למי שהיה מחובר לפני העדכון.
     משאירים אותם לו, במקום להעלות את ההיסטוריה שלו לחשבון של אחר. */
  const peek = jread(ROWS_KEY, null);
  const priv = Array.isArray(peek) ? peek.filter(function(r){
    return isObj(r) && r.owner_id && r.visibility !== 'public';
  }) : [];
  if(priv.length && !priv.some(function(r){ return r.owner_id === uid; })) return;
  const oldCards = jread(CARDS_KEY, null), oldDirty = jread(DIRTY_KEY, null);
  const oldLog = jread(LOG_KEY, null), oldQueue = jread(QUEUE_KEY, null);

  if(oldCards || oldDirty || oldLog || oldQueue){
    const cards = jread(scoped(CARDS_KEY), {});
    const dirty = jread(scoped(DIRTY_KEY), {});
    const logA  = jread(scoped(LOG_KEY), []);
    const C = isObj(cards) ? cards : {}, D = isObj(dirty) ? dirty : {};
    let L = Array.isArray(logA) ? logA : [];
    if(isObj(oldCards)) Object.keys(oldCards).forEach(function(k){
      const st = oldCards[k];
      if(!validState(st)) return;
      if(!C[k] || st.last > C[k].last) C[k] = st;
      D[k] = 1;
    });
    if(isObj(oldDirty)) Object.keys(oldDirty).forEach(function(k){ if(C[k]) D[k] = 1; });
    if(Array.isArray(oldLog)) oldLog.forEach(function(e){ if(isObj(e) && e.id && e.card_key) L.push(e); });
    /* התור הישן: {card_key, …מצב, _log:{rating, elapsed_days, duration_ms}} */
    if(Array.isArray(oldQueue)) oldQueue.forEach(function(r){
      if(!isObj(r) || !r.card_key) return;
      if(C[r.card_key]) D[r.card_key] = 1;
      const g = r._log || {};
      if(!(g.rating >= 1 && g.rating <= 4)) return;
      L.push({ id:newId(), card_key:r.card_key, rating:g.rating,
               elapsed_days:numOrNull(g.elapsed_days), duration_ms:clampMs(g.duration_ms),
               reviewed_at:r.last_review || new Date().toISOString() });
    });
    const seen = {};
    L = L.filter(function(e){ if(seen[e.id]) return false; seen[e.id] = 1; return true; }).slice(-LOG_CAP);
    const ok = jwrite(scoped(CARDS_KEY), C) && jwrite(scoped(DIRTY_KEY), D) && jwrite(scoped(LOG_KEY), L);
    if(ok) [CARDS_KEY, DIRTY_KEY, LOG_KEY, QUEUE_KEY].forEach(jremove);
    else logError('client', 'העברת הכרטיסים למשתמש נכשלה — הנתונים הישנים נשמרו', null);
  }

  const oldSettings = jread(KEY, null);
  if(oldSettings){
    let ok = true;
    if(jread(scoped(KEY), null) === null){
      const s = normSettings(oldSettings);
      s.dirty = true;                      /* ייתכן שמעולם לא נשמר בשרת */
      /* ישן מכל שינוי אמיתי, אבל חדש מ"אין תאריך" — כך הוא מגיע למכשיר
         ריק ולא דורס תאריך שנקבע אחר כך במכשיר אחר */
      if(s.examDate && !s.examAt) s.examAt = 1;
      ok = jwrite(scoped(KEY), s);
    }
    if(ok) jremove(KEY);
  }

  /* ספרייה: רק מה שבבעלותו או ציבורי. חבילה פרטית של משתמש אחר לא עוברת. */
  const oldRows = jread(ROWS_KEY, null);
  if(oldRows){
    if(Array.isArray(oldRows) && jread(scoped(ROWS_KEY), null) === null){
      const keep = oldRows.filter(function(r){
        return isObj(r) && (r.owner_id === uid || r.visibility === 'public');
      });
      if(keep.length) jwrite(scoped(ROWS_KEY), keep);
    }
    jremove(ROWS_KEY);
  }
  /* הסברים בפורמט הישן ממופתחים אחרת — אין מה להעביר */
  jremove(EXPLAIN_KEY);
  jremove('shinun-verified');
}

/* ===========================================================
   סנכרון הכרטיסים
   משיכה ← איחוד ← שליחה. הכלל: החזרה המאוחרת מנצחת, בשני הכיוונים.
   מכשיר שתרגל אופליין לא נדרס וגם לא דורס; השרת אוכף את אותו כלל
   (card_state_guard), כך שגם מכשיר ישן שמתעורר לא יחזיר מצב אחורה.
   =========================================================== */
const CARD_CHUNK = 200, PULL_PAGE = 1000;
let cardSync = null, cardSyncAgain = false, cardSyncFull = false, cardSyncTimer = null;

function canSyncUser(){ return canSync() && !!UID && authUid() === UID; }

/* אחרי תשובה — שליחה מרוכזת, לא בקשה לכל נגיעה */
function syncCardsSoon(){
  if(cardSyncTimer) clearTimeout(cardSyncTimer);
  cardSyncTimer = setTimeout(function(){ cardSyncTimer = null; syncCards(false).catch(function(){}); }, 1500);
}

/* full: גם משיכה מהשרת (באתחול, בחזרה לאפליקציה, כשהרשת חוזרת).
   בלעדיו רק שליחה — אחרי תשובות. */
function syncCards(full){
  if(full) cardSyncFull = true;
  if(cardSync){ cardSyncAgain = true; return cardSync; }
  if(!canSyncUser()) return Promise.resolve(false);
  const ep = USER_EPOCH, uid = UID, pull = cardSyncFull;
  cardSyncFull = false;
  cardSync = (pull ? pullCards(ep, uid) : Promise.resolve())
    .catch(function(){})
    .then(function(){ return pushCards(ep, uid); })
    .then(function(){ return pushLogs(ep, uid); })
    .then(function(){ return true; }, function(){ return false; })
    .then(function(ok){
      cardSync = null;
      if(cardSyncAgain && ep === USER_EPOCH){ cardSyncAgain = false; return syncCards(false); }
      cardSyncAgain = false;
      return ok;
    });
  return cardSync;
}

function readPage(path){
  return rest(path).then(function(r){
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}

/* משיכה בעמודים עד עמוד ריק — לא נשענים על גודל העמוד, כי max-rows
   של הפרויקט עלול להיות קטן ממה שביקשנו */
function pullCards(ep, uid){
  ep = ep == null ? USER_EPOCH : ep;
  uid = uid == null ? UID : uid;
  if(!canSyncUser() || uid !== UID) return Promise.resolve(false);
  const all = [];
  const page = function(offset, n){
    return readPage('card_state?select=card_key,stability,difficulty,due,last_review,reps,lapses' +
                    '&user_id=eq.' + uid + '&order=card_key.asc&limit=' + PULL_PAGE + '&offset=' + offset)
      .then(function(rows){
        if(!Array.isArray(rows)) throw new Error('תשובה לא צפויה');
        rows.forEach(function(r){ all.push(r); });
        if(!rows.length || n >= 50) return;
        return page(offset + rows.length, n + 1);
      });
  };
  return page(0, 0).then(function(){
    if(ep !== USER_EPOCH) return false;
    mergeRemote(all);
    return true;
  });
}

function mergeRemote(rows){
  const onServer = {}, srvLast = {};
  let changed = false;
  /* מה שבשרת תחת המפתח החדש — כדי ששורה ישנה תחת המפתח הישן לא תסמן
     את הכרטיס לשליחה שוב ושוב בכל סנכרון */
  rows.forEach(function(row){
    if(!legacyTarget(row.card_key)) srvLast[row.card_key] = Date.parse(row.last_review);
  });
  rows.forEach(function(row){
    const remote = { s:+row.stability, d:+row.difficulty,
                     due:Date.parse(row.due), last:Date.parse(row.last_review),
                     reps:row.reps|0, lapses:row.lapses|0 };
    if(!validState(remote)) return;
    const mapped = legacyTarget(row.card_key);
    const key = mapped || row.card_key;
    const local = CARDS[key];
    if(mapped){
      /* שורה בשרת תחת המפתח הישן: המצב עובר למפתח החדש, ונשלח תחתיו —
         רק אם הוא חדש יותר ממה שכבר יש שם */
      if(!local || remote.last > local.last){ CARDS[key] = remote; changed = true; }
      if(!(srvLast[key] >= CARDS[key].last) && !DIRTY[key]){ DIRTY[key] = 1; changed = true; }
      return;
    }
    if(!local || remote.last > local.last){
      CARDS[key] = remote;
      delete DIRTY[key];
      changed = true;
    } else if(local.last === remote.last){
      if(DIRTY[key]){ delete DIRTY[key]; changed = true; }
    } else if(!DIRTY[key]){
      DIRTY[key] = 1; changed = true;            /* המקומי חדש יותר — יישלח */
    }
    onServer[key] = 1;
  });
  /* מה שאין בשרת בכלל — יישלח. כך מתקבלת גם כל ההיסטוריה שנצברה
     כשהשליחה נכשלה. */
  Object.keys(CARDS).forEach(function(k){
    if(!onServer[k] && !DIRTY[k] && validState(CARDS[k])){ DIRTY[k] = 1; changed = true; }
  });
  if(changed){ saveCards(); render(); }
}

function pushCards(ep, uid){
  if(!canSyncUser() || uid !== UID || ep !== USER_EPOCH) return Promise.resolve();
  const keys = Object.keys(DIRTY).filter(function(k){
    if(validState(CARDS[k]) && !legacyTarget(k) && !legacyHeld(k)) return true;
    if(!CARDS[k]) delete DIRTY[k];
    return false;
  });
  const chunk = function(i){
    if(i >= keys.length || ep !== USER_EPOCH) return Promise.resolve();
    const part = keys.slice(i, i + CARD_CHUNK), sent = {};
    const rows = part.map(function(k){
      const st = CARDS[k];
      sent[k] = st.last;
      return { user_id:uid, card_key:k, stability:st.s, difficulty:st.d,
               due:new Date(st.due).toISOString(), last_review:new Date(st.last).toISOString(),
               reps:st.reps|0, lapses:st.lapses|0 };
    });
    return rest('card_state?on_conflict=user_id,card_key', {
      method:'POST',
      headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(rows)
    }).then(function(r){
      if(!r.ok) throw new Error('card_state ' + r.status);
      if(ep !== USER_EPOCH) return;
      /* רק מה שלא השתנה בזמן הטיסה יוצא מהתור */
      part.forEach(function(k){ if(CARDS[k] && CARDS[k].last === sent[k]) delete DIRTY[k]; });
      uwrite(DIRTY_KEY, DIRTY);
      return chunk(i + CARD_CHUNK);
    });
  };
  return chunk(0);
}

function pushLogs(ep, uid){
  if(!canSyncUser() || uid !== UID || ep !== USER_EPOCH || !LOGQ.length) return Promise.resolve();
  const ready = LOGQ.filter(function(e){ return !legacyHeld(e.card_key); });
  if(!ready.length) return Promise.resolve();
  const batch = ready.slice(0, CARD_CHUNK).map(function(e){
    return { user_id:uid, client_id:e.id, card_key:legacyTarget(e.card_key) || e.card_key,
             rating:e.rating, elapsed_days:numOrNull(e.elapsed_days),
             duration_ms:clampMs(e.duration_ms), reviewed_at:e.reviewed_at };
  });
  const drop = function(){
    const ids = {};
    batch.forEach(function(b){ ids[b.client_id] = 1; });
    LOGQ = LOGQ.filter(function(e){ return !ids[e.id]; });
    uwrite(LOG_KEY, LOGQ);
  };
  return rest('review_log?on_conflict=user_id,client_id', {
    method:'POST',
    headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},
    body:JSON.stringify(batch)
  }).then(function(r){
    if(ep !== USER_EPOCH) return;
    if(r.ok){ drop(); return pushLogs(ep, uid); }
    return r.text().then(function(t){
      let code = '';
      try{ code = String(JSON.parse(t).code || ''); }catch(e){}
      /* נתון פסול (22xxx/23xxx) ייכשל לנצח ויחסום את כל השאר — נזרק.
         כל שגיאה אחרת (למשל עמודה שעוד לא קיימת לפני המיגרציה)
         משאירה את התור לניסיון הבא. */
      if(r.status === 400 && /^2[23]/.test(code)){
        logError('sync', 'review_log: נזרקה אצווה פסולה (' + code + ')', {n:batch.length});
        drop();
        return pushLogs(ep, uid);
      }
      throw new Error('review_log ' + r.status);
    });
  });
}

/* ---------- מפתחות מהתקופה של התוכן המוטמע ----------
   'fg:methyl' — לפני שהתוכן עבר למסד. אחרי ייבוא ערכת הפתיחה אותו תוכן
   חי בחבילה עם uuid, והמפתח צריך לעבור איתו, אחרת ההיסטוריה נראית
   כאילו נמחקה. המיפוי לפי סוג וכותרת, כמו בייבוא. */
let LEGACY_MAP = {}, LEGACY_PREFIXES = [], LEGACY_READY = false, LOCAL_PREFIXES = null;
/* מפתח מהתקופה של התוכן המוטמע, בלי קשר לשאלה אם יש לו חבילה ממופה */
function isLegacyKey(key){
  if(!LOCAL_PREFIXES) LOCAL_PREFIXES = localRows().map(function(r){ return r.id + ':'; });
  for(let i=0;i<LOCAL_PREFIXES.length;i++) if(key.indexOf(LOCAL_PREFIXES[i]) === 0) return true;
  return false;
}
/* מפתח ישן נשלח רק כשברור שאין לו חבילה ממופה — אחרי טעינת ספרייה
   מוצלחת. אחרת הוא היה נשלח כמו שהוא, ואחר כך שוב תחת המפתח החדש,
   והשרת היה נשאר עם שתי שורות לאותו כרטיס. */
function legacyHeld(key){ return !LEGACY_READY && isLegacyKey(key); }
function refreshLegacyMap(){
  LEGACY_MAP = {}; LEGACY_PREFIXES = [];
  if(!UID) return;
  const owned = {};
  LIB.rows.forEach(function(r){
    if(r && r.owner_id === UID && r.id) owned[r.kind + '|' + r.title] = r.id;
  });
  localRows().forEach(function(r){
    const id = owned[r.kind + '|' + (r.title || 'נושא')];
    if(id){ LEGACY_MAP[r.id + ':'] = id + ':'; LEGACY_PREFIXES.push(r.id + ':'); }
  });
}
function legacyTarget(key){
  for(let i=0;i<LEGACY_PREFIXES.length;i++){
    const p = LEGACY_PREFIXES[i];
    if(key.indexOf(p) === 0) return LEGACY_MAP[p] + key.slice(p.length);
  }
  return null;
}
function remapLegacyKeys(){
  refreshLegacyMap();
  LEGACY_READY = LIB.status === 'ok';
  if(!LEGACY_PREFIXES.length) return 0;
  let moved = 0;
  Object.keys(CARDS).forEach(function(k){
    const nk = legacyTarget(k);
    if(!nk) return;
    const st = CARDS[k];
    if(validState(st) && (!CARDS[nk] || st.last > CARDS[nk].last)){ CARDS[nk] = st; DIRTY[nk] = 1; }
    delete CARDS[k]; delete DIRTY[k];
    moved++;
  });
  LOGQ.forEach(function(e){ const nk = legacyTarget(e.card_key); if(nk){ e.card_key = nk; moved++; } });
  if(moved) saveCards();
  return moved;
}

/* ---------- הגדרות מול השרת ---------- */
function pullSettings(){
  if(!canSyncUser()) return Promise.resolve(false);
  const ep = USER_EPOCH, ver = SETTINGS_VER;
  return readJson('user_settings?select=exam_date,rounds,updated_at&user_id=eq.' + UID)
    .then(function(res){
      if(ep !== USER_EPOCH || !res.ok) return false;
      const row = res.data[0];
      if(!row){
        /* אין עדיין שורה בשרת — מה שיש כאן הוא המקור */
        if(store.examDate || store.rounds){ store.dirty = true; saveState(store); }
        return false;
      }
      const at = Date.parse(row.updated_at) || 0;
      let changed = false;
      /* שינוי מקומי שעוד לא נשלח לא נדרס; שינוי שנעשה בזמן הבקשה גם לא.
         מכשיר שמעולם לא ידע תאריך מקבל כל תאריך שבשרת. */
      const newer = at > (store.examAt || 0) || (!store.examAt && !store.examDate && !!row.exam_date);
      if(ver === SETTINGS_VER && newer && (row.exam_date || null) !== store.examDate){
        store.examDate = row.exam_date || null; store.examAt = at; changed = true;
      }
      const rounds = row.rounds || 0;
      if(rounds > store.rounds){ store.rounds = rounds; changed = true; }
      if(rounds < store.rounds && !store.dirty){ store.dirty = true; changed = true; }
      if(changed){ saveState(store); render(); }
      return changed;
    });
}

/* מסונכרן יחיד + סבב נגרר: שינוי שנעשה בזמן שליחה נשלח מיד אחריה.
   שלוש קריאות בלי שינוי ביניהן = בקשה אחת. */
let pushingSettings = null, settingsAgain = false;
function pushSettings(){
  if(!canSyncUser()) return Promise.resolve(false);
  if(pushingSettings){ settingsAgain = true; return pushingSettings; }
  const ep = USER_EPOCH, ver = SETTINGS_VER;
  /* מכשיר שמעולם לא קבע ולא למד תאריך לא שולח exam_date בכלל — upsert
     מעדכן רק את העמודות שנשלחו, כך שהוא לא יכול למחוק תאריך קיים */
  const body = { user_id: UID, rounds: store.rounds || 0,
                 updated_at: new Date(store.examAt || 0).toISOString() };
  if(store.examAt > 0) body.exam_date = store.examDate || null;
  pushingSettings = rest('user_settings?on_conflict=user_id', {
    method:'POST',
    headers:{Prefer:'resolution=merge-duplicates,return=minimal'},
    body: JSON.stringify(body)
  }).then(function(r){ return r.ok; }, function(){ return false; })
    .then(function(ok){
      pushingSettings = null;
      if(ep !== USER_EPOCH) return false;
      if(ok && ver === SETTINGS_VER){ store.dirty = false; saveState(store); }
      const again = settingsAgain && ver !== SETTINGS_VER;
      settingsAgain = false;
      return again ? pushSettings() : ok;
    });
  return pushingSettings;
}

/* קודם שולחים מה שהשתנה כאן, ואז מושכים — כך שינוי אופליין לא נבלע */
function syncSettings(){
  const first = store.dirty ? pushSettings() : Promise.resolve(true);
  return first.then(function(){ return pullSettings(); }).catch(function(){ return false; });
}

/* ===========================================================
   מתזמן — מרכיב סבב מכרטיסים שהגיע זמנם, ואז חדשים,
   ואז אלה שהכי קרובים להישכח.
   =========================================================== */
function dueCount(items, keyFn){
  const now = Date.now();
  return items.filter(function(it){
    const st = cardState(keyFn(it));
    return !st || st.due <= now;
  }).length;
}
function masteredCount(items, keyFn){
  /* "נשלט" = יציבות של שלושה שבועות ומעלה */
  return items.filter(function(it){
    const st = cardState(keyFn(it));
    return st && st.s >= 21;
  }).length;
}

function pickWeighted(items, n, keyFn){
  const now = Date.now();
  const ranked = shuffle(items).map(function(it){
    const st = cardState(keyFn(it));
    if(!st)            return {it:it, group:1, order:0};                 /* חדש */
    if(st.due <= now)  return {it:it, group:0, order:st.due};            /* הגיע זמנו */
    return {it:it, group:2, order:retrievability(st.s, (now - st.last)/DAY)};
  });
  ranked.sort(function(a,b){ return a.group - b.group || a.order - b.order; });
  return ranked.slice(0, n).map(function(x){ return x.it; });
}

/* ===========================================================
   בוני שאלות
   שאלה: {key, label, prompt, optionKind, options:[{id,main,sub,ltr,mol,sym}], answer, why}
