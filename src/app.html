/* --- חבילה 1: קבוצות פונקציונליות --- */
function fgDistractors(items, t){
  const same = shuffle(items.filter(function(g){ return g.cat===t.cat && g.id!==t.id; }));
  const other = shuffle(items.filter(function(g){ return g.cat!==t.cat; }));
  return same.concat(other).slice(0,3);
}
function fgQuestion(items, key, mode){
  const g = fgQuestion.pool.shift();
  const dir = mode==='mix' ? (Math.random()<0.5?'s2n':'n2s') : mode;
  const opts = shuffle([g].concat(fgDistractors(items, g)));
  if(dir==='s2n'){
    return { key:key(g), label:'איזו קבוצה זו?',
      prompt:{kind:'mol', mol:g},
      optionKind:'text',
      options:opts.map(function(o){ return {id:o.id, main:o.en, ltr:true, sub:o.he}; }),
      answer:g.id, why:null };
  }
  return { key:key(g), label:'איזה מבנה מתאים?',
    prompt:{kind:'text', main:g.en, ltr:true, sub:g.he},
    optionKind:'pic',
    options:opts.map(function(o){ return {id:o.id, mol:o}; }),
    answer:g.id, why:null };
}

/* --- חבילה 2: יסודות --- */
function elQuestion(items, key, mode){
  const kind = mode==='mix' ? sample(['sym','name','class','role','role2'],1)[0] : mode;
  const e = elQuestion.pool.shift();
  const BULK = items.filter(function(x){return x.cat==='bulk';});
  const TRACE = items.filter(function(x){return x.cat==='trace';});
  const ELEMENTS = items;

  if(kind==='sym'){
    const opts = shuffle([e].concat(sample(ELEMENTS.filter(function(x){return x.id!==e.id;}),3)));
    return { key:key(e), label:'איזה יסוד זה?',
      prompt:{kind:'element', sym:e.sym},
      optionKind:'text',
      options:opts.map(function(o){ return {id:o.id, main:o.en, ltr:true, sub:o.he}; }),
      answer:e.id, why:(e.cat==='bulk'?'יסוד עיקרי (bulk). ':'יסוד קורט (trace). ')+e.role };
  }
  if(kind==='name'){
    const opts = shuffle([e].concat(sample(ELEMENTS.filter(function(x){return x.id!==e.id;}),3)));
    return { key:key(e), label:'מה הסמל?',
      prompt:{kind:'text', main:e.he, sub:e.en},
      optionKind:'text',
      options:opts.map(function(o){ return {id:o.id, sym:o.sym, main:o.he}; }),
      answer:e.id, why:(e.cat==='bulk'?'יסוד עיקרי (bulk). ':'יסוד קורט (trace). ')+e.role };
  }
  if(kind==='class'){
    /* בחר את היחיד שמשתייך לקטגוריה הנגדית */
    const askTrace = e.cat==='trace';
    const target = askTrace ? e : e;
    const foils = sample((askTrace?BULK:TRACE), 3);
    const opts = shuffle([target].concat(foils));
    return { key:key(e), label:'סיווג',
      prompt:{kind:'text', main: askTrace?'מי מהבאים הוא יסוד קורט?':'מי מהבאים הוא יסוד עיקרי?',
              sub: askTrace?'trace element — נמצא בעקבות בלבד':'bulk element — מרכיב עיקרי של מסת הגוף'},
      optionKind:'text',
      options:opts.map(function(o){ return {id:o.id, sym:o.sym, main:o.he, sub:o.en}; }),
      answer:target.id, why:e.sym+' — '+e.role };
  }
  if(kind==='role'){
    const opts = shuffle([e].concat(sample(ELEMENTS.filter(function(x){return x.id!==e.id;}),3)));
    return { key:key(e), label:'איזה יסוד ממלא את התפקיד?',
      prompt:{kind:'text', main:e.role},
      optionKind:'text',
      options:opts.map(function(o){ return {id:o.id, sym:o.sym, main:o.he, sub:o.en}; }),
      answer:e.id, why:e.cat==='bulk'?'יסוד עיקרי (bulk).':'יסוד קורט (trace).' };
  }
  /* role2 — יסוד ← תפקיד */
  const opts = shuffle([e].concat(sample(ELEMENTS.filter(function(x){return x.id!==e.id;}),3)));
  return { key:key(e), label:'מה התפקיד?',
    prompt:{kind:'element', sym:e.sym, caption:e.he},
    optionKind:'text',
    options:opts.map(function(o){ return {id:o.id, main:o.role}; }),
    answer:e.id, why:e.cat==='bulk'?'יסוד עיקרי (bulk).':'יסוד קורט (trace).' };
}

/* --- חבילה 3: איזומרים --- */
function isoParentOf(iso, node){ return iso.filter(function(x){ return x.id===node.parent; })[0]; }
function isoQuestion(D, key, mode){
  const ISO = D.iso, ISO_TERMS = D.isoTerms, ISO_ALL = D.all, ISO_PAIRS = D.isoPairs;
  const kind = mode==='mix' ? sample(['def','term','tree','pair'],1)[0] : mode;

  if(kind==='pair' || (kind==='mix')){
    /* נופל לזוגות רק אם נבחר במפורש */
  }
  if(kind==='pair'){
    const p = isoQuestion.pairPool.length ? isoQuestion.pairPool.shift() : sample(ISO_PAIRS,1)[0];
    const keys = Object.keys(REL);
    const foils = sample(keys.filter(function(k){ return k!==p.rel; }),3);
    const opts = shuffle([p.rel].concat(foils));
    return { key:key(p), label:'מה היחס בין א ל-ב?',
      prompt:{kind:'pair', pair:p},
      optionKind:'text',
      options:opts.map(function(k){ return {id:k, main:REL[k]}; }),
      answer:p.rel, why:p.why };
  }
  if(kind==='tree'){
    const kids = ISO.filter(function(x){ return x.parent; });
    const node = isoQuestion.treePool.length ? isoQuestion.treePool.shift() : sample(kids,1)[0];
    const parent = isoParentOf(ISO, node);
    const foils = sample(ISO.filter(function(x){ return x.id!==parent.id && x.id!==node.id; }),3);
    const opts = shuffle([parent].concat(foils));
    return { key:key(node), label:'תחת איזו קטגוריה?',
      prompt:{kind:'text', main:node.he, sub:node.en},
      optionKind:'text',
      options:opts.map(function(o){ return {id:o.id, main:o.he, sub:o.en}; }),
      answer:parent.id, why:node.he+' — '+node.def };
  }
  const node = isoQuestion.pool.length ? isoQuestion.pool.shift() : sample(ISO_ALL,1)[0];
  const foils = sample(ISO_ALL.filter(function(x){ return x.id!==node.id; }),3);
  const opts = shuffle([node].concat(foils));
  if(kind==='def'){
    return { key:key(node), label:'איזה מונח מתאים להגדרה?',
      prompt:{kind:'text', main:node.def, sub:node.ex?('דוגמה: '+node.ex):''},
      optionKind:'text',
      options:opts.map(function(o){ return {id:o.id, main:o.he, sub:o.en}; }),
      answer:node.id, why:null };
  }
  return { key:key(node), label:'מה ההגדרה?',
    prompt:{kind:'text', main:node.he, sub:node.en},
    optionKind:'text',
    options:opts.map(function(o){ return {id:o.id, main:o.def}; }),
    answer:node.id, why:node.ex?('דוגמה: '+node.ex):null };
}

   =========================================================== */
const ROUND = 12;
/* תוויות החבילות מגיעות מ-DATA.ui.decks — ראה tools/build.mjs */
function dLbl(deck, key, fallback){

/* ===========================================================
   מנוע חבילות הנושא — כרטיס {id, front, frontSub, back, note}
   =========================================================== */
function topicQuestion(cards, key, mode, card){
  const dir  = mode==='f2b' || mode==='b2f' ? mode : (Math.random()<0.5?'f2b':'b2f');
  const foils = sample(cards.filter(function(c){ return c.id!==card.id; }), 3);
  const opts = shuffle([card].concat(foils));
  const ckey = key(card);

  if(dir==='b2f'){
    return { key:ckey, label:'לאיזה מושג זה שייך?',

    optionKind:'text',
    options:opts.map(function(o){ return {id:o.id, main:o.back}; }),
    answer:card.id, why:card.note||null };

/* ===========================================================
   תרגילים אינטראקטיביים — פריט בנושא שיש לו type. משבצים פריטים
   מבנק תשובות אל יעדים, בהקשה או בגרירה.
     sort   מיון לקבוצות. גם התאמה אחד־לאחד: קבוצה עם פריט יחיד.
            {id, type:'sort', prompt, groups:[{label, sub, items:[..]}], extra:[..], note}
     order  רצף, או מעגל כש-cycle. arrow = מה שכתוב על החץ שיוצא מהשלב
            אל הבא; במעגל החץ של האחרון חוזר לראשון. ask קובע מה ממלאים:
            steps (ברירת מחדל) · arrows · both. given משאיר שלב גלוי.
            {id, type:'order', prompt, cycle, ask, steps:[{label, sub, arrow, given}], extra, note}
   extra = מסיחים שלא שייכים לשום יעד. כל תרגיל הוא כרטיס אחד בתזמון.
   ההשוואה לפי טקסט, כך ששני חיצים שמצפים ל-NADH מקבלים כל עותק.
   =========================================================== */
const ACT_TYPES = ['sort', 'order'];
const ACT_ASK = ['steps', 'arrows', 'both'];
const CYCLE_MAX = 10;        /* מעבר לזה העיגול צפוף מדי, ומציירים רשימה */

function clean(s){ return typeof s === 'string' ? s.trim() : ''; }
function isActivity(it){ return !!it && ACT_TYPES.indexOf(it.type) > -1; }
function actName(it){ return it.type === 'sort' ? 'מיון' : it.cycle ? 'מעגל' : 'רצף'; }

/* מה מוצג ומה יש למלא. יעד = כל מה שאינו גלוי ויש לו תשובה. */
function actLayout(it){
  if(it.type === 'sort'){
    const groups = (Array.isArray(it.groups) ? it.groups : []).map(function(g, i){
      g = g || {};
      return {id:'g'+i, kind:'group', i:i, label:clean(g.label), sub:clean(g.sub),
              expect:(Array.isArray(g.items) ? g.items : []).map(clean).filter(Boolean)};
    });
    return {groups:groups, targets:groups};
  }
  const raw = Array.isArray(it.steps) ? it.steps : [];
  const ask = ACT_ASK.indexOf(it.ask) > -1 ? it.ask : 'steps';
  const anchored = raw.some(function(s){ return s && s.given; });
  const steps = raw.map(function(s, i){
    s = s || {};
    /* מעגל בלי עוגן אין לו התחלה — השלב הראשון נחשף */
    const shown = ask === 'arrows' || !!s.given || (!!it.cycle && !anchored && i === 0);
    return {id:'s'+i, kind:'step', i:i, label:clean(s.label), sub:clean(s.sub),
            expect:clean(s.label) ? [clean(s.label)] : [], given:shown};
  });
  const arrows = [];
  const count = it.cycle ? raw.length : raw.length - 1;
  for(let i=0;i<count;i++){
    const a = clean((raw[i] || {}).arrow);
    arrows.push({id:'a'+i, kind:'arrow', i:i, label:a, expect:a ? [a] : [],
                 given: ask === 'steps' || !a});
  }
  return {steps:steps, arrows:arrows,
          targets:steps.concat(arrows).filter(function(t){ return !t.given && t.expect.length; })};
}

/* תוכן מהשרת עלול להיות חלקי. תרגיל פגום יוצא מהסבב במקום להפיל אותו. */
function activityOk(it){
  if(!isActivity(it) || !clean(it.prompt)) return false;
  const L = actLayout(it);
  if(it.type === 'sort')
    return L.groups.length >= 2 && L.groups.every(function(g){ return g.label && g.expect.length; });
  return L.steps.length >= 3 && L.steps.every(function(s){ return s.label; }) && L.targets.length >= 2;
}

/* הפתרון המלא כטקסט — לעיון ולשאלת «למה» */
function solutionText(it){
  const L = actLayout(it);
  if(it.type === 'sort')
    return L.groups.map(function(g){ return g.label + ': ' + g.expect.join(', '); }).join(' · ');
  const parts = L.steps.map(function(s, i){
    const a = L.arrows[i];
    return (i+1) + '. ' + s.label + (a && a.label ? ' (' + a.label + ')' : '');
  });
  return parts.join(' ← ') + (it.cycle ? ' ← חזרה לשלב 1' : '');
}

/* אותו פתרון כשורות, לעיון. טקסט אחד ארוך שמערבב עברית ולטינית
   מתפרק בכיווניות; שורה לכל קבוצה או שלב נשארת קריאה. */
function solutionRows(it){
  const L = actLayout(it);
  if(it.type === 'sort')
    return L.groups.map(function(g){ return {head:g.label, text:g.expect.join(', ')}; });
  return L.steps.map(function(s, i){
    const a = L.arrows[i];
    return {head:s.label, text:a && a.label ? '← ' + a.label : ''};
  });
}

function activityQuestion(it, key){
  const L = actLayout(it);
  const texts = [];
  L.targets.forEach(function(t){ t.expect.forEach(function(x){ texts.push(x); }); });
  const extra = (Array.isArray(it.extra) ? it.extra : []).map(clean).filter(Boolean);
  return {
    key:key(it), act:it, layout:L,
    label: it.type === 'sort' ? 'מיון לקבוצות' : it.cycle ? 'השלמת המעגל' : 'סידור לפי הסדר',
    prompt:{kind:'text', main:clean(it.prompt),
            sub: extra.length ? 'חלק מהפריטים לא שייכים לשום מקום — השאר אותם בבנק' : ''},
    chips: shuffle(texts.concat(extra)).map(function(x, i){ return {id:'c'+i, text:x}; }),
    place:{}, sel:null,
    options:[], answer:null, why:clean(it.note) || null
  };
}

function targetOf(q, id){
  return id ? q.layout.targets.filter(function(t){ return t.id === id; })[0] || null : null;
}
function chipsIn(q, zone){
  return q.chips.filter(function(c){ return (q.place[c.id] || null) === zone; });
}

/* zone: מזהה יעד, או null לבנק. משבצת של פריט יחיד מחליפה מקום עם מי שבה. */
function placeChip(q, chipId, zone){
  const t = targetOf(q, zone);
  if(zone && !t) return;
  const from = q.place[chipId] || null;
  if(t && t.kind !== 'group'){
    chipsIn(q, zone).forEach(function(c){
      if(c.id === chipId) return;
      if(from) q.place[c.id] = from; else delete q.place[c.id];
    });
  }
  if(zone) q.place[chipId] = zone; else delete q.place[chipId];
  q.sel = null;
}
/* נגיעה בפריט שכבר יושב ביעד אחר = נגיעה ביעד עצמו. אחרת בוחרים בו. */
function tapChip(q, chipId){
  const zone = q.place[chipId] || null;
  if(q.sel && q.sel !== chipId && zone && zone !== (q.place[q.sel] || null)){
    placeChip(q, q.sel, zone);
    return;
  }
  q.sel = q.sel === chipId ? null : chipId;
}
function tapZone(q, zone){ if(q.sel) placeChip(q, q.sel, zone); }

/* נכון = היעד מצפה לטקסט הזה, או מסיח שנשאר בבנק */
function gradeActivity(q){
  const wanted = {};
  q.layout.targets.forEach(function(t){ t.expect.forEach(function(x){ wanted[x] = true; }); });
  const marks = {};
  let right = 0;
  q.chips.forEach(function(c){
    const t = targetOf(q, q.place[c.id]);
    const ok = t ? t.expect.indexOf(c.text) > -1 : !wanted[c.text];
    marks[c.id] = ok;
    if(ok) right++;
  });
  return {right:right, total:q.chips.length, marks:marks};
}

function mistakesText(q){
  if(!q.result) return '';
  const out = [];
  q.chips.forEach(function(c){
    if(q.result.marks[c.id]) return;
    const t = targetOf(q, q.place[c.id]);
    if(!t)                    out.push('"'+c.text+'" נשאר בבנק');
    else if(t.kind==='group') out.push('"'+c.text+'" שובץ ב"'+t.label+'"');
    else if(t.kind==='step')  out.push('"'+c.text+'" שובץ כשלב '+(t.i+1));
    else                      out.push('"'+c.text+'" שובץ על החץ שאחרי שלב '+(t.i+1));
  });
  return out.slice(0, 8).join(' · ');
}

/* ===========================================================
   יומן תקלות. כל כישלון שהיה נבלע בשקט נרשם — מקומית מיד, ולשרת
   כשיש חיבור. אדמין קורא את הכול, משתמש רגיל רק את שלו (RLS).
   כל רשומה נושאת את המשתמש ואת הזמן שבהם קרתה, לא את אלה של רגע
   השליחה — תקלה אופליין לא תיראה כאילו קרתה כשהרשת חזרה.
   =========================================================== */
const ERRQ_KEY = 'shinun-errq';
const ERR_APP  = ((document.querySelector('meta[name="app-build"]') || {}).content || 'dev').slice(0, 40);
const ERR_KINDS = ['client','fetch','function','promise','sync'];
let ERRQ = jread(ERRQ_KEY, []);
if(!Array.isArray(ERRQ)) ERRQ = [];
let logging = false;              /* שליחה בטיסה; קריאה נוספת רק מסמנת סבב נגרר */
let loggingAgain = false;
const recent = {};                /* דחיית כפילויות בטווח דקה */

function curScreen(){ try{ return view && view.name; }catch(e){ return null; } }

function logError(kind, message, context){
  const msg = String(message || '').slice(0, 500);
  if(!msg) return;
  if(ERR_KINDS.indexOf(kind) < 0) kind = 'client';
  const sig = kind + '|' + msg;
  const now = Date.now();
  if(recent[sig] && now - recent[sig] < 60000) return;
  recent[sig] = now;

  let ctx = Object.assign({screen: curScreen(), url: location.pathname}, context || {});
  try{ if(JSON.stringify(ctx).length > 3000) ctx = {screen: curScreen(), truncated: true}; }
  catch(e){ ctx = {screen: curScreen()}; }
  const row = {
    kind: kind,
    message: msg,
    context: ctx,
    user_agent: navigator.userAgent.slice(0, 300),
    app: ERR_APP,
    at: new Date(now).toISOString(),
    uid: UID || null              /* מקומי בלבד — לא נשלח כעמודה */
  };
  ERRQ.push(row);
  if(ERRQ.length > 100) ERRQ = ERRQ.slice(-100);   /* לא נותנים לתור לתפוח */
  jwrite(ERRQ_KEY, ERRQ);
  flushErrors();
}

function checkAdmin(){
  if(!canSyncUser()) return Promise.resolve(false);
  const ep = USER_EPOCH;
  return rest('rpc/is_admin', {method:'POST', body:'{}'})
    .then(function(r){
      return r.ok ? r.json().then(function(v){ return {ok:true, v:v}; }) : {ok:false};
    })
    .then(function(res){
      /* רק תשובה מפורשת משנה הרשאה. תקלה חולפת לא מורידה אדמין. */
      if(!res.ok || ep !== USER_EPOCH || !AUTH) return !!(AUTH && AUTH.admin);
      const was = !!AUTH.admin;
      AUTH.admin = res.v === true; authWrite(AUTH);
      if(was !== AUTH.admin) render();
      if(AUTH.admin) loadAdminBadge();
      return AUTH.admin;
    }).catch(function(){ return !!(AUTH && AUTH.admin); });
}

/* השליחה עצמה שקטה: כישלון בדיווח לא מדווח, וזה מה שמונע לולאה.
   תקלות אחרות שקורות בזמן השליחה נרשמות כרגיל ויוצאות בסבב הבא. */
function flushErrors(){
  if(logging){ loggingAgain = true; return Promise.resolve(); }
  if(!ERRQ.length || !canSyncUser()) return Promise.resolve();
  const uid = UID;
  /* רשומה של משתמש אחר מחכה לו; רשומה בלי משתמש נרשמת על הנוכחי */
  const mine = ERRQ.filter(function(r){ return r && (!r.uid || r.uid === uid); }).slice(0, 20);
  if(!mine.length) return Promise.resolve();
  logging = true;
  const body = mine.map(function(r){
    return { user_id: uid, kind: ERR_KINDS.indexOf(r.kind) > -1 ? r.kind : 'client',
             message: String(r.message || '').slice(0, 500), context: r.context || null,
             user_agent: r.user_agent ? String(r.user_agent).slice(0, 300) : null,
             app: r.app ? String(r.app).slice(0, 40) : null,
             at: r.at || new Date().toISOString() };
  });
  const drop = function(){
    ERRQ = ERRQ.filter(function(r){ return mine.indexOf(r) < 0; });
    jwrite(ERRQ_KEY, ERRQ);
  };
  return rest('error_log', {
    method:'POST', quiet:true,
    headers:{Prefer:'return=minimal'},
    body: JSON.stringify(body)
  }).then(function(r){
    /* רשומה שהשרת ידחה תמיד (אילוץ) לא תחסום את התור לנצח */
    if(r.ok || r.status === 400 || r.status === 409 || r.status === 422) drop();
  }).catch(function(){}).then(function(){
    logging = false;
    if(loggingAgain){ loggingAgain = false; return flushErrors(); }
  });
}

addEventListener('error', function(e){
  logError('client', e.message, {file:(e.filename||'').split('/').pop(), line:e.lineno});
});
addEventListener('unhandledrejection', function(e){
  const r = e.reason;
  if(r && r.quiet) return;
  logError('promise', (r && r.message) || String(r), null);
});

/* קריאת רשת שנכשלה — המקום שבו כל הבאגים של היום התחבאו */
function logFetch(where, res, extra){
  if(res && res.ok) return res;
  const status = res ? res.status : 0;
  logError('fetch', where + ' → ' + status, Object.assign({status:status}, extra||{}));
  return res;
}

/* ===========================================================
   ספריית התוכן — מקור האמת ב-Postgres, מראה מקומי לאופליין.
   "הספרייה שלי" = החבילות שאני בעלים שלהן או רשום אליהן. חבילה
   ציבורית שאושרה נראית לכל מחובר; פרטית רק לבעלים. נאכף ב-RLS.
   =========================================================== */
/* מצב הספרייה מפורש. 'unknown' אינו 'ריק' — זו ההפרדה שכל הבאגים
   של המערכת נבעו מהיעדרה. רק 'ok' הוא תשובה מחייבת.
   gen עולה בכל טעינה; תשובה ישנה שמגיעה אחרי חדשה נזרקת. */
const LIB = {
  status: 'unknown',             /* unknown · cached · ok · error */
  rows:   [],
  reason: null,
  subs:   null,                  /* מזהי המינויים מהטעינה האחרונה */
  gen:    0,
  at:     0                      /* מתי התקבלה תשובה מחייבת */
};
let pendingShare = null;         /* נושא שהגיע בקישור — נפתח אחרי הטעינה */

const REST_TIMEOUT = 30000;
/* הדף בדרך החוצה (טעינה מחדש, מעבר להתחברות). בקשות בטיסה נקטעות
   אז ב-Failed to fetch, וזה לא תקלה — הנתונים נשארים בתור ונשלחים
   בעלייה הבאה. דף שחזר מה-bfcache ממשיך כרגיל. */
let leaving = false;
addEventListener('pagehide', function(){ leaving = true; });
addEventListener('pageshow', function(){ leaving = false; });

function rest(path, init, retried){
  init = init || {};
  const quiet = !!init.quiet;
  const where = (init.method || 'GET') + ' ' + path.split('?')[0];
  let timer = null;
  return ensureToken().then(function(){
    if(!canSync()){ const e = new Error('לא מחובר'); e.quiet = true; throw e; }
    const opts = Object.assign({}, init);
    delete opts.quiet;
    /* כותרות הקורא (Prefer למשל) נשמרות; ההרשאה הטרייה גוברת על ישנה.
       פעם הכותרות הוחלפו כולן, וכל upsert הפך להוספה שנדחתה ב-409. */
    opts.headers = Object.assign({}, init.headers || {}, restHeaders());
    if(typeof AbortController === 'function' && !opts.signal){
      const ctl = new AbortController();
      opts.signal = ctl.signal;
      timer = setTimeout(function(){ ctl.abort(); }, REST_TIMEOUT);
    }
    return fetch(CFG.supabaseUrl + '/rest/v1/' + path, opts);
  }).then(function(r){
    if(timer){ clearTimeout(timer); timer = null; }
    /* 401 אחרי רענון מקדים = הטוקן באמת פסול; מנסים רענון אחד ואז נכנעים */
    if(r.status === 401 && !retried){
      if(!AUTH || !AUTH.refresh){
        if(!quiet) logError('fetch', where + ' → 401 בלי טוקן רענון', {hasAuth:!!AUTH});
        return r;
      }
      return ensureToken(true).then(function(ok){
        if(!ok){
          if(!quiet) logError('fetch', where + ' → 401 והרענון נכשל', {exp:tokenExp()});
          return r;
        }
        return rest(path, init, true);
      });
    }
    if(r.status === 401 && retried){
      if(!quiet) logError('fetch', where + ' → 401 גם אחרי רענון', {exp:tokenExp(), uid:!!(AUTH && AUTH.uid)});
      return r;
    }
    return quiet ? r : logFetch(where, r);
  }).catch(function(err){
    if(timer){ clearTimeout(timer); timer = null; }
    /* אופליין הוא מצב, לא תקלה — לא ממלאים את היומן ברעש */
    const offline = typeof navigator !== 'undefined' && navigator.onLine === false;
    if(!quiet && !(err && err.quiet) && !offline && !leaving)
      logError('fetch', where + ' → ' + (err && err.name === 'AbortError' ? 'timeout' :
               (err && err.message ? err.message : 'נכשל')), null);
    throw err;
  });
}

/* הספרייה = הנושאים שבבעלותי ∪ אלה שנרשמתי אליהם.
   שתי שאילתות מפורשות ולא embed: embed שמחזיר null היה מרוקן את
   הספרייה ומוחק את המראה המקומי. האיחוד גם מבטיח שנושא בבעלותי
   יופיע גם אם רשומת המינוי חסרה. */
const DECK_COLS = 'id,kind,title,subtitle,color,visibility,data,item_count,owner_id,created_at,updated_at';

/* כל קריאה מרוחקת מחזירה {ok, data} או {ok:false, reason}. לעולם לא
   מערך חשוף, שאי אפשר להבדיל בו בין "ריק" ל"לא הצלחתי לשאול". */
function readJson(path, init){
  return rest(path, init)
    .then(function(r){
      if(!r.ok) return {ok:false, reason:'HTTP ' + r.status, status:r.status};
      return r.json().then(function(d){ return {ok:true, data:d}; });
    })
    .catch(function(e){ return {ok:false, reason:(e && e.message) || 'שגיאת רשת'}; });
}

function fetchLibrary(){
  if(!canSync())   return Promise.resolve({ok:false, reason:'אין חיבור'});
  if(!UID || authUid() !== UID) return Promise.resolve({ok:false, reason:'זהות לא נפתרה'});
  const uid = UID;

  /* השאילתות לא תלויות זו בזו — במקביל */
  return Promise.all([
    readJson('decks?select=' + DECK_COLS + '&owner_id=eq.' + uid + '&order=created_at.asc'),
    fetchSubs()
  ]).then(function(r){
    const mine = r[0], subs = r[1];
    if(!mine.ok) return mine;
    if(!subs.ok) return subs;
    if(!Array.isArray(mine.data)) return {ok:false, reason:'תשובה לא צפויה'};
    const own = {};
    mine.data.forEach(function(d){ if(d && d.id) own[d.id] = 1; });
    const others = subs.data.filter(function(id){ return !own[id]; });
    if(!others.length) return {ok:true, data:mine.data, subs:subs.data};
    return readJson('decks?select=' + DECK_COLS + '&id=in.(' + others.join(',') + ')&order=created_at.asc')
      .then(function(sub){
        if(!sub.ok) return sub;
        const byId = {};
        mine.data.concat(sub.data).forEach(function(d){ if(d && d.id) byId[d.id] = d; });
        return {ok:true, data:Object.keys(byId).map(function(k){ return byId[k]; }), subs:subs.data};
      });
  });
}

/* המאגר הציבורי — רק מה שאושר. לפני מיגרציה 0006 אין עמודת אישור,
   ואז כל ציבורית נחשבת מאושרת (כך זה עבד עד עכשיו). */
function fetchStore(){
  if(!canSyncUser()) return Promise.resolve({ok:false, reason:'אין חיבור'});
  const base = 'decks?select=id,kind,title,subtitle,item_count,owner_id,visibility,updated_at';
  return readJson(base + ',review_status&visibility=eq.public&review_status=eq.approved&order=updated_at.desc',
                  {quiet:true})
    .then(function(res){
      if(res.ok || res.status !== 400) return res;
      return readJson(base + '&visibility=eq.public&order=updated_at.desc');
    });
}
function fetchMine(){
  if(!canSyncUser()) return Promise.resolve({ok:false, reason:'אין חיבור'});
  return readJson('decks?select=id,kind,title,subtitle,item_count,owner_id,visibility,created_at,updated_at'
                  + '&owner_id=eq.' + UID + '&order=created_at.asc');
}
function fetchSubs(){
  if(!canSync() || !UID) return Promise.resolve({ok:false, reason:'אין חיבור'});
  /* סינון מפורש ולא רק RLS — מדיניות רחבה יותר (אדמין) לא תזרים לכאן
     מינויים של אחרים */
  return readJson('deck_subscriptions?select=deck_id&user_id=eq.' + UID).then(function(res){
    if(!res.ok) return res;
    if(!Array.isArray(res.data)) return {ok:false, reason:'תשובה לא צפויה'};
    return {ok:true, data:res.data.map(function(x){ return x.deck_id; })};
  });
}
/* מצב האישור של הנושאים שלי. לפני המיגרציה פשוט אין — ולא מציגים */
function fetchReviewStatus(){
  if(!canSyncUser()) return Promise.resolve({});
  return readJson('decks?select=id,review_status,review_note&owner_id=eq.' + UID, {quiet:true})
    .then(function(res){
      const out = {};
      if(res.ok) res.data.forEach(function(d){ out[d.id] = d; });
      return out;
    });
}

/* פעולה שנכשלה זורקת, עם ההודעה מהשרת. PATCH או DELETE שה-RLS סינן
   מחזירים 2xx בלי שורות — גם זה כישלון, לא הצלחה. */
function mustOk(r, expectRows){
  if(!r.ok) return r.text().then(function(t){
    let m = t;
    try{ const j = JSON.parse(t); m = j.message || j.hint || t; }catch(e){}
    throw new Error(String(m || ('HTTP ' + r.status)).slice(0, 200));
  });
  if(!expectRows) return r;
  return r.json().then(function(rows){
    if(!Array.isArray(rows) || !rows.length) throw new Error('אין הרשאה, או שהפריט כבר לא קיים');
    return rows;
  });
}

function subscribe(deckId){
  return rest('deck_subscriptions', {
    method:'POST',
    headers:{Prefer:'resolution=ignore-duplicates,return=minimal'},
    body: JSON.stringify({user_id:UID, deck_id:deckId})
  }).then(function(r){ return mustOk(r); });
}
function unsubscribe(deckId){
  return rest('deck_subscriptions?deck_id=eq.' + deckId + '&user_id=eq.' + UID, {method:'DELETE'})
    .then(function(r){ return mustOk(r); });
}
function deleteDeck(deckId){
  return rest('decks?id=eq.' + deckId, {method:'DELETE', headers:{Prefer:'return=representation'}})
    .then(function(r){ return mustOk(r, true); });
}

/* כפילות = אותו סוג ואותה כותרת בבעלות אותו משתמש. שומרים את הראשון
   שנוצר, כי אליו הועברה היסטוריית התזמון. */
function duplicateDecks(mine){
  const byKey = {}, dups = [];
  mine.slice().sort(function(a,b){
    return (a.created_at||'').localeCompare(b.created_at||'') || a.id.localeCompare(b.id);
  }).forEach(function(d){
    const k = d.kind + '|' + d.title;
    if(byKey[k]) dups.push(d); else byKey[k] = d;
  });
  return dups;
}

/* פרסום אצל משתמש רגיל = בקשת אישור; השרת קובע את מצב האישור בעצמו */
function setVisibility(deckId, vis){
  return rest('decks?id=eq.' + deckId, {
    method:'PATCH',
    headers:{Prefer:'return=representation'},
    body: JSON.stringify({visibility:vis})
  }).then(function(r){ return mustOk(r, true); });
}

/* ייבוא ערכת הפתיחה — פעולה מפורשת בלבד. זריעה אוטומטית הייתה יוצרת
   לכל משתמש חדש עותק של תוכן שלא ביקש, וזה נראה כאילו הוא רואה חבילות
   של מישהו אחר. */
/* PostgREST דורש ערכת מפתחות זהה בכל אובייקט בהוספה מרובה, ו-stringify
   משמיט מפתחות שערכם undefined. לכן כל שדה נכתב במפורש עם null כברירת מחדל.
   מופרד לפונקציה כדי שהבדיקה תוכל לאמת את המטען האמיתי. */
const DECK_FIELDS = ['owner_id','kind','title','subtitle','color','visibility','data','item_count'];

function starterRows(uid){
  return localRows().map(function(r){
    const count = r.kind==='iso'
      ? ((r.data.iso||[]).length + (r.data.isoTerms||[]).length)
      : (Array.isArray(r.data) ? r.data.length : 0);
    return {
      owner_id:   uid,
      kind:       r.kind,
      title:      r.title || 'נושא',
      subtitle:   r.subtitle || null,
      color:      r.color || null,
      visibility: 'private',
      data:       r.data,
      item_count: count,
      _oldPrefix: r.id + ':'
    };
  });
}
function starterPayload(rows){
  return rows.map(function(r){
    const o = {};
    DECK_FIELDS.forEach(function(k){ o[k] = r[k] === undefined ? null : r[k]; });
    return o;
  });
}

function importStarter(){
  if(!canSync()) return Promise.resolve({ok:false, error:'אין חיבור לשרת.'});

  /* מפגש שנוצר לפני שהוספנו uid — משלימים אותו לפני שמנסים לכתוב */
  const ready = (AUTH.uid && UID) ? Promise.resolve() : loadIdentity();

  return ready.then(function(){
    if(!AUTH || !AUTH.uid || !canSyncUser()) return {ok:false, error:'לא הצלחתי לזהות את המשתמש. התחבר מחדש.'};

    return fetchMine().then(function(existing){
    /* בלי רשימה אמינה של מה שכבר קיים אי אפשר לדעת מה חסר */
    if(!existing.ok) return {ok:false, error:'לא הצלחתי לבדוק מה כבר קיים (' + existing.reason + ').'};
    /* דילוג על מה שכבר בבעלותי — לחיצה נוספת לא תיצור כפילות */
    const have = {};
    existing.data.forEach(function(d){ have[d.kind + '|' + d.title] = true; });
    const rows = starterRows(UID).filter(function(r){ return !have[r.kind + '|' + r.title]; });
    if(!rows.length) return {ok:true, count:0, note:'הכול כבר קיים אצלך.'};
    const payload = starterPayload(rows);

    return rest('decks', {
      method:'POST',
      headers:{Prefer:'return=representation'},
      body: JSON.stringify(payload)
    }).then(function(r){
      if(!r.ok) return r.text().then(function(t){
        let msg = t;
        try{ msg = JSON.parse(t).message || t; }catch(e){}
        /* אינדקס הייחודיות חסם הוספה כפולה — לא כישלון, פשוט כבר קיים */
        if(String(msg).indexOf('decks_owner_kind_title_uniq') > -1)
          return {ok:true, count:0, note:'הכול כבר קיים אצלך.'};
        return {ok:false, error:'השרת דחה: ' + String(msg).slice(0,160)};
      });
      return r.json().then(function(created){
        if(!created || !created.length) return {ok:false, error:'לא נוצרו נושאים.'};
        const failed = [];
        return Promise.all(created.map(function(d){
          /* התאמה לפי סוג וכותרת ולא לפי מיקום — סדר ההחזרה אינו מובטח */
          const src = rows.filter(function(x){ return x.kind===d.kind && x.title===d.title; })[0];
          return subscribe(d.id).catch(function(e){ failed.push(d.title + ': ' + e.message); })
            .then(function(){
              if(!src) return null;
              /* היסטוריה שכבר בשרת תחת המפתח הישן. המקומית עוברת
                 ב-remapLegacyKeys אחרי שהספרייה נטענת. */
              return rest('rpc/remap_card_keys', {
                method:'POST',
                body: JSON.stringify({old_prefix: src._oldPrefix, deck: d.id})
              }).catch(function(){});
            });
        })).then(function(){
          return syncLibrary().then(function(){ return syncCards(true); });
        }).then(function(){
          return failed.length
            ? {ok:true, count:created.length, note:'חלק מהמינויים נכשלו: ' + failed.join(' · ')}
            : {ok:true, count:created.length};
        });
      });
    });
    });
  }).catch(function(err){
    const msg = (err && err.message) ? err.message : 'שגיאה לא ידועה';
    logError('function', 'importStarter → ' + msg, null);
    return {ok:false, error:'נכשל: ' + msg};
  });
}

/* כל פעולה שמשנה תוכן מסתיימת בסנכרון. בלי זה כל שינוי דורש
   מהמשתמש לרענן ידנית, וזה בדיוק מה שלא אמור לקרות. */
/* סנכרון שכבר רץ התחיל לפני השינוי, ותשובתו עלולה לא לכלול אותו.
   לכן קריאה בזמן ריצה לא מצטרפת אליו אלא נרשמת לסבב נוסף אחריו —
   אחד בלבד, שמשרת את כל מי שביקש בינתיים. כל טעינה של הספרייה עוברת
   כאן; קריאה ישירה ל-loadLibrary הייתה עוקפת את התיאום. */
let syncing = null, syncQueued = null;
function syncLibrary(){
  if(syncing){
    if(!syncQueued){
      const next = function(){ syncQueued = null; return syncLibrary(); };
      syncQueued = syncing.then(next, next);
    }
    return syncQueued;
  }
  const done = function(){ syncing = null; };
  syncing = loadLibrary().then(
    function(res){ done(); return res; },
    function(err){ done(); throw err; });
  return syncing;
}

function mutate(work){
  return Promise.resolve()
    .then(work)
    .then(function(out){ return syncLibrary().then(function(){ return out; }); });
}

function sameRows(a, b){
  try{ return JSON.stringify(a) === JSON.stringify(b); }catch(e){ return false; }
}

function loadLibrary(){
  const gen = ++LIB.gen, ep = USER_EPOCH;
  return fetchLibrary().then(function(res){
    /* תשובה שהגיעה אחרי טעינה חדשה יותר, או אחרי החלפת משתמש — נזרקת */
    if(gen !== LIB.gen || ep !== USER_EPOCH) return res;
    const before = LIB.status + '|' + LIB.reason;
    let changed = false;
    if(res.ok){
      changed = !sameRows(LIB.rows, res.data);
      LIB.status = 'ok'; LIB.rows = res.data; LIB.reason = null;
      LIB.subs = res.subs || []; LIB.at = Date.now();
      /* מראה שלא נשמר עדיף שיימחק מאשר שיוצג בעתיד כמצב האחרון */
      if(!uwrite(ROWS_KEY, LIB.rows) && UID !== null) jremove(ukey(ROWS_KEY));
      remapLegacyKeys();
    } else {
      /* נשארים עם מה שיש — מטמון או ריק — ומסמנים למה */
      LIB.status = LIB.rows.length ? 'cached' : 'error';
      LIB.reason = res.reason;
    }
    /* ציור מחדש רק כשמשהו השתנה — ציור מיותר מפיל פוקוס משדה חיפוש */
    if(changed) applyRows();
    else if(before !== LIB.status + '|' + LIB.reason) render();
    return res;
  });
}
function applyRows(){
  DECKS = buildDecks(LIB.rows);
  render();
}

/* ===========================================================
   בניית חבילות מרשומות תוכן. כל חבילה נושאת את הפריטים שלה,
   כך שאותו מנוע שאלות משרת גם תוכן מקומי וגם תוכן מהשרת.
   רשומה: {id, kind, title, subtitle, color, visibility, data, owner}
   =========================================================== */
const TOPIC_COLORS = ['var(--c-n)','var(--c-o)','var(--c-p)','var(--c-s)','var(--c-x)'];

/* פריט בלי מזהה תקין, או בלי השדות שהמנוע שלו צריך, היה מפיל את מסך
   הבית בכל פתיחה — ואיתו את הדרך היחידה לתקן. מסננים אותו כאן. */
function okId(x){ return isObj(x) && (typeof x.id === 'string' ? x.id.length > 0 : isFinite(x.id)); }
function cleanItems(arr, extra){
  return (Array.isArray(arr) ? arr : []).filter(function(x){ return okId(x) && (!extra || extra(x)); });
}
function makeDeck(row, idx){
  const key = function(x){ return row.id + ':' + x.id; };

  if(row.kind === 'groups'){
    const items = cleanItems(row.data, function(g){
      return Array.isArray(g.a) && Array.isArray(g.b) && g.a.every(function(at){ return isObj(at) && typeof at.t === 'string'; });
    });
    return { id:row.id, row:row, title:row.title, sub:row.subtitle||'', color:safeColor(row.color, 'var(--c-o)'),
      items:items, keyFn:key,
      browse:function(g){ return {mol:g, title:g.en, ltr:true, sub:g.he,
                                  tag:(CATS[g.cat]||{}).he, tagColor:(CATS[g.cat]||{}).color}; },
      modes:dModes('fg', [{id:'s2n',glyph:'R–'},{id:'n2s',glyph:'Aa'},{id:'mix',glyph:'⇄'}]),
      legend:Object.keys(CATS).map(function(k){ return {color:CATS[k].color, he:CATS[k].he}; }),
      build:function(mode, n){
        fgQuestion.pool = pickWeighted(items, n || ROUND, key);
        const count = fgQuestion.pool.length;      /* shift מקצר את המאגר תוך כדי */
        const out=[]; for(let i=0;i<count;i++) out.push(fgQuestion(items, key, mode));
        return out;
      } };
  }

  if(row.kind === 'elements'){
    const items = cleanItems(row.data, function(e){ return typeof e.sym === 'string'; });
    return { id:row.id, row:row, title:row.title, sub:row.subtitle||'', color:safeColor(row.color, 'var(--c-n)'),
      items:items, keyFn:key,
      browse:function(e){ return {sym:e.sym, title:e.he, sub:e.en, body:e.role,
                                  tag:e.cat==='bulk'?'עיקרי':'קורט',
                                  tagColor:e.cat==='bulk'?'var(--c-n)':'var(--c-s)'}; },
      modes:dModes('el', [{id:'sym',glyph:'Fe'},{id:'name',glyph:'שם'},{id:'class',glyph:'⊞'},{id:'mix',glyph:'⇄'}]),
      legend:dLegend('el', {bulk:'var(--c-n)', trace:'var(--c-s)'}),
      build:function(mode, n){
        elQuestion.pool = pickWeighted(items, n || ROUND, key);
        const count = elQuestion.pool.length;
        const out=[]; for(let i=0;i<count;i++) out.push(elQuestion(items, key, mode));
        return out;
      } };
  }

  if(row.kind === 'iso'){
    const src = isObj(row.data) ? row.data : {};
    const D = {iso:cleanItems(src.iso), isoTerms:cleanItems(src.isoTerms), isoPairs:cleanItems(src.isoPairs)};
    D.all = D.iso.concat(D.isoTerms);
    return { id:row.id, row:row, title:row.title, sub:row.subtitle||'', color:safeColor(row.color, 'var(--c-p)'),
      items:D.all, keyFn:key, map:D.iso.length ? D : null,
      browse:function(n){
        const parent = n.parent ? (D.iso.filter(function(x){return x.id===n.parent;})[0]||{}).he : '';
        return {title:n.he, sub:n.en, body:n.def, note:n.ex, tag:parent, tagColor:n.color};
      },
      modes:dModes('iso', [{id:'def',glyph:'?'},{id:'term',glyph:'≡'},{id:'tree',glyph:'⌂'},
                           {id:'pair',glyph:'A|B'},{id:'mix',glyph:'⇄'}]),
      legend:dLegend('iso', {structural:'var(--c-o)', stereo:'var(--c-n)',
                             config:'var(--c-p)', sub:'var(--c-s)'}),
      build:function(mode, n){
        n = n || ROUND;
        isoQuestion.pool     = pickWeighted(D.all, n, key);
        isoQuestion.treePool = pickWeighted(D.iso.filter(function(x){return x.parent;}), n, key);
        isoQuestion.pairPool = pickWeighted(D.isoPairs, D.isoPairs.length, key);
        const count = mode==='pair' ? Math.min(n, D.isoPairs.length) : n;
        const out=[]; for(let i=0;i<count;i++) out.push(isoQuestion(D, key, mode));
        return out;
      } };
  }

  /* topic — המנוע הגנרי. כרטיסים ותרגילים חיים באותו מערך. כרטיסים
     נכנסים לסבב רק מארבעה ומעלה, כי צריך שלושה מסיחים; תרגיל עומד לבד. */
  const all   = Array.isArray(row.data) ? row.data : ((isObj(row.data) && row.data.cards) || []);
  const acts  = all.filter(function(c){ return okId(c) && activityOk(c); });
  const found = all.filter(function(c){ return okId(c) && !c.type; });
  const cards = found.length >= 4 ? found : [];
  /* צבע ברירת מחדל לפי המזהה ולא לפי המיקום — אחרת הצבעים מתחלפים
     כשהסדר משתנה */
  const color = safeColor(row.color,
    TOPIC_COLORS[parseInt(hashStr(String(row.id)), 36) % TOPIC_COLORS.length]);
  const modes = [];
  if(cards.length) modes.push(
    {id:'f2b', glyph:'→', title:'מושג ← הסבר', desc:'רואה מושג, בוחר את ההסבר'},
    {id:'b2f', glyph:'←', title:'הסבר ← מושג', desc:'רואה הסבר, בוחר את המושג'});
  if(acts.length) modes.push(
    {id:'drill', glyph:'⊞', title:'תרגול אינטראקטיבי',
     desc: acts.length + ' תרגילי ' + acts.map(actName).filter(function(x, i, a){
       return a.indexOf(x) === i; }).join(', ') + ' מבנק תשובות'});
  if(cards.length) modes.push(
    {id:'mix', glyph:'⇄', title:'מעורב',
     desc: acts.length ? 'כרטיסים ותרגילים יחד' : 'שני הכיוונים באקראי'});
  const poolFor = function(mode){
    if(mode === 'f2b' || mode === 'b2f') return cards;
    if(mode === 'drill') return acts;
    return cards.concat(acts);
  };
  const counts = [cards.length && cards.length + ' כרטיסים', acts.length && acts.length + ' תרגילים'];
  return { id:row.id, row:row, title:row.title,
    sub:row.subtitle || counts.filter(Boolean).join(' · '),
    color:color, items:cards.concat(acts), keyFn:key, min:1, poolFor:poolFor,
    browse:function(c){
      if(isActivity(c)) return {title:c.prompt, rows:solutionRows(c), ordered:c.type === 'order',
                                note:c.note, tag:actName(c), tagColor:'var(--accent)'};
      return {title:c.front, sub:c.frontSub, body:c.back, note:c.note};
    },
    modes:modes,
    legend:[{color:color, he:row.title}],
    build:function(mode, n){
      const pool = poolFor(mode);
      return pickWeighted(pool, Math.min(n || ROUND, pool.length), key).map(function(it){
        return isActivity(it) ? activityQuestion(it, key) : topicQuestion(cards, key, mode, it);
      });
    } };
}

/* חבילה צריכה ארבעה פריטים לפחות כדי לייצר ארבע אפשרויות. נושא מסנן
   בעצמו ומסמן min:1, כי תרגיל אחד כבר מספיק לסבב. */
/* שורה פגומה מדולגת ונרשמת, ולא מפילה את כל הספרייה */
const badRows = {};
function buildDecks(rows){
  const out = [];
  (Array.isArray(rows) ? rows : []).forEach(function(r, i){
    if(!isObj(r) || !r.id) return;
    try{
      const d = makeDeck(r, i);
      if(d.items && d.modes.length && d.items.length >= (d.min || 4)) out.push(d);
    }catch(e){
      if(!badRows[r.id]){
        badRows[r.id] = 1;
        logError('client', 'חבילה פגומה דולגה: ' + ((e && e.message) || e), {deck:String(r.id).slice(0,40)});
      }
    }
  });
  return out;
}

/* מקור התוכן. בשלב זה עדיין מהחבילה המוטמעת; ההחלפה למסד תבוא בנפרד. */
function localRows(){
  const rows = [
    {id:'fg',  kind:'groups',   title:dLbl('fg','title','קבוצות פונקציונליות'),
     subtitle:dLbl('fg','sub',''), color:'var(--c-o)', data:DATA.groups},
    {id:'el',  kind:'elements', title:dLbl('el','title','יסודות'),
     subtitle:dLbl('el','sub',''), color:'var(--c-n)', data:DATA.elements},
    {id:'iso', kind:'iso',      title:dLbl('iso','title','איזומרים'),
     subtitle:dLbl('iso','sub',''), color:'var(--c-p)',
     data:{iso:DATA.iso, isoTerms:DATA.isoTerms, isoPairs:DATA.isoPairs}},
  ];
  (DATA.topics || []).forEach(function(t){
    rows.push({id:'tp:'+t.id, kind:'topic', title:t.title, subtitle:t.sub,
               color:t.color, data:t.cards});
  });
  return rows;
}

let DECKS = buildDecks(LIB.rows);

function deckById(id){ return DECKS.filter(function(d){return d.id===id;})[0]; }

/* ===========================================================
   מצב מסך
   =========================================================== */
let view = {name:'home'};
let quiz = null;
const app = document.getElementById('app');

function startQuiz(deckId, mode){
  const deck = deckById(deckId);
  /* החבילה נעלמה בסנכרון ברקע (נמחקה, הוסתרה, בוטל מינוי) */
  if(!deck){ quiz = null; view = {name:'home'}; render(); return; }
  const qs = deck.build(mode);
  quiz = {deck:deck, mode:mode, qs:qs, i:0, correct:0, misses:[]};
  view = {name:'quiz'};
  render();
}
/* סבב מאוחד — מושך את מה שהגיע זמנו מכל החבילות, בחלוקה יחסית.
   זו נקודת הפתיחה הטבעית לאפליקציית חזרה מרווחת. */
const ALL_DECK = {id:'all', title:'חזרה כללית', modes:[]};
function defaultMode(d){
  const ids = d.modes.map(function(m){ return m.id; });
  return ids.indexOf('mix') > -1 ? 'mix' : ids[0];
}
function startMixed(){
  const shares = DECKS.map(function(d){
    return {d:d, due:dueCount(d.items, d.keyFn)};
  }).filter(function(x){ return x.due > 0; });
  const pool = shares.length ? shares
    : DECKS.map(function(d){ return {d:d, due:d.items.length}; });

  const total = pool.reduce(function(a,x){ return a + x.due; }, 0) || 1;
  let left = ROUND, qs = [];
  pool.forEach(function(x, i){
    const n = i === pool.length - 1
      ? left
      : Math.max(1, Math.min(left - (pool.length - 1 - i), Math.round(ROUND * x.due / total)));
    if(n <= 0) return;
    left -= n;
    qs = qs.concat(x.d.build(defaultMode(x.d), n));
  });

  quiz = {deck:ALL_DECK, mode:'mixed', qs:shuffle(qs).slice(0, ROUND), i:0, correct:0, misses:[]};
  view = {name:'quiz'};
  render();
}

function answer(optId){
  const q = quiz.qs[quiz.i];
  if(q.answered) return;
  q.answered = optId;
  const ok = optId===q.answer;
  if(ok) quiz.correct++; else quiz.misses.push(q);

  const ms    = q.shownAt ? Date.now() - q.shownAt : 0;
  scheduleReview(q, gradeOf(ok, ms), ms);

  render();
  if(ok) setTimeout(function(){ if(quiz && quiz.qs[quiz.i]===q) next(); }, 850);
}
/* תרגיל שיבוץ: אין מעבר אוטומטי, כי התיקונים על הלוח הם חלק מהלמידה */
function submitActivity(){
  const q = quiz.qs[quiz.i];
  if(q.answered || !q.act) return;
  q.result = gradeActivity(q);
  q.answered = true; q.sel = null;
  const ok = q.result.right === q.result.total;
  if(ok) quiz.correct++; else quiz.misses.push(q);

  const ms = q.shownAt ? Date.now() - q.shownAt : 0;
  scheduleReview(q, gradeOfSet(q.result.right, q.result.total, ms), ms);
  renderNow();
}
function scheduleReview(q, grade, ms){
  const prev  = cardState(q.key);
  /* מונוטוני מול המצב הקודם: אם הוא נחתם בשעון שמקדים (מכשיר אחר), חזרה
     "מוקדמת" ממנו הייתה נדחית בשרת כישנה, ונדרסת במשיכה הבאה */
  const now   = Math.max(Date.now(), prev ? prev.last + 1 : 0);
  const elapsedDays = prev ? Math.max(0, now - prev.last) / DAY : null;
  const st    = reviewCard(prev, grade, now);
  q.interval  = Math.round((st.due - Date.now()) / DAY);
  recordReview(q.key, st, grade, elapsedDays, ms);
}
function next(){
  if(quiz.i < quiz.qs.length-1){ quiz.i++; }
  else{
    bumpRounds();
    pushSettings();
    quiz.done = true;
  }
  render();
}

function openExamSheet(){

function promptHTML(p){
  if(p.kind==='mol') return molSVG(p.mol,{alt:'מבנה לזיהוי'});
  if(p.kind==='element')
    return '<div class="el-tile"><b>'+esc(p.sym)+'</b>'+(p.caption?'<span>'+esc(p.caption)+'</span>':'')+'</div>';
  if(p.kind==='pair'){
    return '<div class="pair">'+
      '<div><span class="tag">א</span>'+molSVG(p.pair.A,{alt:'מבנה א'})+'</div>'+
      '<div class="sep"></div>'+
      '<div><span class="tag">ב</span>'+molSVG(p.pair.B,{alt:'מבנה ב'})+'</div>'+
    '</div>';
  }
  return '<div class="q-text"><b'+(p.ltr?' class="ltr"':'')+'>'+esc(p.main)+'</b>'+
    (p.sub?'<span>'+esc(p.sub)+'</span>':'')+'</div>';
}

/* טקסט לשאלת ההסבר. באפשרויות מסוג תמונה אין main בכלל, ולכן
   התשובה יצאה ריקה והשרת החזיר 400 — זה מה ששבר את כפתור «למה». */
function explainText(q, correct, chosen){
  const label = function(o){
    if(!o) return '';
    return ((o.main || '') + (o.sub ? ' — ' + o.sub : '')).trim();
  };
  const prompt = ((q.prompt.main || '') + (q.prompt.sub ? ' — ' + q.prompt.sub : '')).trim();

  if(q.act){
    return {
      question: (q.label || 'תרגיל') + ' — ' + (q.prompt.main || ''),
      answer:   solutionText(q.act),
      chosen:   mistakesText(q)
    };
  }
  if(q.optionKind === 'pic'){
    /* התשובה היא המבנה, ומה שמזהה אותו הוא הניסוח שבשאלה */
    return {
      question: (q.label || 'איזה מבנה מתאים?') + (prompt ? ' — ' + prompt : ''),
      answer:   prompt || q.label || 'המבנה הנכון',
      chosen:   'מבנה אחר מבין האפשרויות'
    };
  }
  return {
    question: prompt || q.label || 'שאלה',
    answer:   label(correct) || q.label || 'תשובה',
    chosen:   label(chosen)
  };
}

/* ===========================================================
   לוח השיבוץ. כל שינוי מצייר מחדש את כל המסך — ה-DOM זעיר, והמיקום
   בגלילה נשמר כי זו אותה שאלה (ראה paint).
   =========================================================== */
/* "α-קטוגלוטרט" נשבר אחרי המקף, ובכיוון ימין־לשמאל השורה הראשונה
   נראית "-α". מילה עם מקף נשארת שלמה. */
function unbroken(s){
  return esc(s).split(' ').map(function(w){
    return w.indexOf('-') > -1 ? '<span class="nb">'+w+'</span>' : w;
  }).join(' ');
}
function chipHTML(q, c){
  let cls = 'chip-a';
  /* מה שנשאר בבנק לא שובץ לא נכון — הוא פשוט חסר, והמקום שלו מסומן ביעד */
  if(q.answered) cls += q.result.marks[c.id] ? ' ok' : q.place[c.id] ? ' bad' : ' miss';
  else if(q.sel === c.id) cls += ' sel';
  return '<button class="'+cls+'" data-chip="'+esc(c.id)+'"'+
    (q.answered ? ' disabled' : ' draggable="true" aria-pressed="'+(q.sel === c.id)+'"')+'>'+
    unbroken(c.text)+'</button>';
}
/* יעד אפשרי מסומן כשיש פריט ביד, חוץ מהמקום שממנו הוא בא */
function canCls(q, zone){
  return q.sel && !q.answered && (q.place[q.sel] || null) !== zone ? ' can' : '';
}
function slotHTML(q, t, name){
  const inside = chipsIn(q, t.id)[0];
  const wrong = q.answered && (!inside || !q.result.marks[inside.id]);
  return '<div class="slot'+canCls(q, t.id)+'" data-zone="'+esc(t.id)+'">'+
      (inside ? chipHTML(q, inside)
              : '<button class="hole" data-zone="'+esc(t.id)+'" aria-label="'+esc(name)+' — ריק"'+
                  (q.answered ? ' disabled' : '')+'></button>')+
    '</div>'+
    (wrong ? '<span class="fix">'+unbroken(t.expect[0])+'</span>' : '');
}
function stepCell(q, s){
  if(s.given) return '<div class="given">'+unbroken(s.label)+'</div>';
  return slotHTML(q, targetOf(q, s.id), 'שלב '+(s.i+1));
}
function arrowCell(q, a){
  if(!a.given) return slotHTML(q, targetOf(q, a.id), 'חץ '+(a.i+1));
  return a.label ? esc(a.label) : '';
}

function bankHTML(q){
  const left = chipsIn(q, null);
  return '<div class="bank'+(left.length ? '' : ' empty')+(q.answered ? ' done' : '')+canCls(q, null)+'" data-zone="bank">'+
    '<div class="zone-hd">'+(q.answered
      ? (left.length ? 'נשארו בבנק' : 'הבנק ריק')
      : 'בנק תשובות · הקש על פריט ואז על המקום שלו, או גרור')+'</div>'+
    '<div class="chips-a">'+left.map(function(c){ return chipHTML(q, c); }).join('')+'</div>'+
  '</div>';
}

function groupsHTML(q){
  return '<div class="groups">'+q.layout.groups.map(function(g){
    const inside = chipsIn(q, g.id);
    let missing = '';
    if(q.answered){
      const have = inside.map(function(c){ return c.text; });
      missing = g.expect.filter(function(x){ return have.indexOf(x) < 0; }).map(function(x){
        return '<span class="chip-a ghost">'+unbroken(x)+'</span>';
      }).join('');
    }
    return '<div class="grp'+canCls(q, g.id)+'" data-zone="'+esc(g.id)+'">'+
      '<button class="grp-hd" data-zone="'+esc(g.id)+'"'+(q.answered ? ' disabled' : '')+'>'+
        unbroken(g.label)+(g.sub ? '<small>'+esc(g.sub)+'</small>' : '')+'</button>'+
      '<div class="chips-a">'+inside.map(function(c){ return chipHTML(q, c); }).join('')+missing+'</div>'+
    '</div>';
  }).join('')+'</div>';
}

function seqHTML(q){
  const L = q.layout, last = L.steps.length - 1;
  return '<ol class="seq">'+L.steps.map(function(s, i){
    const a = L.arrows[i];
    return '<li class="st"><span class="num">'+(i+1)+'</span><div class="cell">'+stepCell(q, s)+'</div></li>'+
      (a ? '<li class="ar"><span class="ar-glyph">'+(i === last ? '↺' : '↓')+'</span>'+
             '<div class="cell">'+arrowCell(q, a)+(i === last ? ' · חזרה לשלב 1' : '')+'</div></li>'
         : '');
  }).join('')+'</ol>';
}

/* ---------- מעגל ----------
   הצמתים על אליפסה גבוהה, ביחידות שבהן 100 = רוחב המכל. המרווח ביניהם
   שווה לא בזווית ולא באורך קשת, אלא בגודל התיבה: תזוזה אופקית נמדדת
   ברוחב צומת ואנכית בגובהו. כך גם צמד שכנים בקודקוד העליון — שם הם
   זה לצד זה — משאיר מקום לחץ. */
const CYC = {h:125, rx:37, ry:51, hw:14, hh:8};

function cycleGeometry(n){
  const N = 720, cy = CYC.h / 2, pts = [], cum = [0];
  for(let k=0;k<=N;k++){
    const t = -Math.PI/2 + 2*Math.PI*k/N;
    pts.push({x:50 + CYC.rx*Math.cos(t), y:cy + CYC.ry*Math.sin(t)});
    if(k) cum.push(cum[k-1] + Math.hypot((pts[k].x - pts[k-1].x) / CYC.hw,
                                         (pts[k].y - pts[k-1].y) / CYC.hh));
  }
  const at = [];
  for(let i=0, k=0;i<n;i++){
    while(k < N && cum[k] < cum[N] * i / n) k++;
    at.push(k);
  }
  const inBox = function(p, c){
    return Math.abs(p.x - c.x) < CYC.hw && Math.abs(p.y - c.y) < CYC.hh;
  };
  const arcs = at.map(function(k0, i){
    const k1 = i === n - 1 ? N : at[i+1];
    const a = pts[k0], b = pts[k1 % N];
    const seg = [];
    for(let k=k0;k<=k1;k++){ if(!inBox(pts[k], a) && !inBox(pts[k], b)) seg.push(pts[k]); }
    return seg;
  });
  return {nodes:at.map(function(k){ return pts[k]; }), arcs:arcs};
}

function cycleHTML(q){
  const L = q.layout, n = L.steps.length, G = cycleGeometry(n);
  const labelled = L.arrows.some(function(a){ return a.label; });
  const f = function(v){ return v.toFixed(2); };
  let svg = '<svg viewBox="0 0 100 '+CYC.h+'" aria-hidden="true" direction="ltr">'+
    '<defs><marker id="cyc-ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" '+
      'orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="var(--ink-2)"/></marker></defs>';
  G.arcs.forEach(function(seg, i){
    if(seg.length < 2) return;
    svg += '<path d="M'+seg.map(function(p){ return f(p.x)+' '+f(p.y); }).join(' L')+'" fill="none" '+
      'stroke="var(--line-2)" stroke-width="0.7" stroke-linecap="round" marker-end="url(#cyc-ah)"/>';
    if(!labelled) return;
    const m = seg[Math.floor(seg.length / 2)];
    svg += '<circle cx="'+f(m.x)+'" cy="'+f(m.y)+'" r="3.4" fill="var(--surface)" stroke="var(--line-2)" stroke-width="0.4"/>'+
      '<text x="'+f(m.x)+'" y="'+f(m.y)+'" font-size="3.6" font-weight="600" fill="var(--ink-2)" '+
      'text-anchor="middle" dominant-baseline="central" font-family="IBM Plex Sans, sans-serif">'+(i+1)+'</text>';
  });
  svg += '</svg>';

  const nodes = L.steps.map(function(s, i){
    const p = G.nodes[i];
    return '<div class="cn" style="left:'+f(p.x)+'%;top:'+f(p.y / CYC.h * 100)+'%">'+stepCell(q, s)+'</div>';
  }).join('');

  const legend = labelled
    ? '<ol class="legend-a">'+L.arrows.map(function(a){
        return '<li><span class="badge">'+(a.i+1)+'</span><div class="cell">'+arrowCell(q, a)+'</div></li>';
      }).join('')+'</ol>'
    : '';
  return '<div class="cyc">'+svg+nodes+'</div>'+legend;
}

function boardHTML(q){
  let targets;
  if(q.act.type === 'sort') targets = groupsHTML(q);
  else if(q.act.cycle && q.layout.steps.length <= CYCLE_MAX) targets = cycleHTML(q);
  else targets = seqHTML(q);
  return '<div class="board">'+bankHTML(q)+targets+'</div>';
}

function wireBoard(q){
  const board = app.querySelector('.board');
  if(!board || q.answered) return;
  const zoneOf = function(el){ const z = el.dataset.zone; return z === 'bank' ? null : z; };
  /* ציור מחדש מאבד פוקוס; מחזירים אותו לאותו אלמנט בשביל מקלדת */
  const redraw = function(sel){
    renderNow();
    const el = sel && app.querySelector(sel);
    if(el && el.focus) el.focus({preventScroll:true});
  };
  board.addEventListener('click', function(e){
    const chip = e.target.closest('[data-chip]');
    if(chip){ tapChip(q, chip.dataset.chip); redraw('[data-chip="'+chip.dataset.chip+'"]'); return; }
    const zone = e.target.closest('[data-zone]');
    if(zone && q.sel){
      const moving = q.sel;
      tapZone(q, zoneOf(zone));
      redraw('[data-chip="'+moving+'"]');
    }
  });
  /* גרירה בעכבר. במגע ההקשה היא הדרך — גרירה שם חוסמת גלילה */
  board.addEventListener('dragstart', function(e){
    const chip = e.target.closest && e.target.closest('[data-chip]');
    if(!chip) return;
    q.drag = chip.dataset.chip;
    try{ e.dataTransfer.setData('text/plain', q.drag); e.dataTransfer.effectAllowed = 'move'; }catch(err){}
    chip.classList.add('drag');
  });
  board.addEventListener('dragend', function(){ q.drag = null; renderNow(); });
  board.addEventListener('dragover', function(e){
    if(q.drag && e.target.closest && e.target.closest('[data-zone]')) e.preventDefault();
  });
  board.addEventListener('drop', function(e){
    const zone = e.target.closest && e.target.closest('[data-zone]');
    if(!q.drag || !zone) return;
    e.preventDefault();
    placeChip(q, q.drag, zoneOf(zone));
    q.drag = null;
    renderNow();
  });
}

function activityFooter(q){
  if(!q.answered){
    const placed = Object.keys(q.place).length;
    return '<div class="act-foot">'+
      '<button class="btn primary" id="checkBtn">'+(placed ? 'בדוק' : 'הצג תשובה')+'</button>'+
      '<span dir="ltr">'+placed+'/'+q.chips.length+'</span></div>';
  }
  const r = q.result, ok = r.right === r.total;
  const back = q.interval >= 1
    ? ' · חוזר בעוד ' + q.interval + (q.interval === 1 ? ' יום' : ' ימים')
    : ' · חוזר בקרוב';
  let fb = '<div class="feedback '+(ok ? 'ok' : 'bad')+'"><span class="fb-txt">'+
    (ok ? 'מושלם' : r.right+' מתוך '+r.total+' במקום')+(q.why ? ' — '+esc(q.why) : '')+back+'</span>'+
    (!ok && CFG.explainUrl && AUTH && AUTH.editor
      ? '<button class="why-btn" id="whyBtn">'+(q.whyBusy ? '…' : 'למה?')+'</button>' : '')+
    '<button class="next" id="nextBtn">הבא</button></div>';
  const cached = !ok && (q.whyText || whyFor(whyKeyOf(q)));
  if(cached) fb += '<div class="why">'+esc(cached)+'</div>';
  return fb;
}

function renderQuiz(){
  const q = quiz.qs[quiz.i];
  const answered = !!q.answered;
  if(!answered && !q.shownAt) q.shownAt = Date.now();   /* למדידת ביטחון */
  const ok = answered && q.answered===q.answer;
  const correctOpt = q.options.filter(function(o){ return o.id===q.answer; })[0];

  let opts;
  if(q.act){
    opts = boardHTML(q);
  } else if(q.optionKind==='pic'){
    opts = '<div class="opts grid">'+q.options.map(function(o){
      let cls='opt pic';
      if(answered){ cls += o.id===q.answer ? ' correct' : (o.id===q.answered ? ' wrong' : ' dim'); }
      return '<button class="'+cls+'" data-id="'+esc(o.id)+'"'+(answered?' disabled':'')+'>'+
        molSVG(o.mol,{alt:'אפשרות מבנה'})+'</button>';
    }).join('')+'</div>';
  } else {
    opts = '<div class="opts">'+q.options.map(function(o,idx){
      let cls='opt text';
      if(answered){ cls += o.id===q.answer ? ' correct' : (o.id===q.answered ? ' wrong' : ' dim'); }
      const lead = o.sym
        ? '<span class="sym">'+esc(o.sym)+'</span>'
        : '<span class="key">'+(idx+1)+'</span>';
      return '<button class="'+cls+'" data-id="'+esc(o.id)+'"'+(answered?' disabled':'')+'>'+
        lead+'<span class="lbl"><strong'+(o.ltr?' class="ltr"':'')+'>'+esc(o.main)+'</strong>'+
        (o.sub?'<em>'+esc(o.sub)+'</em>':'')+'</span></button>';
    }).join('')+'</div>';
  }

  let fb='<div class="feedback hide"></div>';
  if(q.act) fb = activityFooter(q);
  else if(answered){
    const name = correctOpt ? correctOpt.main : '';
    const back = q.interval >= 1
      ? ' · חוזר בעוד ' + q.interval + (q.interval === 1 ? ' יום' : ' ימים')
      : ' · חוזר בקרוב';
    if(ok){
      fb = '<div class="feedback ok"><span class="fb-txt">נכון'+(q.why?' — '+esc(q.why):'')+back+'</span></div>';
    } else {
      fb = '<div class="feedback bad"><span class="fb-txt">התשובה: <b'+(correctOpt&&correctOpt.ltr?' class="ltr"':'')+'>'+
        esc(name)+'</b>'+(q.why?' · '+esc(q.why):'')+'</span>'+
        (CFG.explainUrl && AUTH && AUTH.editor ? '<button class="why-btn" id="whyBtn">'+
          (q.whyBusy?'…':'למה?')+'</button>' : '')+
        '<button class="next" id="nextBtn">הבא</button></div>';
      const cached = q.whyText || whyFor(whyKeyOf(q));
      if(cached) fb += '<div class="why">'+esc(cached)+'</div>';
    }
  }

  app.innerHTML =
  '<div class="bar">'+
    '<button class="icon-btn" id="homeBtn" aria-label="חזרה">'+icon('home')+'</button>'+
    '<div class="track"><i style="width:'+(quiz.i/quiz.qs.length*100)+'%"></i></div>'+
    '<div class="count" dir="ltr"><b>'+(quiz.i+1)+'</b>/'+quiz.qs.length+' · ✓'+quiz.correct+'</div>'+
  '</div>'+
  '<div class="quiz">'+
    '<div class="prompt-label">'+esc(q.label)+'</div>'+
    '<div class="stage'+(q.act ? ' slim' : '')+'">'+promptHTML(q.prompt)+'</div>'+
    opts + '<div class="fb-wrap">' + fb + '</div>' +
  '</div>';

  app.querySelector('#homeBtn').addEventListener('click', goBack);
  Array.prototype.forEach.call(app.querySelectorAll('.opt'), function(btn){
    btn.addEventListener('click', function(){ answer(btn.dataset.id); });
  });
  if(q.act) wireBoard(q);
  const cb=app.querySelector('#checkBtn');
  if(cb) cb.addEventListener('click', submitActivity);
  const nb=app.querySelector('#nextBtn');
  if(nb) nb.addEventListener('click', next);

  const wb=app.querySelector('#whyBtn');
  if(wb) wb.addEventListener('click', function(){
    /* רק ריצה פעילה או הסבר שכבר התקבל חוסמים. כישלון קודם ניתן לנסות שוב —
       קודם הוא נחסם לצמיתות והכפתור נראה מת. */
    if(q.whyBusy || whyFor(whyKeyOf(q))) return;
    q.whyBusy = true; q.whyText = null; renderNow();

    const chosen = q.options.filter(function(o){ return o.id===q.answered; })[0];
    const t = explainText(q, correctOpt, chosen);

    /* בסבב מעורב שם הסבב הוא "חזרה כללית" — שולחים את שם הנושא עצמו */
    const own = deckById(String(q.key).split(':')[0]);
    const wk = whyKeyOf(q);
    callFn(CFG.explainUrl, {
      question: t.question,
      answer:   t.answer,
      chosen:   t.chosen,
      deck:     (own || quiz.deck).title
    }).then(function(res){
      q.whyBusy = false;
      if(res.ok && res.body.text){
        q.whyText = res.body.text;
        whySave(wk, res.body.text);
      } else {
        logError('function', 'explain → ' + res.status + ' ' + (res.body.error || ''),
                 {deck:quiz.deck.title, key:q.key});
        q.whyText = res.body.error
          ? 'לא הצלחתי להסביר: ' + res.body.error
          : 'לא הצלחתי להסביר.';
      }
      render();
    });
  });
}

    '<div class="btn-row">'+
      '<button class="btn primary" id="againBtn">סבב נוסף</button>'+

  const deckId = quiz.deck.id, mode = quiz.mode;

function renderMap(){

    return '<div class="node" style="--nc:'+safeColor(n.color, 'var(--line-2)')+'"><strong>'+esc(n.he)+'</strong>'+
      '<em>'+esc(n.def)+'</em>'+(n.ex?'<span class="ex">'+esc(n.ex)+'</span>':'')+'</div>';
