/* ===========================================================
   הוספת שאלה — שולח בקשה לפונקציית Supabase, שמפעילה את Claude
   ומעדכנת את data/decks.json ברפו. הדיפלוי מתרחש אוטומטית.
   =========================================================== */
/* ===========================================================
   התחברות עם גוגל דרך Supabase — זרימת OAuth ישירה, בלי SDK,
   כדי לא להוסיף תלות רשת לאפליקציה שאמורה לעבוד אופליין.
   =========================================================== */
const AUTH_KEY = 'shinun-auth';
const SIGNIN_KEY = 'shinun-signin';      /* חותמת: המכשיר הזה התחיל התחברות */
const authEnabled = !!(CFG.supabaseUrl && CFG.supabaseKey);

function authRead(){
  const v = jread(AUTH_KEY, null);
  return isObj(v) && v.access ? v : null;
}
/* טוקן רענון מסובב שלא נשמר = ניתוק בפתיחה הבאה. jwrite מפנה מקום
   ומנסה שוב לפני שהוא מוותר. */
function authWrite(v){
  if(!v){ jremove(AUTH_KEY); return true; }
  /* לשונית אחרת אולי כבר סובבה את הטוקן. כתיבה של האובייקט שבזיכרון
     (למשל אחרי בדיקת הרשאות) הייתה מחזירה לדיסק טוקן רענון ישן, והרענון
     הבא עם הטוקן הישן היה נדחה ומנתק. אם בדיסק יש טוקן חדש יותר של אותו
     משתמש — מאמצים אותו. */
  const disk = jread(AUTH_KEY, null);
  if(isObj(disk) && disk.access && disk.refresh && disk.refresh !== v.refresh){
    const a = claims(disk.access), b = claims(v.access);
    if(a.sub && a.sub === b.sub && (a.exp || 0) > (b.exp || 0)){
      v.access = disk.access; v.refresh = disk.refresh;
    }
  }
  return jwrite(AUTH_KEY, v);
}
let AUTH = authRead();

/* פענוח מטען ה-JWT. uid (sub) ומייל ידועים מתוכו גם בלי רשת. */
function claims(tok){
  try{
    const part = String(tok || '').split('.')[1];
    if(!part) return {};
    const pad = part.replace(/-/g,'+').replace(/_/g,'/');
    const bin = atob(pad + '==='.slice((pad.length + 3) % 4));
    /* המטען עלול להכיל תווים לא-ASCII (שם בעברית למשל), ואז JSON.parse
       על פלט atob הגולמי נכשל. מפענחים כ-UTF-8. */
    let text = bin;
    try{
      text = decodeURIComponent(Array.prototype.map.call(bin, function(c){
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
    }catch(e){}
    const p = JSON.parse(text);
    return isObj(p) ? p : {};
  }catch(e){ return {}; }
}
function authUid(){
  if(!AUTH) return null;
  return AUTH.uid || claims(AUTH.access).sub || '';
}
function canSync(){ return !!(CFG.supabaseUrl && AUTH && AUTH.access); }
function restHeaders(){
  const h = { apikey: CFG.supabaseKey, 'Content-Type': 'application/json' };
  if(AUTH && AUTH.access) h.Authorization = 'Bearer ' + AUTH.access;
  return h;
}
/* uid ומייל מתוך הטוקן — בלי לחכות ל-/auth/v1/user */
function fillFromClaims(){
  if(!AUTH) return;
  const c = claims(AUTH.access);
  let changed = false;
  if(!AUTH.uid && c.sub){ AUTH.uid = c.sub; changed = true; }
  if(!AUTH.email && c.email){ AUTH.email = c.email; changed = true; }
  if(changed) authWrite(AUTH);
}

/* חזרה מגוגל — הטוקנים מגיעים ב-hash. קולטים, מנקים מה-URL ושומרים.
   רק אם המכשיר הזה ביקש התחברות בחצי השעה האחרונה: אחרת קישור עם
   טוקנים של מישהו אחר היה מכניס את המכשיר לחשבון שלו בשקט. */
(function absorbHash(){
  /* החותמת נצרכת בכל טעינה — גם בחזרה בלי טוקנים (ביטול, "אחורה" מגוגל,
     שגיאה). כך היא תקפה רק לחזרה הראשונה אחרי ההתחברות, ולא נשארת
     פתוחה לקישור שמגיע אחר כך. */
  const started = jread(SIGNIN_KEY, null);
  if(started) jremove(SIGNIN_KEY);
  if(!location.hash) return;
  const p = new URLSearchParams(location.hash.slice(1));
  const at = p.get('access_token'), rt = p.get('refresh_token');
  if(!at && !p.get('error')) return;
  history.replaceState(null, '', location.pathname + location.search);
  if(!at){
    view.lockErr = 'ההתחברות בוטלה או נכשלה' + (p.get('error_description') ? ': ' + p.get('error_description') : '.');
    return;
  }
  if(!isObj(started) || !(Date.now() - (started.t || 0) < 15*60000)){
    view.lockErr = 'ההתחברות לא הושלמה במכשיר הזה. התחבר שוב מכאן.';
    logError('client', 'חזרה מהתחברות בלי חותמת מקומית — נדחתה', null);
    return;
  }
  const c = claims(at);
  AUTH = {access:at, refresh:rt, email:c.email || null, uid:c.sub || null, verifiedAt:0};
  authWrite(AUTH);
  if(typeof started.deck === 'string') pendingShare = started.deck;
})();

function signIn(){
  /* הקישור לנושא ששותף עובר איתנו דרך גוגל ובחזרה */
  jwrite(SIGNIN_KEY, {t: Date.now(), deck: pendingShare || null});
  const back = location.origin + location.pathname;
  location.href = CFG.supabaseUrl + '/auth/v1/authorize?provider=google'
    + '&redirect_to=' + encodeURIComponent(back);
}
/* ביטול המפגש בשרת. scope=local — רק המכשיר הזה; ברירת המחדל של
   Supabase מנתקת את כל המכשירים. */
function revoke(tok){
  if(!tok || !CFG.supabaseUrl) return;
  try{
    fetch(CFG.supabaseUrl + '/auth/v1/logout?scope=local', {
      method:'POST', headers:{ apikey: CFG.supabaseKey, Authorization:'Bearer ' + tok }
    }).catch(function(){});
  }catch(e){}
}
/* יציאה מפורשת. מה שהשרת יכול להחזיר (ספרייה, הסברים) נמחק מהמכשיר.
   כרטיסים, תור והגדרות נשארים תחת ה-uid — אולי עוד לא נשלחו — ואינם
   מוצגים לאף משתמש אחר. */
function signOut(){
  /* ביטול בשרת דורש טוקן גישה תקף. אם פג — מרעננים פעם אחת ומבטלים
     עם החדש; אחרת המפגש (וטוקן הרענון שלו) נשאר חי בשרת. */
  const a = AUTH;
  if(a && a.refresh && tokenStale() && CFG.supabaseUrl){
    try{
      fetch(CFG.supabaseUrl + '/auth/v1/token?grant_type=refresh_token', {
        method:'POST', headers:{ apikey: CFG.supabaseKey, 'Content-Type':'application/json' },
        body: JSON.stringify({ refresh_token: a.refresh })
      }).then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){ if(j && j.access_token) revoke(j.access_token); })
        .catch(function(){});
    }catch(e){}
  } else revoke(a && a.access);
  if(UID){ jremove(ukey(ROWS_KEY)); jremove(ukey(EXPLAIN_KEY)); }
  hardSignOut('התנתקת.');
  view = {name:'home', lockErr:null};
  render();
}

/* אימות הרשאת עורך מול השרת. רשימת המורשים לא יושבת כאן בכוונה —
   הקוד הזה ציבורי, והרשימה נשארת ב-ALLOWED_EMAILS בצד השרת.
   רק תשובה מפורשת משנה הרשאה; תקלה בשרת אינה "לא עורך". */
function verifyAccess(force, retried){
  if(!CFG.explainUrl || !AUTH || !AUTH.access) return Promise.resolve();
  if(!force && Date.now() - (AUTH.verifiedAt || 0) < 6*3600000) return Promise.resolve();  /* אחת לשש שעות */
  const ep = USER_EPOCH;
  return ensureToken().then(function(){
    if(!AUTH || ep !== USER_EPOCH) return null;
    return fetch(CFG.explainUrl, {
      method:'POST',
      headers:{'Content-Type':'application/json', Authorization:'Bearer ' + AUTH.access},
      body: JSON.stringify({verify:true})
    });
  }).then(function(r){
    if(!r || !AUTH || ep !== USER_EPOCH) return;
    /* 401 = אולי הטוקן פג. רענון אחד וניסיון אחד — לא לולאה. */
    if(r.status === 401){
      if(retried) return;
      return ensureToken(true).then(function(ok){ if(ok) return verifyAccess(true, true); });
    }
    if(!r.ok) return;
    return r.json().then(function(j){
      if(!AUTH || ep !== USER_EPOCH || !j || typeof j.editor !== 'boolean') return;
      const was = !!AUTH.editor;
      AUTH.editor = j.editor;
      AUTH.verifiedAt = Date.now();
      authWrite(AUTH);
      if(was !== AUTH.editor) render();
    });
  }).catch(function(){});   /* אופליין — לא משנים כלום */
}

/* זהות: uid ומייל. בדרך כלל ידועים כבר מהטוקן; פנייה לשרת רק כשחסר.
   אינה מפעילה סנכרון — זה התפקיד של syncAll. */
function loadIdentity(retried){
  if(!AUTH || !AUTH.access) return Promise.resolve();
  fillFromClaims();
  if(AUTH.email && AUTH.uid){ bindUser(authUid()); return Promise.resolve(); }
  const ep = USER_EPOCH;
  return fetch(CFG.supabaseUrl + '/auth/v1/user', {
    headers:{ apikey: CFG.supabaseKey, Authorization: 'Bearer ' + AUTH.access }
  }).then(function(r){
    if(r.status === 401 && !retried){
      /* אולי רק פג — רענון אחד, ניסיון אחד */
      return ensureToken(true).then(function(ok){ return ok ? loadIdentity(true) : null; })
        .then(function(){ return null; });
    }
    return r.ok ? r.json() : null;
  }).then(function(u){
    if(!u || !u.id || !AUTH || ep !== USER_EPOCH) return;
    AUTH.email = u.email || AUTH.email; AUTH.uid = u.id; authWrite(AUTH);
    bindUser(authUid());
    render();
  }).catch(function(){});   /* אופליין — משאירים את המשתמש בפנים */
}

/* פענוח exp מתוך ה-JWT. טוקן הגישה חי שעה, ורענון היה ממומש רק
   בקריאות לפונקציות — ולכן אחרי שעה כל שאילתה למסד חזרה 401
   והאפליקציה נפלה למטמון בשקט. */
function tokenExp(){
  if(!AUTH || !AUTH.access) return 0;
  const e = claims(AUTH.access).exp;
  return isFinite(e) && e > 0 ? e * 1000 : 0;
}
function tokenStale(margin){
  const exp = tokenExp();
  /* לא הצלחנו לקרוא תוקף — מניחים שפג ומרעננים. ההנחה ההפוכה גורמת
     לכך שלא מרעננים לעולם, וכל שאילתה חוזרת 401. */
  if(!exp) return true;
  return Date.now() > exp - (margin == null ? 60000 : margin);   /* דקה מרווח */
}

/* ===========================================================
   ניהול המפגש. נקודת כניסה אחת לרענון, כדי שקריאות מקבילות לא
   ישרפו טוקן רענון אחת לשנייה — Supabase מסובב אותם, וטוקן שכבר
   נצרך נדחה. כשל רשת אינו מנתק; רק דחייה מפורשת של השרת מנתקת.
   epoch עולה בכל ניתוק: רענון שחוזר אחריו לא מחייה את המפגש.
   =========================================================== */
const SESSION = { refreshing: null, timer: null, lastError: null, epoch: 0, backoff: 0 };

function hardSignOut(reason){
  AUTH = null;
  authWrite(null);
  SESSION.epoch++;
  if(SESSION.timer){ clearTimeout(SESSION.timer); SESSION.timer = null; }
  SESSION.refreshing = null;
  /* הזיכרון מתרוקן; מה שבדיסק נשאר תחת ה-uid ולא מוצג לאחר */
  bindUser(null);
  quiz = null;
  pendingShare = null;
  Array.prototype.forEach.call(document.querySelectorAll('.sheet-bg'), function(b){ b.remove(); });
  view = {name:'home', lockErr: reason || 'ההתחברות פגה. התחבר שוב.'};
  render();
}

/* לשונית אחרת כבר רעננה, והטוקן שבזיכרון כאן נצרך. מאמצים את שלה —
   אחרת ניסיון לרענן עם הטוקן הישן נדחה, ומנתק את שתי הלשוניות. */
function adoptFromDisk(){
  const disk = authRead();
  if(!disk || !AUTH || disk.refresh === AUTH.refresh) return false;
  const a = claims(disk.access), mine = authUid();
  if(!a.sub || !mine || a.sub !== mine) return false;
  if(!a.exp || Date.now() > a.exp * 1000 - 60000) return false;
  AUTH = Object.assign({}, AUTH, {access: disk.access, refresh: disk.refresh});
  scheduleRefresh();
  return true;
}

/* הקריאה היחידה שמחליפה טוקן. מחזירה 'ok' · 'transient' · 'terminal' · 'aborted'.
   שתי מצבים שונים אחרי שהבקשה יצאה:
     signedOut — המשתמש התנתק בינתיים: המפגש החדש מבוטל ולא חוזר לחיים.
     rotated   — לשונית אחרת כבר רעננה את אותו מפגש וכבר אימצנו את הטוקן
                 שלה. זו הצלחה, ואסור לבטל: הביטול היה מוחק את המפגש המשותף
                 ומנתק את כל הלשוניות. */
function doRefresh(){
  if(!AUTH || !AUTH.refresh) return Promise.resolve('terminal');
  if(adoptFromDisk()) return Promise.resolve('ok');
  const ep = SESSION.epoch, rt = AUTH.refresh;
  const signedOut = function(){ return ep !== SESSION.epoch || !AUTH; };
  const rotated   = function(){ return !!AUTH && AUTH.refresh !== rt; };
  /* בקשה תקועה מחזיקה את הנעילה המשותפת ומקפיאה את כל הלשוניות — גוזרים */
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctl ? setTimeout(function(){ ctl.abort(); }, 20000) : null;
  const done = function(x){ if(timer) clearTimeout(timer); return x; };
  return fetch(CFG.supabaseUrl + '/auth/v1/token?grant_type=refresh_token', {
    method:'POST',
    headers:{ apikey: CFG.supabaseKey, 'Content-Type':'application/json' },
    body: JSON.stringify({ refresh_token: rt }),
    signal: ctl ? ctl.signal : undefined
  }).then(function(r){
    if(r.ok) return r.json().then(function(j){
      if(!j || !j.access_token) return 'terminal';
      if(signedOut()){ revoke(j.access_token); return 'aborted'; }
      if(rotated()) return 'ok';
      /* משמרים את שאר הזהות — בנייה מחדש מחקה את uid ושברה הכול */
      AUTH = Object.assign({}, AUTH, {
        access:  j.access_token,
        refresh: j.refresh_token || AUTH.refresh
      });
      authWrite(AUTH);
      scheduleRefresh();
      return 'ok';
    });
    if(signedOut()) return 'aborted';
    if(rotated()) return 'ok';
    return r.text().then(function(t){
      SESSION.lastError = String(t).slice(0, 200);
      if(adoptFromDisk()) return 'ok';
      logError('fetch', 'refresh_token → ' + r.status, {body:SESSION.lastError});
      /* 5xx או 429 — תקלה חולפת בשרת, לא סיבה לנתק משתמש */
      if(r.status >= 500 || r.status === 429) return 'transient';
      return 'terminal';
    });
  }).catch(function(err){
    /* אין רשת (או שהבקשה נגזרה). המפגש עדיין תקף, ננסה שוב מאוחר יותר. */
    SESSION.lastError = (err && err.name === 'AbortError') ? 'הרענון נתקע' : ((err && err.message) || 'שגיאת רשת');
    return 'transient';
  }).then(done);
}

/* נקודת הכניסה היחידה. force מרענן גם כשהטוקן נראה תקף — למשל
   אחרי 401 שהגיע בכל זאת. 'soon' — הרענון היזום: רק אם נשארו פחות
   משתי דקות וחצי (הטיימר מכוון לשתי דקות לפני הפקיעה; ensureToken רגיל
   מרענן רק בדקה האחרונה, ופעם הטיימר לא עשה כלום). */
const REFRESH_SOON = 150000;
function ensureToken(force){
  if(!AUTH || !AUTH.access) return Promise.resolve(false);
  if(!force && !tokenStale()) return Promise.resolve(true);
  if(force === 'soon' && !tokenStale(REFRESH_SOON)) return Promise.resolve(true);
  if(!SESSION.refreshing){
    const rt = AUTH.refresh, ep = SESSION.epoch;
    SESSION.refreshing = refreshLocked(function(){
      /* התנתקות בזמן שחיכינו לנעילה */
      if(ep !== SESSION.epoch || !AUTH) return Promise.resolve('aborted');
      /* בזמן שחיכינו לשונית אחרת רעננה, ואימצנו את הטוקן שלה */
      if(AUTH.refresh !== rt && !tokenStale(force === 'soon' ? REFRESH_SOON : 60000))
        return Promise.resolve('ok');
      return doRefresh();
    }).then(function(res){
      SESSION.refreshing = null;
      if(res === 'terminal'){ hardSignOut(); return false; }
      if(res === 'transient') retryRefreshLater();
      return res === 'ok';
    });
  }
  return SESSION.refreshing;
}

/* לשוניות פתוחות מרעננות באותו רגע (אותו exp). נעילה משותפת מסדרת אותן:
   השנייה נכנסת אחרי הראשונה, מוצאת את הטוקן החדש בדיסק ומאמצת אותו
   (adoptFromDisk בתחילת doRefresh) במקום לשרוף עוד טוקן רענון. */
function refreshLocked(work){
  try{
    if(navigator.locks && typeof navigator.locks.request === 'function')
      return navigator.locks.request('shinun-refresh', function(){ return work(); })
        .catch(function(){ return work(); });
  }catch(e){}
  return work();
}

/* רענון יזום לפני הפקיעה, כדי שפעולה של המשתמש לא תשלם על בקשה
   שנכשלת. גם חזרה ללשונית מפעילה בדיקה. */
function scheduleRefresh(){
  if(SESSION.timer){ clearTimeout(SESSION.timer); SESSION.timer = null; }
  SESSION.backoff = 0;
  const exp = tokenExp();
  if(!exp) return;
  const wait = Math.max(15000, exp - Date.now() - 120000);   /* שתי דקות מרווח */
  if(wait > 2147483647) return;
  SESSION.timer = setTimeout(function(){ SESSION.timer = null; ensureToken('soon'); }, wait);
}
/* רענון שנכשל בגלל רשת — עוד ניסיון, במרווח שגדל עד חמש דקות */
function retryRefreshLater(){
  if(!AUTH) return;
  if(SESSION.timer) clearTimeout(SESSION.timer);
  SESSION.backoff = Math.min(300000, (SESSION.backoff || 15000) * 2);
  SESSION.timer = setTimeout(function(){ SESSION.timer = null; ensureToken('soon'); }, SESSION.backoff);
}

/* לשונית אחרת (האפליקציה המותקנת ולשונית בדפדפן, למשל) שינתה משהו */
addEventListener('storage', function(e){
  if(!e.key) return;
  if(e.key === AUTH_KEY){
    const disk = authRead();
    if(!disk){ if(AUTH) hardSignOut('התנתקת בחלון אחר.'); return; }
    const other = disk.uid || claims(disk.access).sub || '';
    if(!AUTH || (other && authUid() && other !== authUid())){ location.reload(); return; }
    if(disk.refresh !== AUTH.refresh){
      AUTH = Object.assign({}, AUTH, {access: disk.access, refresh: disk.refresh});
      scheduleRefresh();
    }
    return;
  }
  if(UID === null) return;
  if(e.key === ukey(CARDS_KEY) || e.key === ukey(DIRTY_KEY) || e.key === ukey(LOG_KEY)) mergeFromDisk();
});
/* איחוד עם מה שלשונית אחרת כתבה: כרטיס — המאוחר מנצח; תור — איחוד
   לפי מזהה. השרת מתעלם מכפילויות, כך שעודף שליחה אינו נזק. */
function mergeFromDisk(){
  const c = uread(CARDS_KEY, {}), d = uread(DIRTY_KEY, {}), l = uread(LOG_KEY, []);
  let changed = false;
  if(isObj(c)) Object.keys(c).forEach(function(k){
    const st = c[k];
    if(validState(st) && (!CARDS[k] || st.last > CARDS[k].last)){ CARDS[k] = st; changed = true; }
  });
  if(isObj(d)) Object.keys(d).forEach(function(k){ if(!DIRTY[k] && CARDS[k]) DIRTY[k] = 1; });
  if(Array.isArray(l)){
    const have = {};
    LOGQ.forEach(function(x){ have[x.id] = 1; });
    l.forEach(function(x){ if(isObj(x) && x.id && x.card_key && !have[x.id]) LOGQ.push(x); });
  }
  if(changed) render();
}

/* קריאה לפונקציה עם טוקן המשתמש. מרענן פעם אחת על 401. */
const CALL_TIMEOUT = 170000;
function callFn(url, payload, retried){
  /* גוזרים בעצמנו, אחרת חיבור שנופל מציג "Failed to fetch" בלי שום מידע */
  const ctl = typeof AbortController==='function' ? new AbortController() : null;
  const t0 = Date.now();
  const timer = ctl ? setTimeout(function(){ ctl.abort(); }, CALL_TIMEOUT) : null;
  return ensureToken().then(function(){
    const headers = {'Content-Type':'application/json'};
    if(AUTH && AUTH.access) headers.Authorization = 'Bearer ' + AUTH.access;
    return fetch(url, {method:'POST', headers:headers, body:JSON.stringify(payload),
                       signal: ctl ? ctl.signal : undefined});
  })
    .then(function(r){
      if(timer) clearTimeout(timer);
      if(r.status===401 && AUTH && AUTH.refresh && !retried){
        return ensureToken(true).then(function(ok){
          if(!ok) return r.json().then(function(j){ return {ok:false, status:401, body:j}; });
          return callFn(url, payload, true);
        });
      }
      return r.json().then(function(j){ return {ok:r.ok, status:r.status, body:j}; })
              .catch(function(){ return {ok:r.ok, status:r.status, body:{}}; });
    })
    .catch(function(err){
      if(timer) clearTimeout(timer);
      const secs = Math.round((Date.now()-t0)/1000);
      const why = (err && err.name==='AbortError')
        ? 'הבקשה נגזרה אחרי '+secs+' שניות'
        : 'החיבור נפל אחרי '+secs+' שניות ('+(err && err.message || 'לא ידוע')+')';
      return {ok:false, status:0, body:{error: why}};
    });
}

/* מכווצים בצד הלקוח: שקף בגודל מלא הוא בזבוז טוקנים, ו-1568px
   היא הקצה הארוך שמעברו התמונה מוקטנת ממילא בצד השרת. */
const MAX_EDGE = 1568, MAX_SHOTS = 4;
function shrinkImage(file){
  return new Promise(function(resolve, reject){
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = function(){
      const scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width*scale)), h = Math.max(1, Math.round(img.height*scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const data = c.toDataURL('image/jpeg', 0.82);
      resolve({ media_type:'image/jpeg', data: data.slice(data.indexOf(',')+1) });
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('לא הצלחתי לקרוא את התמונה')); };
    img.src = url;
  });
}

const EXAMPLES = [
  'תוסיף שאלה על הקבוצה הפוספודיאסטר',
  'בנה חבילה מהשקף המצורף',
  'רק המושגים המודגשים בשקף',
  'ההגדרה של אנומרים לא מדויקת — תקן',
];

/* ===========================================================
   צ'אט הוספת תוכן. שיחה ולא פקודה אחת: אפשר לצרף PDF או תמונות,
   לשאול, לתקן, ולאשר. הקבצים מכווצים בלקוח; PDF נשלח כמו שהוא.
   =========================================================== */
const CHAT_EXAMPLES = [
  'תבנה כרטיסיות מהדברים החשובים במסמך',
  'רק המושגים המודגשים בשקף',
  'תוסיף שאלה על הקבוצה הפוספודיאסטר',
];
const MAX_PDF_BYTES = 9 * 1024 * 1024;

function readAsBase64(file){
  return new Promise(function(resolve, reject){
    const fr = new FileReader();
    fr.onload = function(){
      const s = String(fr.result);
      resolve(s.slice(s.indexOf(',') + 1));
    };
    fr.onerror = function(){ reject(new Error('לא הצלחתי לקרוא את הקובץ')); };
    fr.readAsDataURL(file);
  });
}

/* תמונה מכווצת, PDF נשלח כמו שהוא */
function prepFile(file){
  if(file.type === 'application/pdf'){
    if(file.size > MAX_PDF_BYTES)
      return Promise.reject(new Error('ה-PDF גדול מ-9MB. פצל אותו או שלח פרק.'));
    return readAsBase64(file).then(function(data){
      return {media_type:'application/pdf', data:data, name:file.name || 'מסמך.pdf'};
    });
  }
  if(file.type && file.type.indexOf('image/') === 0){
    return shrinkImage(file).then(function(img){
      return {media_type:img.media_type, data:img.data, name:file.name || 'תמונה'};
    });
  }
  return Promise.reject(new Error('אפשר לצרף תמונות או PDF בלבד.'));
}

function openAddSheet(){
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  const chat = [];          /* {role, text, files:[{media_type,data,name}]} */
  let tray = [];            /* קבצים שממתינים לשליחה */
  let busy = false;

  function close(){ bg.remove(); }

  function fileHTML(f, small){
    if(f.media_type === 'application/pdf')
      return '<span class="doc">'+esc(f.name || 'PDF')+'</span>';
    return '<img alt="'+esc(f.name||'תמונה')+'" src="data:'+f.media_type+';base64,'+f.data+'">';
  }

  function draw(){
    const log = chat.map(function(m){
      if(m.role === 'sys')  return '<div class="bub sys">'+esc(m.text)+'</div>';
      if(m.role === 'done') return '<div class="bub done">'+esc(m.text)+'</div>';
      const cls = m.role === 'user' ? 'me' : 'ai';
      return '<div class="bub '+cls+'">'+esc(m.text || '')+
        ((m.files && m.files.length)
          ? '<div class="files">'+m.files.map(function(f){ return fileHTML(f); }).join('')+'</div>'
          : '')+
      '</div>';
    }).join('') + (busy
      ? '<div class="bub ai"><span class="typing"><i></i><i></i><i></i></span></div>' : '');

    bg.innerHTML =
      '<div class="sheet" role="dialog" aria-modal="true" aria-label="הוספת תוכן">'+
        '<div class="sheet-head"><h2>הוספת תוכן</h2><button id="cClose">סגור</button></div>'+
        (chat.length ? '' :
          '<p class="hint">צרף PDF או צילום שקף, או פשוט תאר מה להוסיף. '+
            'אפשר גם להדביק תמונה מהלוח עם Ctrl+V. אני אשאל לפני שאבנה הרבה כרטיסים.</p>'+
          '<div class="examples">'+CHAT_EXAMPLES.map(function(x){
            return '<button class="ex" data-ex="'+esc(x)+'">'+esc(x)+'</button>';
          }).join('')+'</div>')+
        '<div class="chat"><div class="chat-log" id="cLog">'+log+'</div>'+
          '<div class="composer">'+
            (tray.length
              ? '<div class="tray">'+tray.map(function(f,i){
                  return '<div class="chip-f">'+
                    (f.media_type==='application/pdf'
                      ? '<span>'+esc((f.name||'PDF').slice(0,18))+'</span>'
                      : '<img alt="" src="data:'+f.media_type+';base64,'+f.data+'">')+
                    '<button data-rm="'+i+'" aria-label="הסר">×</button></div>';
                }).join('')+'</div>'
              : '')+
            '<div class="row-in">'+
              '<button id="cAttach" aria-label="צרף קובץ">'+icon('camera')+'</button>'+
              '<textarea id="cTxt" rows="1" placeholder="כתוב הודעה"'+(busy?' disabled':'')+'></textarea>'+
              '<button class="go" id="cSend" aria-label="שלח"'+(busy?' disabled':'')+'>'+icon('send')+'</button>'+
            '</div>'+
            '<input id="cFile" type="file" accept="image/*,application/pdf" multiple hidden>'+
          '</div>'+
        '</div>'+
      '</div>';

    const logEl = bg.querySelector('#cLog');
    logEl.scrollTop = logEl.scrollHeight;
    wire();
  }

  function say(text){ chat.push({role:'sys', text:text}); draw(); }

  function addFiles(list){
    const room = 6 - tray.length;
    const files = Array.prototype.slice.call(list, 0, Math.max(0, room));
    if(!files.length){ say('אפשר לצרף עד שישה קבצים בהודעה.'); return; }
    busy = true; draw();
    Promise.all(files.map(prepFile)).then(function(prepped){
      prepped.forEach(function(f){ tray.push(f); });
      busy = false; draw();
    }).catch(function(err){
      busy = false; draw(); say(err.message);
    });
  }

  function send(){
    const txt = bg.querySelector('#cTxt');
    const body = (txt ? txt.value : '').trim();
    if(!body && !tray.length) return;

    chat.push({role:'user', text:body, files:tray.slice()});
    tray = [];
    busy = true; draw();

    const payload = chat
      .filter(function(m){ return m.role === 'user' || m.role === 'assistant'; })
      .map(function(m){ return {role:m.role, text:m.text, files:m.files || []}; });

    callFn(CFG.addQuestionUrl, {messages:payload}).then(function(res){
      busy = false;
      if(!res.ok){
        logError('function', 'add-question → ' + res.status + ' ' + (res.body.error||''), null);
        chat.push({role:'sys', text: res.body.error || ('השרת החזיר ' + res.status)});
        draw();
        return;
      }
      const b = res.body;
      if(b.reply) chat.push({role:'assistant', text:b.reply});
      if(b.applied){
        const a = b.applied;
        chat.push({role:'done', text:
          (a.created ? 'נוצר נושא חדש: ' + (a.deck||'') : 'נוסף ל־' + (a.deck||'')) +
          ' · ' + (a.added || 0) + ' פריטים'});
        syncLibrary();
      }
      draw();
    });
  }

  function wire(){
    bg.querySelector('#cClose').addEventListener('click', close);
    Array.prototype.forEach.call(bg.querySelectorAll('.ex'), function(b){
      b.addEventListener('click', function(){
        const t = bg.querySelector('#cTxt');
        t.value = b.dataset.ex; t.focus();
      });
    });
    Array.prototype.forEach.call(bg.querySelectorAll('[data-rm]'), function(b){
      b.addEventListener('click', function(){ tray.splice(+b.dataset.rm, 1); draw(); });
    });
    const fileInput = bg.querySelector('#cFile');
    bg.querySelector('#cAttach').addEventListener('click', function(){ fileInput.click(); });
    fileInput.addEventListener('change', function(){
      const l = fileInput.files; fileInput.value = '';
      if(l && l.length) addFiles(l);
    });
    const sendBtn = bg.querySelector('#cSend');
    if(sendBtn) sendBtn.addEventListener('click', send);
    const txt = bg.querySelector('#cTxt');
    if(txt){
      txt.addEventListener('keydown', function(e){
        if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
      });
      txt.addEventListener('input', function(){
        txt.style.height = 'auto';
        txt.style.height = Math.min(120, txt.scrollHeight) + 'px';
      });
      if(!busy) txt.focus();
    }
  }

  /* הדבקה מהלוח — צילום מסך ישר לתוך השיחה */
  bg.addEventListener('paste', function(e){
    const items = (e.clipboardData && e.clipboardData.items) || [];
    const files = [];
    for(let i=0;i<items.length;i++){
      if(items[i].kind === 'file'){
        const f = items[i].getAsFile();
        if(f) files.push(f);
      }
    }
    if(files.length){ e.preventDefault(); addFiles(files); }
  });
  /* גרירה לתוך החלון */
  bg.addEventListener('dragover', function(e){ e.preventDefault(); });
  bg.addEventListener('drop', function(e){
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
      e.preventDefault(); addFiles(e.dataTransfer.files);
    }
  });
  bg.addEventListener('click', function(e){ if(e.target === bg) close(); });

  document.body.appendChild(bg);
  draw();
}

   הרשת הביטחונית היא בדיקת העשן ב-CI: כשהיא נכשלת, הגרסה החיה נשארת.

function renderLab(){
  const busy = view.busy || false;
  app.innerHTML =
  '<div class="bar">'+
    '<button class="icon-btn" id="backBtn" aria-label="חזרה">'+icon('arrow')+'</button>'+
    '<div class="title">מעבדה</div>'+
  '</div>'+
  '<div class="lab-wrap">'+
    '<div class="lab-warn">כאן משנים את <b>קוד האפליקציה</b>, לא את התוכן. '+
      'השינוי נדחף ישירות ל-main, ובדיקת העשן רצה לפני הפרסום. '+
      'אם היא נכשלת — הגרסה שבטלפון נשארת כמו שהיא, והשינוי פשוט לא מתפרסם.</div>'+
    '<div><label for="labTxt">מה לשנות</label>'+
      '<textarea id="labTxt" placeholder="למשל: תגדיל את המבנה במסך השאלה · תוסיף מונה זמן לכל סבב · תשנה את צבע ההדגשה לכחול"'+
      (busy?' disabled':'')+'>'+esc(view.draft||'')+'</textarea></div>'+
    '<button class="send" id="labSend"'+(busy?' disabled':'')+'>'+(busy?'עובד…':'שלח')+'</button>'+
    '<button class="undo" id="labUndo"'+(busy?' disabled':'')+'>בטל את השינוי האחרון</button>'+
    (view.msg ? '<div class="lab-status '+view.cls+'">'+esc(view.msg)+'</div>' : '')+
  '</div>';

  app.querySelector('#backBtn').addEventListener('click', function(){ view={name:'home'}; render(); });
  const txt = app.querySelector('#labTxt');

  function call(payload, working){
    view.busy = true; view.msg = working; view.cls='work';
    view.draft = txt ? txt.value : view.draft;
    render();
    callFn(CFG.editAppUrl, payload).then(function(res){
      view.busy = false;
      if(!res.ok) logError('function', 'edit-app → ' + res.status + ' ' + (res.body.error||''), null);
      if(res.status===401){ view.msg = res.body.error || 'ההתחברות נדחתה.'; view.cls='bad'; }
      else if(!res.ok){ view.msg = res.body.error || ('השרת החזיר '+res.status); view.cls='bad'; }
      else{
        view.draft = '';
        view.msg = (res.body.summary||'בוצע') + ' — ' +
          (res.body.note || 'הבנייה רצה. רענן בעוד כדקה כדי לראות את התוצאה.');
        view.cls = 'ok';
      }
      render();
    }).catch(function(err){
      view.busy = false; view.msg = 'לא הצלחתי להתחבר: '+err.message; view.cls='bad'; render();
    });
  }

  app.querySelector('#labSend').addEventListener('click', function(){
    const body = txt.value.trim();
    if(!body){ view.msg='צריך לכתוב מה לשנות.'; view.cls='bad'; render(); return; }
    call({request:body}, 'Claude קורא את הקוד ומכין את השינוי…');
  });
  app.querySelector('#labUndo').addEventListener('click', function(){
    call({action:'rollback'}, 'מחזיר את הקומיט האחרון…');
  });
}

/* ===========================================================
   עיון — כל הכרטיסים גלויים, בלי ניקוד ובלי תזמון. מצב הזיכרון
   מוצג לצד כל כרטיס, כי בעיון זה מה שמכוון על מה להתעכב.
   =========================================================== */
function memChip(key){
  const st = cardState(key);
  if(!st) return '<span class="chip new">חדש</span>';
  const days = Math.round((st.due - Date.now()) / DAY);
  if(days <= 0) return '<span class="chip due">לחזרה</span>';
  return '<span class="chip">בעוד '+days+(days===1?' יום':' ימים')+'</span>';
}

function renderBrowse(){
  /* תצוגה מקדימה של אדמין בונה חבילה מהשורה עצמה, בלי להכניס אותה לספרייה */

  }).filter(function(r){
    if(!q) return true;
    return [r.b.title, r.b.sub, r.b.body, r.b.note, r.b.tag]
      .concat((r.b.rows || []).map(function(x){ return x.head + ' ' + x.text; }))

    else if(b.sym) lead = '<div class="lead"><span class="sym">'+esc(b.sym)+'</span></div>';

      (b.body ? '<div class="body'+(hide?' blur':'')+'">'+esc(b.body)+'</div>' : '')+
      (b.rows ? '<'+(b.ordered?'ol':'ul')+' class="body blist'+(hide?' blur':'')+'">'+
        b.rows.map(function(x){
          return '<li><b>'+unbroken(x.head)+'</b>'+(x.text ? ' <bdi class="via">'+esc(x.text)+'</bdi>' : '')+'</li>';
        }).join('')+'</'+(b.ordered?'ol':'ul')+'>' : '')+
      (b.note ? '<div class="note">'+esc(b.note)+'</div>' : '')+
      '<div class="row">'+memChip(r.key)+
        (b.tag ? '<span class="chip cat" style="color:'+safeColor(b.tagColor, 'var(--ink-2)')+
                 ';border-color:'+safeColor(b.tagColor, 'var(--line-2)')+'">'+esc(b.tag)+'</span>' : '')+
      '</div></div></div>';
  }).join('');

  app.innerHTML =
  '<div class="bar">'+
    '<button class="icon-btn" id="backBtn" aria-label="חזרה">'+icon('arrow')+'</button>'+
    '<div class="title">'+esc(d.title)+' · עיון</div>'+
  '</div>'+
  '<div class="browse-wrap">'+
    '<div class="browse-bar">'+
      '<input id="bq" type="search" placeholder="סינון" value="'+esc(view.q||'')+'">'+
      '<button id="bhide" aria-pressed="'+hide+'">'+(hide?'הצג':'הסתר')+' תשובות</button>'+

      ? '<div class="cards">'+cards+'</div>'
      : '<p class="note">אין התאמה ל"'+esc(view.q||'')+'".</p>')+
    '<div class="browse-count">'+rows.length+' מתוך '+d.items.length+'</div>'+
  '</div>';

  app.querySelector('#backBtn').addEventListener('click', function(){
    if(view.preview){ openAdmin(view.fromTab); return; }
    view = {name:'deck', deck:d.id}; render();
  });
  app.querySelector('#bhide').addEventListener('click', function(){

  });

/* ===========================================================
   מאגר הנושאים — מה שלי, ומה שאחרים פרסמו. מינוי הוא חי:
   הבעלים מעדכן, וכל מי שרשום רואה מיד את הגרסה החדשה. פרסום של
   משתמש רגיל ממתין לאישור אדמין לפני שהוא מופיע לאחרים.
   =========================================================== */
function openStore(highlight){
  view = {name:'store', loading:true, mine:[], others:[], subs:[], review:{},
          highlight:highlight||null};
  render();
  /* הספרייה נמשכת דרך אותו מסלול כמו המסך הראשי, כדי ששני המסכים
     לא יוכלו להציג מצבים שונים. המינויים מגיעים מאותה טעינה. */
  Promise.all([syncLibrary(), fetchStore(), fetchReviewStatus()]).then(function(r){
    if(view.name !== 'store') return;
    const uid = UID;
    view.mine   = LIB.rows.filter(function(d){ return d.owner_id === uid; });
    const mineIds = view.mine.map(function(d){ return d.id; });
    const pub = r[1] || {};
    view.others = pub.ok ? pub.data.filter(function(d){ return mineIds.indexOf(d.id) < 0; }) : [];
    view.storeErr = pub.ok ? null : (pub.reason || 'לא הצלחתי לטעון');
    view.subs   = Array.isArray(LIB.subs) ? LIB.subs : [];
    /* נושא שאני רשום אליו ונערך מאז — לא במאגר עד שיאושר שוב, אבל עדיין
       אצלי. בלעדיו לא הייתה דרך להסיר אותו. */
    const listed = view.others.map(function(d){ return d.id; });
    LIB.rows.forEach(function(d){
      if(d.owner_id !== uid && view.subs.indexOf(d.id) > -1 && listed.indexOf(d.id) < 0)
        view.others.push(Object.assign({}, d, {awaiting:true}));
    });
    view.review = r[2] || {};
    view.libError = LIB.status !== 'ok' ? (LIB.reason || 'לא הצלחתי לרענן') : null;
    view.loading = false;
    /* נושא שהגיע מקישור מוצג ראשון, גם אם עוד לא נרשמתי אליו */
    if(view.highlight){
      const idx = view.others.map(function(x){ return x.id; }).indexOf(view.highlight);
      if(idx > 0) view.others.unshift(view.others.splice(idx,1)[0]);
      if(idx < 0 && mineIds.indexOf(view.highlight) < 0 && pub.ok)
        view.err = 'הנושא מהקישור לא נמצא. ייתכן שהוא עדיין ממתין לאישור, או שכבר אינו ציבורי.';
    }
    render();
  }).catch(function(){ view.loading = false; view.err = 'לא הצלחתי לטעון.'; render(); });
}

/* מצב הפרסום של נושא שלי, כפי שהשרת קבע אותו */
function pubState(d){
  const rv = (view.review || {})[d.id] || {};
  const st = rv.review_status || (d.visibility === 'public' ? 'approved' : 'none');
  if(d.visibility === 'public' && st === 'pending') return {cls:'wait', label:'ממתין לאישור', live:false};
  if(d.visibility === 'public') return {cls:'pub', label:'ציבורית', live:true};
  if(st === 'rejected') return {cls:'no', label:'נדחה', live:false, note:rv.review_note};
  return {cls:'', label:'פרטית', live:false};
}

/* ההיסטוריה של חבילה כפולה עוברת לזו שנשארת לפני המחיקה — אחרת
   תרגול שנעשה בעותק השני נראה כאילו נמחק */
function moveDeckKeys(fromId, toId){
  const from = fromId + ':', to = toId + ':';
  let moved = 0;
  Object.keys(CARDS).forEach(function(k){
    if(k.indexOf(from) !== 0) return;
    const nk = to + k.slice(from.length), st = CARDS[k];
    if(validState(st) && (!CARDS[nk] || st.last > CARDS[nk].last)){ CARDS[nk] = st; DIRTY[nk] = 1; }
    delete CARDS[k]; delete DIRTY[k];
    moved++;
  });
  if(moved) saveCards();
  return moved;
}

function renderStore(){
  const subs = Array.isArray(view.subs) ? view.subs : [];
  const isSub = function(id){ return subs.indexOf(id) > -1; };
  const admin = !!(AUTH && AUTH.admin);

  function card(d, mine){
    const count = d.item_count || 0;
    const ps = mine ? pubState(d) : null;
    const pub = d.visibility === 'public';
    return '<div class="scard'+(view.highlight===d.id ? ' hl' : '')+'">'+
      '<div class="txt"><strong>'+esc(d.title)+

      (mine && ps.note ? '<span class="rnote">הערת המאשר: '+esc(ps.note)+'</span>' : '')+
      (!mine && d.awaiting ? '<span class="rnote">נערך מאז שאושר — ממתין לאישור חוזר</span>' : '')+
      '</div>'+
      (mine
        ? (ps.live ? '<button class="act" data-link="'+esc(d.id)+'" aria-label="העתק קישור">קישור</button>' : '')+
          '<button class="act'+(pub?' on':'')+'" data-pub="'+esc(d.id)+'" data-to="'+(pub?'private':'public')+'">'+

  const mine = view.mine || [], others = view.others || [];
  const dups = duplicateDecks(mine);
  /* מה שקיים בחבילה המוטמעת ועוד לא בספרייה — כולל תוכן שנוצר
     במסלול הישן ונכתב לריפו במקום למסד */
  const have = {};
  mine.forEach(function(d){ have[d.kind + '|' + d.title] = true; });
  const missing = starterRows(UID).filter(function(r){
    return !have[r.kind + '|' + r.title];
  });
  app.innerHTML =
  '<div class="bar">'+
    '<button class="icon-btn" id="backBtn" aria-label="חזרה">'+icon('arrow')+'</button>'+
    '<div class="title">מאגר הנושאים</div>'+
  '</div>'+
  '<div class="store-wrap">'+
    (view.loading ? '<p class="note">טוען…</p>' : '')+
    (view.err ? '<div class="lib-warn">'+esc(view.err)+'</div>' : '')+
    (view.libError
      ? '<div class="lib-warn">הרשימה מהמטמון — '+esc(view.libError)+
          '<button id="storeRetry">נסה שוב</button></div>'
      : '')+
    (dups.length
      ? '<div class="panel share"><div class="share-row">'+
          '<div><strong>נמצאו '+dups.length+' כפילויות</strong>'+
          '<span>אותו נושא נוצר יותר מפעם אחת. הניקוי משאיר את הראשון שנוצר, '+
            'ומעביר אליו את היסטוריית התרגול של העותקים.</span></div>'+
          '<button class="act danger" id="dedupBtn">נקה</button>'+
        '</div></div>'
      : '')+
    (mine.length
      ? '<div class="store-sec"><h3>הנושאים שלי — פרסום ושיתוף</h3>'+
        '<p class="sec-note">'+(admin
          ? 'פרסום הופך נושא לגלוי לכל מי שמחובר, והם יוכלו להוסיף אותו לעצמם. '
          : 'פרסום שולח את הנושא לאישור. אחרי האישור הוא גלוי לכל מי שמחובר, והם יוכלו להוסיף אותו לעצמם. ')+
          'העריכה נשארת אצלך, וכל שינוי מגיע אליהם מיד.</p>'+
       mine.map(function(d){ return card(d, true); }).join('')+'</div>' : '')+
    '<div class="store-sec"><h3>פורסמו על ידי אחרים</h3>'+
      (view.storeErr
        ? '<div class="lib-warn">לא הצלחתי לטעון את המאגר ('+esc(view.storeErr)+').'+
            '<button id="storeRetry2">נסה שוב</button></div>'
        : others.length
          ? others.map(function(d){ return card(d, false); }).join('')
          : (view.loading ? '' : '<p class="note">אין כרגע חבילות ציבוריות.</p>'))+
    '</div>'+
    (!view.loading && missing.length
      ? '<div class="panel share"><div class="share-row">'+
          '<div><strong>'+(mine.length ? 'נושאים שממתינים לייבוא' : 'ערכת פתיחה')+'</strong>'+
          '<span>'+missing.map(function(r){ return esc(r.title); }).join(' · ')+
            ' — נוצרים כנושאים פרטיים שלך.</span></div>'+
          '<button class="act" id="seedBtn">ייבא '+missing.length+'</button>'+
        '</div></div>'
      : '')+
    '<p class="note">פרסום הופך נושא לקריא לכל מי שמחובר. עריכה נשארת אצל הבעלים, '+
      'ומי שרשום רואה תמיד את הגרסה העדכנית.</p>'+
  '</div>';

  const fail = function(b, label){
    return function(e){
      view.err = 'הפעולה נכשלה: ' + ((e && e.message) || 'שגיאה');
      if(b){ b.disabled = false; if(label) b.textContent = label; }
      render();
    };

  app.querySelector('#backBtn').addEventListener('click', function(){ view={name:'home'}; render(); });

  Array.prototype.forEach.call(app.querySelectorAll('[data-sub]'), function(b){
    b.addEventListener('click', function(){
      const id = b.dataset.sub;
      b.disabled = true;
      mutate(function(){ return isSub(id) ? unsubscribe(id) : subscribe(id); })
        .then(function(){ openStore(); })
        .catch(fail(b));

  const seedB = app.querySelector('#seedBtn');
  if(seedB) seedB.addEventListener('click', function(){
    seedB.disabled = true; seedB.textContent = 'מייבא…';
    importStarter().then(function(res){
      if(!res.ok){
        seedB.disabled = false; seedB.textContent = 'ייבא';
        view.err = res.error || 'הייבוא נכשל.';
        render();
        return;
      }
      openStore();
      if(res.note){ view.err = res.note; }
    });
  });

  ['#storeRetry', '#storeRetry2'].forEach(function(sel){
    const sr = app.querySelector(sel);
    if(sr) sr.addEventListener('click', function(){
      sr.disabled = true; sr.textContent = 'טוען…';

      else prompt('הקישור:', url);

  Array.prototype.forEach.call(app.querySelectorAll('[data-del]'), function(b){

    }).forEach(function(d){ const k = d.kind + '|' + d.title; if(!keep[k]) keep[k] = d.id; });

        moveDeckKeys(d.id, keep[d.kind + '|' + d.title]);
        return deleteDeck(d.id);

/* ===========================================================
   סטטיסטיקה. תחזית העומס נגזרת מ-CARDS המקומי ולכן זמינה גם אופליין;
   שיעור ההצלחה דורש את יומן החזרות מהשרת.
   =========================================================== */
const DAY_NAMES = ['א','ב','ג','ד','ה','ו','ש'];

/* רק כרטיסים שבספרייה הנוכחית. מפתחות יתומים (חבילה שנמחקה, מינוי
   שבוטל, מפתח ישן) היו נספרים כעומס שלעולם לא יגיע לחזרה. */
function libraryKeys(){
  const keys = [];
  DECKS.forEach(function(d){
    d.items.forEach(function(it){ keys.push(d.keyFn(it)); });
    if(d.map && d.map.isoPairs) d.map.isoPairs.forEach(function(p){ keys.push(d.keyFn(p)); });
  });
  return keys;
}
function forecast(days){
  const out = [];
  const start = new Date(); start.setHours(0,0,0,0);
  const keys = libraryKeys().filter(function(k){ return CARDS[k]; });
  for(let i=0;i<days;i++){
    const from = start.getTime() + i*DAY, to = from + DAY;
    let n = 0;
    keys.forEach(function(k){
      const due = CARDS[k].due;
      /* כל מה שבאיחור נופל להיום, כי זה מה שבאמת מחכה לך */
      if(i===0 ? due < to : (due >= from && due < to)) n++;
    });
    out.push({t:from, n:n, day:DAY_NAMES[new Date(from).getDay()]});
  }
  return out;
}

/* עמודות דקות, קצה נתונים מעוגל, רווח בין עמודות, רשת רצסיבית.
   סדרה אחת — אין מקרא, הכותרת היא שמה. */
function barChart(rows, opts){
  const W = 320, H = 132, padB = 20, padT = 14;
  const max = Math.max(1, rows.reduce(function(a,r){ return Math.max(a, r.n); }, 0));
  const gap = 2, bw = (W - gap*(rows.length-1)) / rows.length;
  const y = function(v){ return padT + (H - padT - padB) * (1 - v/max); };

  let grid = '', bars = '', labels = '';
  [0, max/2, max].forEach(function(v){
    const yy = y(v);
    grid += '<line x1="0" y1="'+yy+'" x2="'+W+'" y2="'+yy+'" stroke="var(--line)" stroke-width="1"/>';
    grid += '<text x="'+(W+4)+'" y="'+(yy+3.5)+'" font-size="9" fill="var(--ink-2)" '+
            'font-family="IBM Plex Sans, sans-serif">'+Math.round(v)+'</text>';
  });

  rows.forEach(function(r, i){
    const x = i*(bw+gap), h = Math.max(r.n ? 3 : 0, (H - padT - padB) * r.n/max);
    const top = H - padB - h;
    const fill = i===0 ? 'var(--c-o)' : 'var(--accent)';
    if(h > 0){
      bars += '<rect class="bar-mark" x="'+x+'" y="'+top+'" width="'+bw+'" height="'+h+'" '+
              'rx="'+Math.min(4, bw/2)+'" fill="'+fill+'"/>';
    }
    bars += '<rect class="bar-hit" x="'+x+'" y="'+padT+'" width="'+bw+'" height="'+(H-padT-padB)+'" '+
            'data-tip="'+esc((i===0?'היום':r.day)+' · '+r.n+' כרטיסים')+'"><title>'+
            esc((i===0?'היום':'בעוד '+i+' ימים')+': '+r.n+' כרטיסים')+'</title></rect>';
    /* תווית על כל עמודה שלישית בלבד — לא מספר על כל נקודה */
    if(i===0 || i % 3 === 0){
      labels += '<text x="'+(x+bw/2)+'" y="'+(H-6)+'" font-size="9" text-anchor="middle" '+
                'fill="var(--ink-2)" font-family="IBM Plex Sans, sans-serif">'+
                (i===0 ? 'היום' : r.day)+'</text>';
    }
  });

  return '<svg viewBox="-2 0 '+(W+26)+' '+H+'" role="img" dir="ltr" '+
    'aria-label="'+esc(opts.alt)+'">'+grid+bars+labels+'</svg>';
}

/* יומן החזרות מהשרת, בעמודים, ועוד מה שעוד לא נשלח מהמכשיר — אחרת
   תרגול אופליין לא נספר עד שהרשת חוזרת */
function loadStats(){
  view.stats = {loading:true};
  render();
  const since = new Date(Date.now() - 30*DAY).toISOString();
  const all = [];
  const page = function(offset, n){
    return readPage('review_log?select=rating,reviewed_at,client_id&user_id=eq.' + UID +
                    '&reviewed_at=gte.' + since + '&order=reviewed_at.desc&limit=1000&offset=' + offset)
      .then(function(rows){
        rows.forEach(function(r){ all.push(r); });
        if(rows.length && n < 10) return page(offset + rows.length, n + 1);
      });
  };
  const q = canSyncUser()
    ? page(0, 0).then(function(){ return true; }, function(){ return false; })
    : Promise.resolve(false);
  q.then(function(fromServer){
    const sent = {};
    all.forEach(function(l){ if(l.client_id) sent[l.client_id] = 1; });
    const sinceT = Date.parse(since);
    const logs = all.concat(LOGQ.filter(function(e){
      return !sent[e.id] && Date.parse(e.reviewed_at) >= sinceT;
    }));
    const week = Date.now() - 7*DAY;
    view.stats = {
      loading:false,
      fromServer: fromServer,
      total: logs.length,
      correct: logs.filter(function(l){ return l.rating > 1; }).length,
      week: logs.filter(function(l){ return Date.parse(l.reviewed_at) >= week; }).length,
    };
    render();
  });
}

function renderStats(){
  const st = view.stats || {loading:true};
  const items = DECKS.reduce(function(a,d){ return a.concat(d.items.map(function(it){
    return {deck:d, key:d.keyFn(it)}; })); }, []);
  const seen = items.filter(function(x){ return cardState(x.key); }).length;
  const mastered = items.filter(function(x){ const c=cardState(x.key); return c && c.s>=21; }).length;
  const rows = forecast(14);
  const acc = st.total ? Math.round(st.correct / st.total * 100) : null;

  app.innerHTML =
  '<div class="bar">'+
    '<button class="icon-btn" id="backBtn" aria-label="חזרה">'+icon('arrow')+'</button>'+
    '<div class="title">סטטיסטיקה</div>'+
  '</div>'+
  '<div class="stats-wrap">'+
    '<div class="hero">'+
      '<div class="tile"><b dir="ltr">'+(acc===null?'—':acc+'%')+'</b>'+
        '<span>שיעור הצלחה · 30 יום</span></div>'+
      '<div class="tile"><b dir="ltr">'+(st.loading?'…':st.week)+'</b>'+
        '<span>חזרות בשבוע האחרון</span></div>'+
      '<div class="tile"><b dir="ltr">'+mastered+'<span style="font-size:14px;color:var(--ink-2)">/'+items.length+'</span></b>'+
        '<span>נשלטים</span></div>'+
    '</div>'+

    '<div class="panel-chart">'+
      '<h3>תחזית עומס</h3>'+
      '<p class="cap">כמה כרטיסים ממתינים לחזרה בכל יום. העמודה הראשונה כוללת גם מה שכבר באיחור.</p>'+
      barChart(rows, {alt:'תחזית חזרות לארבעה־עשר הימים הקרובים'})+
    '</div>'+

    '<div>'+
      '<h3 style="font-family:\'IBM Plex Sans\',sans-serif;font-size:11px;font-weight:600;'+
        'letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px">לפי נושא</h3>'+
      '<div class="dtable">'+DECKS.map(function(d){
        const dm = masteredCount(d.items, d.keyFn), dd = dueCount(d.items, d.keyFn);
        return '<div class="drow"><span class="dot" style="background:'+safeColor(d.color)+'"></span>'+
          '<span class="nm">'+esc(d.title)+'</span>'+
          '<span class="num"><b>'+dm+'</b>/'+d.items.length+' נשלטים · <b>'+dd+'</b> לחזרה</span></div>';
      }).join('')+'</div>'+
    '</div>'+

    '<p class="note">'+seen+' מתוך '+items.length+' כרטיסים כבר נראו. '+
      (st.loading || st.fromServer ? '' : 'בלי חיבור לשרת — הנתונים כוללים רק את מה שבמכשיר.')+'</p>'+
  '</div>';

  app.querySelector('#backBtn').addEventListener('click', function(){ view={name:'home'}; render(); });

  /* שכבת ריחוף — נגיעה או מעבר עכבר על עמודה */
  const tip = document.createElement('div');
  tip.className = 'tip';
  document.body.appendChild(tip);
  const show = function(e){
    const t = e.currentTarget.dataset.tip;
    tip.textContent = t; tip.classList.add('on');
    const r = e.currentTarget.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(window.innerWidth - tip.offsetWidth - 8,
                                          r.left + r.width/2 - tip.offsetWidth/2)) + 'px';
    tip.style.top = (r.top - tip.offsetHeight - 6) + 'px';
  };
  const hide = function(){ tip.classList.remove('on'); };
  Array.prototype.forEach.call(app.querySelectorAll('.bar-hit'), function(b){
    b.addEventListener('mouseenter', show);
    b.addEventListener('mouseleave', hide);
    b.addEventListener('touchstart', show, {passive:true});
    b.addEventListener('touchend', hide);
  });
}

/* ===========================================================
   ניהול — אדמין בלבד. ההרשאה נאכפת בשרת (is_admin ב-RLS ובפונקציות
   admin_*); הכפתור כאן רק מסתיר את מה שממילא ייחסם.
     לאישור    — נושאים שמשתמשים פרסמו ומחכים לאישור, או שהשתנו מאז
     ציבוריות  — כל מה שמוצג במאגר, והסתרה או מחיקה שלו
     משתמשים   — מי פעיל, והאם הסנכרון שלו באמת מגיע לשרת
     מערכת     — מצב המכשיר הזה, וסנכרון יזום
   =========================================================== */
const ADMIN = { pending: 0, seen: {} };   /* seen: הגרסה (updated_at) שנפתחה בתצוגה */

function rpc(name, args, quiet){
  return rest('rpc/' + name, {method:'POST', quiet:!!quiet, body: JSON.stringify(args || {})});
}
/* תשובה של פונקציה שעוד לא קיימת (מיגרציה 0006 לא הורצה) — הודעה ברורה */
function rpcJson(name, args, quiet){
  return rpc(name, args, quiet).then(function(r){
    if(r.ok) return r.json();
    return r.text().then(function(t){
      let m = t, code = '';
      try{ const j = JSON.parse(t); m = j.message || t; code = j.code || ''; }catch(e){}
      /* PGRST202 = הפונקציה לא קיימת. 404 אחר (PT404) הוא "לא נמצא" אמיתי */
      if(code === 'PGRST202' || (r.status === 404 && !code))
        throw new Error('צריך להריץ את מיגרציה 0006 ב-SQL Editor של Supabase');
      throw new Error(String(m || ('HTTP ' + r.status)).slice(0, 200));
    });
  });
}

/* מספר הממתינים לכפתור בבית — שקט, בלי יומן, כי לפני המיגרציה זה צפוי להיכשל */
function loadAdminBadge(){
  if(!AUTH || !AUTH.admin || !canSyncUser()) return Promise.resolve();
  return rpcJson('admin_moderation', {}, true).then(function(rows){
    const n = (Array.isArray(rows) ? rows : []).filter(function(d){ return d.review_status === 'pending'; }).length;
    if(n !== ADMIN.pending){ ADMIN.pending = n; render(); }
  }).catch(function(){});
}

function openAdmin(tab){
  view = {name:'admin', tab: tab || 'queue', loading:true, decks:[], users:null, err:null, note:null};
  render();
  loadAdmin();
}
function loadAdmin(){
  const v = view;
  v.loading = true; v.err = null;
  const want = v.tab === 'users'
    ? rpcJson('admin_users').then(function(rows){ v.users = Array.isArray(rows) ? rows : []; })
    : v.tab === 'system'
      ? Promise.resolve()
      : rpcJson('admin_moderation').then(function(rows){
          v.decks = Array.isArray(rows) ? rows : [];
          ADMIN.pending = v.decks.filter(function(d){ return d.review_status === 'pending'; }).length;
        });
  return want.then(function(){ v.loading = false; v.loaded = true; if(view === v) render(); },
                   function(e){ v.loading = false; v.loaded = true; v.err = e.message; if(view === v) render(); });
}

function fmtWhen(t){
  if(!t) return '—';
  const d = new Date(t);
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('he-IL') + ' ' + d.toLocaleTimeString('he-IL', {hour:'2-digit', minute:'2-digit'});
}

function renderAdmin(){
  const v = view;
  /* חזרה למסך הזה בכפתור "אחורה" — הנתונים לא נטענו עדיין */
  if(!v.loaded && !v.loading){ loadAdmin(); }
  const tabs = [
    ['queue',  'לאישור', ADMIN.pending],
    ['public', 'ציבוריות', 0],
    ['users',  'משתמשים', 0],
    ['errors', 'יומן תקלות', 0],
    ['system', 'מערכת', 0]
  ];
  let body = '';
  if(v.tab === 'queue' || v.tab === 'public'){
    const rows = (v.decks || []).filter(function(d){
      return v.tab === 'queue'
        ? d.review_status === 'pending'
        : d.review_status !== 'pending';
    });
    body = rows.length ? rows.map(function(d){ return adminDeckRow(d, v.tab); }).join('')
      : (v.loading ? '' : '<p class="note">'+(v.tab === 'queue' ? 'אין נושאים שממתינים לאישור.' : 'אין נושאים ציבוריים.')+'</p>');
  } else if(v.tab === 'users'){
    body = (v.users || []).map(adminUserRow).join('') ||
      (v.loading ? '' : '<p class="note">אין משתמשים.</p>');
  } else if(v.tab === 'system'){
    body = adminSystem();
  }

  app.innerHTML =
  '<div class="bar">'+
    '<button class="icon-btn" id="backBtn" aria-label="חזרה">'+icon('arrow')+'</button>'+
    '<div class="title">ניהול</div>'+
  '</div>'+
  '<div class="admin-wrap">'+
    '<div class="tabs">'+tabs.map(function(t){
      return '<button data-tab="'+t[0]+'"'+(v.tab === t[0] ? ' class="on"' : '')+'>'+t[1]+
        (t[2] ? '<b>'+t[2]+'</b>' : '')+'</button>';
    }).join('')+'</div>'+
    (v.loading ? '<p class="note">טוען…</p>' : '')+
    (v.err ? '<div class="lib-warn">'+esc(v.err)+'<button id="admRetry">נסה שוב</button></div>' : '')+
    (v.note ? '<div class="diag-report">'+esc(v.note)+'</div>' : '')+
    body+
  '</div>';

  app.querySelector('#backBtn').addEventListener('click', function(){ view = {name:'home'}; render(); });
  Array.prototype.forEach.call(app.querySelectorAll('[data-tab]'), function(b){
    b.addEventListener('click', function(){
      if(b.dataset.tab === 'errors'){ openErrors(); return; }
      if(b.dataset.tab === v.tab) return;
      openAdmin(b.dataset.tab);
    });
  });
  const rt = app.querySelector('#admRetry');
  if(rt) rt.addEventListener('click', function(){ loadAdmin(); render(); });
  wireAdminDecks(v);
  if(v.tab === 'system') wireAdminSystem(v);
}

function adminDeckRow(d, tab){
  const pending = d.review_status === 'pending';
  const changed = pending && d.reviewed_at;       /* אושר בעבר ושונה מאז */
  const st = d.visibility !== 'public'
    ? (d.review_status === 'rejected' ? 'נדחה' : 'פרטי')
    : pending ? (changed ? 'שונה אחרי אישור' : 'ממתין') : 'מאושר';
  return '<div class="arow">'+
    '<div class="ahead"><strong>'+esc(d.title || 'ללא כותרת')+'</strong>'+
      '<span class="vis '+(pending ? 'wait' : d.visibility === 'public' ? 'pub' : 'no')+'">'+st+'</span></div>'+
    '<div class="meta">'+
      '<b>'+esc(d.owner_email || String(d.owner_id || '').slice(0,8))+'</b> · '+
      (d.item_count || 0)+' פריטים · '+(d.subscribers || 0)+' מנויים · עודכן '+esc(fmtWhen(d.updated_at))+
      (d.subtitle ? '<br>'+esc(d.subtitle) : '')+
      (d.review_note ? '<br><span class="warn">הערה: '+esc(d.review_note)+'</span>' : '')+
    '</div>'+
    '<div class="acts">'+
      '<button data-preview="'+esc(d.id)+'">תצוגה</button>'+
      (pending ? '<button class="ok" data-approve="'+esc(d.id)+'">אשר</button>' : '')+
      (d.visibility === 'public'
        ? '<button data-reject="'+esc(d.id)+'">'+(pending ? 'דחה' : 'הסתר')+'</button>' : '')+
      '<button class="danger" data-adel="'+esc(d.id)+'">מחק</button>'+
    '</div>'+
  '</div>';
}

function adminUserRow(u){
  /* יש לו נושאים ואין לו אף כרטיס בשרת — או שלא תרגל, או שהסנכרון שלו לא מגיע */
  const broken = (u.cards || 0) === 0 && (u.decks || 0) > 0;
  return '<div class="arow">'+
    '<div class="ahead"><strong>'+esc(u.email || String(u.user_id).slice(0,8))+'</strong>'+
      (u.is_admin ? '<span class="vis pub">אדמין</span>' : '')+'</div>'+
    '<div class="meta">'+
      'נכנס לאחרונה '+esc(fmtWhen(u.last_sign_in_at))+' · נרשם '+esc(fmtWhen(u.created_at))+'<br>'+
      '<b>'+(u.decks || 0)+'</b> נושאים · <b>'+(u.cards || 0)+'</b> כרטיסים בשרת'+
      (u.last_card_at ? ' (אחרון '+esc(fmtWhen(u.last_card_at))+')' : '')+
      ' · <b>'+(u.reviews_7d || 0)+'</b> חזרות בשבוע · <b>'+(u.errors_7d || 0)+'</b> תקלות בשבוע'+
      (broken ? '<br><span class="warn">אין לו כרטיסים בשרת. אם הוא מתרגל — הסנכרון שלו לא מגיע.</span>' : '')+
    '</div>'+
  '</div>';
}

function wireAdminDecks(v){
  const byId = function(id){ return (v.decks || []).filter(function(d){ return d.id === id; })[0] || {}; };
  const act = function(b, work, doneNote){
    b.disabled = true;
    return work().then(function(){
      v.note = doneNote;
      loadAdmin();
      syncLibrary();
    }, function(e){
      b.disabled = false;
      v.err = 'הפעולה נכשלה: ' + ((e && e.message) || 'שגיאה');
      /* הרשימה אולי ישנה (נמחק, השתנה) — טוענים מחדש; השגיאה נשארת */
      loadAdmin().then(function(){ v.err = v.err || 'הפעולה נכשלה: ' + ((e && e.message) || 'שגיאה'); render(); });
    });
  };
  Array.prototype.forEach.call(app.querySelectorAll('[data-approve]'), function(b){
    b.addEventListener('click', function(){
      const d = byId(b.dataset.approve);
      /* האישור הוא לגרסה שהאדמין ראה — ברשימה או בתצוגה. אם הבעלים שינה
         מאז, השרת מסרב (409) והרשימה נטענת מחדש. */

/* ===========================================================
   יומן התקלות — מסך אדמין. נטען דרך admin_error_log, שמוסיף את
   המייל של המשתמש; לפני המיגרציה — ישירות מהטבלה.

function errKindCls(k){ return ERR_KINDS.indexOf(k) > -1 ? k : 'client'; }

function openErrors(info){
  view = {name:'errors', loading:true, rows:[], filter:'', more:false, info:info || null};
  render();
  loadErrors(null);
}
function loadErrors(before){
  const v = view;
  const LIMIT = 100;
  rpcJson('admin_error_log', {p_before: before, p_limit: LIMIT, p_q: null}, true)
    .catch(function(){
      /* לפני מיגרציה 0006 — הדרך הישנה, בלי מייל */
      return readJson('error_log?select=id,at,kind,message,context,user_id,app,user_agent' +
                      (before ? '&id=lt.' + before : '') + '&order=id.desc&limit=' + LIMIT)
        .then(function(res){ if(!res.ok) throw new Error(res.reason); return res.data; });
    })
    .then(function(rows){
      if(view !== v) return;
      v.rows = (before ? v.rows : []).concat(rows || []);
      v.more = (rows || []).length === LIMIT;
      v.loading = false; v.err = null;
      render();
    }, function(e){
      if(view !== v) return;
      v.loading = false; v.err = 'לא הצלחתי לטעון: ' + ((e && e.message) || 'שגיאה');
      render();
    });
}

    (!view.loading && !view.err && !rows.length ? '<p class="note">אין תקלות. זה או שקט או שהלכידה לא עובדת.</p>' : '')+

    (view.more && !view.loading ? '<button class="lab-entry" id="emore">טען עוד</button>' : '')+

  app.querySelector('#backBtn').addEventListener('click', function(){
    if(AUTH && AUTH.admin) openAdmin('queue'); else { view={name:'home'}; render(); }
  });

/* ===========================================================
   כפתור "אחורה" של המכשיר. המסכים מתחלפים בזיכרון, בלי היסטוריה,
   ולכן אחורה יצא מהאפליקציה. כל מסך עמוק מקבל רשומת היסטוריה משלו,
   שנושאת את העומק שלו; אחורה מעלה את המסך עד העומק של הרשומה שאליה
   חזרנו. במסך הבית אין רשומה, כך שאחורה שם יוצא כרגיל.

   רשומות נוספות רק במעבר קדימה, שתמיד בא אחרי נגיעה. כרום מסמן רשומה
   שנוספה בלי נגיעה מאז החזרה האחרונה כ"דלגי" ואחורה קופץ מעליה —
   לכן popstate לעולם לא מוסיף רשומה.
   =========================================================== */
function parentOf(q, v){
  const deckOr = function(id){ return deckById(id) ? {name:'deck', deck:id} : {name:'home'}; };
  if(q) return deckOr(q.deck.id);
  if(v.name === 'home') return null;
  if(v.name === 'map') return deckOr(v.back);
  if(v.name === 'browse') return v.preview ? {name:'admin', tab:v.fromTab || 'queue'} : deckOr(v.deck);
  if(v.name === 'errors') return AUTH && AUTH.admin ? {name:'admin', tab:'queue'} : {name:'home'};
  return {name:'home'};
}
function depthOf(){
  if(authEnabled && !AUTH) return 0;
  let d = document.querySelectorAll('.sheet-bg').length, q = quiz, v = view, p;
  while((p = parentOf(q, v))){ d++; q = null; v = p; }
  return d;
}
function stepUp(){
  const sheets = document.querySelectorAll('.sheet-bg');
  if(sheets.length){ sheets[sheets.length-1].remove(); return true; }
  if(authEnabled && !AUTH) return false;
  const p = parentOf(quiz, view);
  if(!p) return false;
  quiz = null; view = p;
  return true;
}
function goBack(){ if(stepUp()){ syncHistory(); render(); } }

let histBusy = false;     /* history.back() שלנו בדרך — ה-popstate שלו אינו לחיצה */
function histEntry(){
  const s = history.state && history.state.shinun;
  if(!s) return null;
  return typeof s === 'object' ? s : {d:1, n:1};     /* {shinun:1} מהגרסה הקודמת */
}
function syncHistory(){
  if(histBusy) return;
  const want = depthOf(), e = histEntry(), have = e ? e.d : 0;
  if(want > have) history.pushState({shinun:{d:want, n:(e ? e.n : 0) + 1}}, '');
  else if(want < have){ histBusy = true; history.back(); }
}
window.addEventListener('popstate', function(){
  if(histBusy){ histBusy = false; syncHistory(); return; }
  const e = histEntry(), have = e ? e.d : 0;
  let moved = false;
  while(depthOf() > have && stepUp()) moved = true;
  syncHistory();          /* רק מסיר עודפים (למשל אחרי "קדימה"); לא מוסיף */
  if(moved) render();
});
/* גיליונות נפתחים ונסגרים ישירות ב-body, בלי render */
new MutationObserver(syncHistory).observe(document.body, {childList:true});
/* טעינה מחדש במסך עמוק (למשל עדכון גרסה) מתחילה בבית, על רשומה עמוקה
   של המסמך הקודם. חוזרים לרשומת הבסיס כדי שאחורה מהבית יצא. */
if(histEntry()){ histBusy = true; history.go(-histEntry().n); }

/* 48 מקומות בקוד קוראים ל-render, וכל תשובה אסינכרונית ציירה בעצמה.
   מכאן "מופיע לשנייה ונעלם". עכשיו כל הקריאות מתאחדות לציור אחד
   בפריים הבא, כך שאין מצב ביניים שמוצג. */
let renderPending = false;
function render(){
  if(renderPending) return;
  renderPending = true;
  const run = function(){ renderPending = false; paint(); };
  if(typeof requestAnimationFrame === 'function') requestAnimationFrame(run);
  else setTimeout(run, 0);
}
function renderNow(){ renderPending = false; paint(); }

/* גלילה לראש רק במעבר מסך. ציור חוזר של אותו מסך — תשובה, סנכרון
   ברקע, שיבוץ בתרגיל — משאיר את המשתמש איפה שהיה. */
let paintedAt = null;
/* מסך שקרס לא משאיר את המשתמש על תצוגה ישנה ללא מוצא: חוזרים הביתה
   ונרשמים ביומן. lastPaintError נשאר לבדיקת העשן. */
let lastPaintError = null;
function paint(){
  syncHistory();
  if(authEnabled && !AUTH){ renderLock(); window.scrollTo(0,0); paintedAt = 'lock'; return; }
  try{
    if(quiz && quiz.done) renderResults();
    else if(quiz) renderQuiz();
    else if(view.name==='deck') renderDeck();
    else if(view.name==='map') renderMap();
    else if(view.name==='lab') renderLab();
    else if(view.name==='browse') renderBrowse();
    else if(view.name==='store') renderStore();
    else if(view.name==='stats') renderStats();
    else if(view.name==='errors') renderErrors();
    else if(view.name==='admin') renderAdmin();
    else renderHome();
  }catch(e){
    const where = quiz ? 'quiz' : view.name;
    lastPaintError = where + ': ' + ((e && e.message) || e);
    logError('client', 'ציור ' + lastPaintError, null);
    if(quiz || view.name !== 'home'){
      quiz = null; view = {name:'home'};
      try{ renderHome(); }catch(e2){}
    }
  }
  const at = quiz ? 'quiz:' + quiz.i + (quiz.done ? ':done' : '') : view.name + ':' + (view.deck || '');
  if(at !== paintedAt) window.scrollTo(0,0);
  paintedAt = at;
}

document.addEventListener('keydown', function(e){
  /* מסך הנעילה מוצג מעל חידון שנשאר בזיכרון — לא עונים ממנו */
  if(authEnabled && !AUTH) return;
  if(!quiz || quiz.done) return;
  if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || '')) return;
  const q = quiz.qs[quiz.i];
  if(q.answered && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); next(); return; }
  const n = parseInt(e.key,10);
  if(n>=1 && n<=4 && !q.answered && q.options[n-1]) answer(q.options[n-1].id);
});

/* ===========================================================
   סנכרון מלא — נקודת כניסה אחת: באתחול, בחזרה לאפליקציה, כשהרשת
   חוזרת, ובמרווחים אחרי כישלון. ספרייה קודם, כי מפתחות ישנים של
   כרטיסים עוברים לפי החבילות שבה; הגדרות, יומן תקלות והרשאות במקביל.
   קריאה בזמן ריצה נרשמת לסבב אחד נוסף. זה מה שהחליף את כפתורי
   הרענון והאיפוס — המטמון מתעדכן לבד.
   =========================================================== */
let syncingAll = null, syncAllAgain = false, lastFullSync = 0;
let retryTimer = null, retryDelay = 0;
function syncAll(){
  if(syncingAll){ syncAllAgain = true; return syncingAll; }
  if(!canSync()) return Promise.resolve(false);
  syncingAll = ensureToken()
    .then(function(){ return (AUTH && AUTH.uid && UID) ? null : loadIdentity(); })
    .then(function(){
      if(!canSyncUser()) return false;
      lastFullSync = Date.now();
      let cardsOk = true;
      return Promise.all([
        syncLibrary().catch(function(){})
          .then(function(){ return syncCards(true); })
          .then(function(v){ cardsOk = v !== false; }),
        syncSettings(),
        flushErrors(),
        checkAdmin(),
        verifyAccess(false)
      ]).then(function(){ return LIB.status === 'ok' && cardsOk; });
    })
    .catch(function(err){
      logError('client', 'sync → ' + ((err && err.message) || 'נכשל'), null);
      return false;
    })
    .then(function(ok){
      syncingAll = null;
      scheduleRetry(ok);
      /* נושא שהגיע בקישור — נפתח כשיש כבר זהות וספרייה */
      if(pendingShare && canSyncUser()){ const id = pendingShare; pendingShare = null; openStore(id); }
      if(syncAllAgain){ syncAllAgain = false; return syncAll(); }
      return ok;
    });
  return syncingAll;
}

/* סנכרון שנכשל (שרת רדום, רשת חלשה) — ניסיון חוזר במרווח שגדל עד
   עשר דקות, ורק כשהאפליקציה גלויה */
function scheduleRetry(ok){
  if(retryTimer){ clearTimeout(retryTimer); retryTimer = null; }
  if(ok || !AUTH){ retryDelay = 0; return; }
  retryDelay = Math.min(600000, retryDelay ? retryDelay * 2 : 30000);
  retryTimer = setTimeout(function(){
    retryTimer = null;
    if(document.visibilityState === 'hidden') return;   /* החזרה לאפליקציה תסנכרן */
    syncAll();
  }, retryDelay);
}

/* גרסה חדשה של האפליקציה נבדקת גם כשהיא נשארת פתוחה ימים, לא רק בטעינה */
let lastUpdateCheck = 0;
function checkForUpdate(){
  if(Date.now() - lastUpdateCheck < 1800000) return;
  lastUpdateCheck = Date.now();
  try{
    if(navigator.serviceWorker && navigator.serviceWorker.getRegistration)
      navigator.serviceWorker.getRegistration()
        .then(function(r){ return r && r.update(); }).catch(function(){});
  }catch(e){}
}

/* חזרה לאפליקציה: סנכרון מלא אם עברה דקה, אחרת רק שליחה של מה
   שממתין. יציאה ממנה: שליחה, לפני שהמערכת מקפיאה את הדף. */
function resync(){
  if(!AUTH) return;
  checkForUpdate();
  ensureToken(false).then(function(){
    if(!canSync()) return;
    if(Date.now() - lastFullSync > 60000) syncAll();
    else syncCards(false);
  });
}
addEventListener('visibilitychange', function(){
  if(!AUTH) return;
  if(document.visibilityState === 'visible') resync();
  else if(canSyncUser() && (Object.keys(DIRTY).length || LOGQ.length)) syncCards(false);
});
addEventListener('online', function(){ if(AUTH) syncAll(); });
addEventListener('pageshow', function(e){ if(e.persisted) resync(); });

/* ===========================================================
   רצף העלייה. סדר אחד, מפורש, ובודק תלויות במקום להניח אותן.
   קודם קושרים את המשתמש לפי הטוקן (בלי רשת) ומציירים את הנתונים
   שלו מהמכשיר — כך שאין מסך ריק ואין נתונים של מישהו אחר — ורק אחר
   כך פונים לשרת. כל מה שדורש uid ממתין לזהות.
   =========================================================== */
let booted = false;
function boot(){
  if(booted) return Promise.resolve();
  booted = true;

  fillFromClaims();
  bindUser(AUTH ? authUid() : null);
  renderNow();                       /* מיידי, מהמטמון */
  if(!canSync()) return Promise.resolve();

  scheduleRefresh();
  return ensureToken()               /* טוקן תקף לפני כל קריאה */
    .then(function(){ return loadIdentity(); })   /* זהות אחת, לפני כל השאר */
    .then(function(){ return syncAll(); })
    .catch(function(err){
      logError('client', 'boot → ' + ((err && err.message) || 'נכשל'), null);
      render();
    });
}

/* קישור לנושא — נפתח במאגר, עם הנושא בראש הרשימה, אחרי הסנכרון
   הראשון. בלי מפגש הוא עובר דרך ההתחברות עם גוגל (signIn). */
(function(){
  const shared = new URLSearchParams(location.search).get('deck');
  if(!shared) return;
  history.replaceState(null, '', location.pathname);
  if(/^[0-9a-f-]{36}$/i.test(shared)) pendingShare = shared;
})();

boot();
</script>
